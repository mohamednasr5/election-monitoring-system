<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>تسجيل التصويت</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Cairo", "Segoe UI", Tahoma, sans-serif;
}

body {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  color: #fff;
  overflow-x: hidden;
}

.hidden {
  display: none !important;
}

/* Password Modal */
#password-modal {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(10px);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.pass-box {
  width: 95%;
  max-width: 400px;
  background: #fff;
  color: #222;
  padding: 35px 18px;
  border-radius: 18px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
  animation: pop 0.4s ease;
  text-align: center;
}

@keyframes pop {
  from {
    transform: scale(0.6);
    opacity: 0.2;
  }
  to {
    transform: scale(1);
    opacity: 1;
  }
}

.pass-title {
  font-size: 1.6em;
  font-weight: 900;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.pass-row {
  position: relative;
  margin-top: 20px;
}

.pass-input {
  width: 100%;
  padding: 14px 16px;
  text-align: center;
  border-radius: 12px;
  border: 2px solid #e0e7ff;
  background: #f8f9ff;
  font-size: 1.1em;
  transition: all 0.3s;
}

.pass-input:focus {
  outline: none;
  border-color: #667eea;
  box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
}

.pass-toggle {
  position: absolute;
  left: 15px;
  top: 52%;
  transform: translateY(-50%);
  font-size: 1.3em;
  color: #667eea;
  cursor: pointer;
  opacity: 0.6;
  transition: all 0.3s;
}

.pass-toggle:hover {
  opacity: 1;
}

.pass-btn {
  margin-top: 20px;
  width: 100%;
  padding: 13px;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: #fff;
  border: none;
  border-radius: 12px;
  font-size: 1.05em;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.3s;
}

.pass-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
}

.pass-err {
  margin-top: 12px;
  padding: 10px;
  border-radius: 8px;
  font-weight: bold;
  display: none;
  font-size: 0.95em;
  background: #ffebee;
  color: #c62828;
}

/* Logout Button */
.logout-btn {
  position: fixed;
  top: 20px;
  left: 20px;
  z-index: 1000;
  background: linear-gradient(135deg, #ff6b6b 0%, #c62828 100%);
  color: #fff;
  border: none;
  padding: 14px 26px;
  border-radius: 12px;
  font-weight: 700;
  font-size: 1.07em;
  cursor: pointer;
  transition: all 0.3s;
  box-shadow: 0 4px 12px rgba(198, 40, 40, 0.3);
}

.logout-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(198, 40, 40, 0.4);
}

.remote-logout-btn {
  width: 100%;
  margin-top: 15px;
  padding: 12px;
  background: #ffc107;
  color: #333;
  font-weight: bold;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  transition: background 0.3s;
}

.remote-logout-btn:hover {
  background: #ff9800;
}

/* Main Container */
.container {
  width: 100%;
  max-width: 420px;
  background: #fff;
  color: #222;
  padding: 26px;
  border-radius: 20px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
  animation: fade 0.5s ease;
}

@keyframes fade {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

h2 {
  text-align: center;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  font-size: 2em;
  font-weight: 900;
  margin-bottom: 10px;
}

.committee-info {
  text-align: center;
  margin-top: 12px;
  margin-bottom: 25px;
  background: linear-gradient(135deg, #f5f7ff 0%, #eff2ff 100%);
  padding: 12px;
  border-radius: 12px;
  border-left: 4px solid #667eea;
}

.committee-name {
  font-size: 1.06em;
  font-weight: 700;
  color: #667eea;
  margin-bottom: 4px;
}

.committee-address {
  font-size: 0.88em;
  color: #666;
  font-weight: 500;
}

/* Form Elements */
label {
  font-weight: 700;
  color: #333;
  margin-top: 16px;
  display: block;
}

input[type="text"] {
  width: 100%;
  padding: 13px 12px;
  border-radius: 12px;
  border: 2px solid #e0e7ff;
  background: #f8f9ff;
  font-size: 1em;
  transition: all 0.3s;
  margin-top: 8px;
}

input[type="text"]:focus {
  outline: none;
  border-color: #667eea;
  box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
}

/* Candidate List */
.candidate-list {
  margin-top: 10px;
  background: #f8f9ff;
  border: 2px solid #e0e7ff;
  border-radius: 14px;
  max-height: 320px;
  overflow-y: auto;
  padding: 8px;
}

.candidate-item {
  background: #fff;
  border: 1px solid #e8ecff;
  padding: 10px;
  border-radius: 12px;
  margin-bottom: 9px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: all 0.3s;
  cursor: pointer;
  border-left: 4px solid #667eea;
  min-height: 47px;
}

.candidate-item:hover {
  background: linear-gradient(135deg, #f5f7ff 0%, #eff2ff 100%);
  border-color: #667eea;
  box-shadow: 0 4px 12px rgba(102, 126, 234, 0.17);
}

.candidate-item.selected {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: #fff;
  border-left-color: #fff;
}

.c-left {
  display: flex;
  align-items: center;
  gap: 10px;
  flex: 1;
}

.num-circle {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: #667eea;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.97em;
  font-weight: 900;
}

.candidate-item.selected .num-circle {
  background: #fff;
  color: #667eea;
}

.c-name {
  font-weight: 700;
  word-break: break-word;
}

.c-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.c-icon {
  font-size: 1.5em;
}

input[type="checkbox"] {
  width: 22px;
  height: 22px;
  cursor: pointer;
  accent-color: #667eea;
}

/* Radio Section */
.sec-box {
  margin-top: 13px;
  background: linear-gradient(135deg, #f5f7ff 0%, #eff2ff 100%);
  border: 2px solid #e0e7ff;
  border-radius: 12px;
  padding: 12px;
}

.sec-title {
  font-weight: 700;
  color: #667eea;
  display: block;
  margin-bottom: 12px;
  font-size: 1em;
}

.radio-group {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.radio-item {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  padding: 8px;
  background: #fff;
  border-radius: 10px;
  border: 2px solid #e0e7ff;
  transition: all 0.3s;
}

.radio-item:hover {
  border-color: #667eea;
  background: #f8f9ff;
}

.radio-item input[type="radio"] {
  width: 18px;
  height: 18px;
  cursor: pointer;
  accent-color: #667eea;
}

.radio-item.selected {
  background: #667eea;
  color: #fff;
  border-color: #667eea;
}

/* Buttons */
.btn-row {
  display: flex;
  gap: 10px;
  margin-top: 23px;
}

button {
  flex: 1;
  padding: 13px;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  font-weight: 700;
  font-size: 1.03em;
  transition: all 0.3s;
}

.btn-primary {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: #fff;
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
}

.btn-reset {
  background: #e0e7ff;
  color: #667eea;
  font-weight: 700;
}

.btn-reset:hover {
  background: #d3ddff;
}

/* Upload Button */
.action-btn {
  width: 100%;
  margin-top: 15px;
  padding: 13px;
  background: linear-gradient(135deg, #4c28d3 0%, #7d45ff 100%);
  color: #fff;
  border: none;
  border-radius: 12px;
  font-size: 1.03em;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s;
}

.action-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(76, 40, 211, 0.4);
}

/* Messages */
.msg-warn,
.msg-confirm {
  display: none;
  margin-top: 12px;
  padding: 11px;
  border-radius: 10px;
  text-align: center;
  font-weight: 700;
  animation: slideDown 0.3s ease;
  font-size: 1em;
}

@keyframes slideDown {
  from {
    opacity: 0;
    transform: translateY(-10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.msg-warn {
  background: #ffebee;
  color: #c62828;
  border-left: 4px solid #c62828;
}

.msg-confirm {
  background: #e8f5e9;
  color: #2e7d32;
  border-left: 4px solid #2e7d32;
}

/* Notification Bubble */
#bubble {
  position: fixed;
  bottom: 13px;
  right: 13px;
  background: #fff;
  color: #222;
  padding: 16px;
  border-radius: 12px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
  font-size: 1em;
  font-weight: 700;
  display: none;
  width: 320px;
  max-width: calc(100vw - 26px);
  animation: slide 0.4s ease;
  border-left: 4px solid #667eea;
  z-index: 99999;
}

#bubble.active {
  display: flex;
  align-items: flex-start;
  gap: 10px;
}

#bubble-icon {
  font-size: 1.3em;
  min-width: 28px;
  text-align: center;
  margin-top: 2px;
}

#bubble-content {
  flex: 1;
  line-height: 1.55;
}

#bubble-close {
  background: none;
  border: none;
  font-size: 1.4em;
  color: #999;
  cursor: pointer;
  padding: 0;
  min-width: 28px;
  text-align: center;
  transition: all 0.3s;
  opacity: 0.6;
}

#bubble-close:hover {
  opacity: 1;
  color: #667eea;
}

@keyframes slide {
  from {
    transform: translateY(18px);
    opacity: 0;
  }
  to {
    transform: translateY(0);
    opacity: 1;
  }
}

/* Signature */
.sig {
  text-align: left;
  margin-top: 17px;
  color: #999;
  font-style: italic;
  font-size: 0.82em;
}

.sig a {
  color: #1e3c72;
  font-weight: 900;
  text-decoration: underline;
}

/* Responsive */
@media (max-width: 600px) {
  .container {
    max-width: 98vw;
    padding: 5vw;
    border-radius: 8px;
  }

  h2 {
    font-size: 1.5em;
  }

  .radio-group {
    grid-template-columns: 1fr;
  }

  .candidate-list {
    max-height: 340px;
  }

  .logout-btn {
    top: 7px;
    left: 6px;
    padding: 9px 13px;
    font-size: 0.95em;
    border-radius: 9px;
  }

  #bubble {
    max-width: calc(100vw - 30px);
    right: 10px;
    padding: 12px;
    font-size: 0.95em;
  }

  #bubble-close {
    position: absolute;
    right: 5px;
    top: 5px;
  }
}
</style>
</head>

    <button class="pass-btn" onclick="checkPass()">دخول</button>

<div class="container hidden" id="main-container">

    <div class="committee-address" id="committee-address-display"></div>

          <span>✗ باطل</span>
        </label>
      </div>
    </div>
    
    <div class="btn-row">
      <button type="submit" class="btn-primary">تسجيل التصويت</button>
      <button type="reset" class="btn-reset">إعادة ضبط</button>
    </div>
    
    <div id="msg-warn" class="msg-warn"></div>
    <div id="msg-confirm" class="msg-confirm"></div>
  </form>

  <button id="openUpload" class="action-btn">رفع محضر اللجنة 📄</button>

</div>

  const stored = localStorage.getItem("closedNotifications");
  if (stored) {
    try {
      closedNotifications = new Set(JSON.parse(stored));
    } catch (e) {
      closedNotifications = new Set();
    }
  }
}

function saveClosedNotifications() {
  try {
    localStorage.setItem("closedNotifications", JSON.stringify(Array.from(closedNotifications)));

}

async function tryCommitteeLogin(committee, info) {
  const presenceRef = ref(db, `presence/committee_${committee}`);
  const remoteLogoutBtn = document.getElementById("remote-logout-btn");
  
  try {
    const snapshot = await get(presenceRef);
    if (snapshot.exists()) {
      if (isAdmin) {
        remoteLogoutBtn.classList.remove("hidden");
      } else {
        const err = document.getElementById("pw-err");
        err.textContent = "⚠️ يوجد مندوب آخر فاتح هذه اللجنة";
        err.style.background = "#fff3cd";
        err.style.color = "#856404";
        err.style.display = "block";
        setTimeout(() => err.style.display = "none", 3500);
        return false;
      }
    } else {
      remoteLogoutBtn.classList.add("hidden");
    }

    if (!isAdmin) {
      committeeNumber = committee;
      myPresenceRef = presenceRef;
      const connectedRef = ref(db, '.info/connected');
      onValue(connectedRef, async (snap) => {
        if (snap.val() === true) {
          await onDisconnect(presenceRef).remove();
          await set(presenceRef, {
            online: true,
            loginTime: serverTimestamp(),
            committee: committee
          });
        }
      });
    } else {
      committeeNumber = committee;
      myPresenceRef = null;
    }

    document.getElementById("password-modal").classList.add("hidden");
    document.getElementById("main-container").classList.remove("hidden");
    document.getElementById("logout-btn").classList.remove("hidden");
    document.getElementById("welcome-title").textContent = (isAdmin ? "إدارة اللجنة " : "اللجنة ") + committee;
    document.getElementById("committee-name-display").textContent = info.name;
    document.getElementById("committee-address-display").textContent = info.address;
    
    // إظهار أو إخفاء النموذج حسب نوع المستخدم
    if (isAdmin) {
      document.getElementById("vote-form").style.display = 'none';
      document.getElementById("openUpload").style.display = 'none';
    } else {
      document.getElementById("vote-form").style.display = 'block';
      document.getElementById("openUpload").style.display = 'block';
    }
    
    setupNotificationListeners(committee);
    return true;
  } catch (error) {
    const err = document.getElementById("pw-err");
    err.textContent = "خطأ في الاتصال";
    err.style.display = "block";
    setTimeout(() => err.style.display = "none", 2000);
    return false;
  }
}

window.remoteLogout = async function() {
  if (!isAdmin || committeeNumber < 1 || committeeNumber > 60) {
    alert("خطأ: لا تملك الصلاحية لإجراء هذه العملية.");
    return;
  }
  
  const confirmLogout = confirm(`هل أنت متأكد من إخراج المشرف الحالي من اللجنة ${committeeNumber}؟`);
  if (!confirmLogout) return;
  
  const presenceRef = ref(db, `presence/committee_${committeeNumber}`);
  try {
    await remove(presenceRef);
    document.getElementById("remote-logout-btn").classList.add("hidden");
    showConfirm(`تم إخراج المشرف من اللجنة ${committeeNumber} بنجاح!`);
  } catch (error) {
    showWarn("فشل في إخراج المشرف.");
  }
};

window.logoutCommittee = async function() {
  if (myPresenceRef && committeeNumber > 0 && !isAdmin) {
    try {

  }
  location.reload();
};

window.checkPass = async function() {
  const val = document.getElementById("password-input").value.trim();
  const err = document.getElementById("pw-err");
  const numVal = parseInt(val);
  const ADMIN_PREFIX = "251988";
  const MAX_COMMITTEE = 60;

  if (val === ADMIN_PREFIX) {
    isAdmin = true;
    document.getElementById("password-modal").classList.add("hidden");
    document.getElementById("main-container").classList.remove("hidden");
    document.getElementById("logout-btn").classList.remove("hidden");
    document.getElementById("welcome-title").textContent = "مرحباً بـ Super Admin";
    document.getElementById("committee-name-display").textContent = "وصول غير مقيد";
    document.getElementById("committee-address-display").textContent = "صلاحيات مشرف عام";
    committeeNumber = 0;
    document.getElementById("remote-logout-btn").classList.add("hidden");
    document.getElementById("vote-form").style.display = 'none';
    setupNotificationListeners(0);
    return;
  }

  if (val.startsWith(ADMIN_PREFIX) && val.length >= 7 && val.length <= 8) {
    const committeeStr = val.substring(ADMIN_PREFIX.length);
    const committee = parseInt(committeeStr);
    if (!isNaN(committee) && committee >= 1 && committee <= MAX_COMMITTEE) {
      const info = committeeData[committee] || { name: "لجنة", address: "بدون عنوان" };
      isAdmin = true;
      await tryCommitteeLogin(committee, info);
      return;
    }
  }

  isAdmin = false;
  if (isNaN(numVal) || numVal < 100101 || numVal > 100160) {
    err.textContent = "كلمة السر غير صحيحة";
    err.style.display = "block";
    setTimeout(() => err.style.display = "none", 3000);
    return;
  }

  const committee = numVal - 100100;
  const info = committeeData[committee] || { name: "لجنة", address: "بدون عنوان" };
  await tryCommitteeLogin(committee, info);
};

function setupNotificationListeners(committee) {
  try {
    const allNotificationsRef = ref(db, "notifications/all");
    let lastAllTimestamp = 0;
    onValue(allNotificationsRef, (snapshot) => {
      const data = snapshot.val();
      if (data && typeof data === 'object') {
        Object.entries(data).forEach(([key, notif]) => {
          if (notif && notif.message && notif.timestamp && notif.timestamp > lastAllTimestamp) {
            lastAllTimestamp = notif.timestamp;
            showFloatingNotification(notif.message, "عام");
          }
        });
      }
    });

    if (committee >= 1 && committee <= 60 || committee === 0) {
      const committeeNotificationsRef = ref(db, "notifications/committee_" + committee);
      let lastCommitteeTimestamp = 0;
      onValue(committeeNotificationsRef, (snapshot) => {
        const data = snapshot.val();
        if (data && typeof data === 'object') {
          Object.entries(data).forEach(([key, notif]) => {
            if (notif && notif.message && notif.timestamp && notif.timestamp > lastCommitteeTimestamp) {
              lastCommitteeTimestamp = notif.timestamp;
              showFloatingNotification(notif.message, "لجنتك");
            }
          });
        }
      });
    }
  } catch (e) {}
}

function showFloatingNotification(msg, type) {
  const bubble = document.getElementById("bubble");
  const content = document.getElementById("bubble-content");
  const icon = document.getElementById("bubble-icon");
  const notificationId = type + "_" + Date.now();
  
  bubble.dataset.notificationId = notificationId;
  if (closedNotifications.has(notificationId)) return;
  
  content.textContent = msg;
  if (type === "عام") {
    bubble.style.borderLeft = "4px solid #667eea";
    icon.textContent = "📢";
  } else if (type === "لجنتك") {
    bubble.style.borderLeft = "4px solid #11998e";
    icon.textContent = "📩";
  } else {
    bubble.style.borderLeft = "4px solid #ffcc00";
    icon.textContent = "💬";
  }
  
  bubble.classList.add("active");
}

window.closeBubble = function() {
  const bubble = document.getElementById("bubble");
  const notificationId = bubble.dataset.notificationId;
  if (notificationId) {
    closedNotifications.add(notificationId);
    saveClosedNotifications();
  }
  bubble.classList.remove("active");
};

const listBox = document.getElementById("candidate-list");
candidates.forEach((c) => {
  const item = document.createElement("div");
  item.className = "candidate-item";
  
  const checkbox = document.createElement("input");
  checkbox.type = "checkbox";
  checkbox.value = c[1];
  checkbox.className = "candidate-checkbox";
  
  item.innerHTML = '<div class="c-left"><div class="num-circle">' + c[0] + '</div><div class="c-name">' + c[1] + '</div></div><div class="c-right"><span class="c-icon">' + c[2] + '</span></div>';
  item.appendChild(checkbox);
  
  item.addEventListener("click", (e) => {
    if (e.target !== checkbox) checkbox.checked = !checkbox.checked;
    checkLimit();
    updateStyle();
  });
  
  checkbox.addEventListener("change", () => {
    checkLimit();
    updateStyle();
  });
  
  listBox.appendChild(item);
});

function updateStyle() {
  document.querySelectorAll(".candidate-item").forEach((item) => {
    if (item.querySelector("input[type='checkbox']").checked)
      item.classList.add("selected");
    else
      item.classList.remove("selected");
  });
}

function checkLimit() {
  const sel = document.querySelectorAll('.candidate-checkbox:checked');
  if (sel.length > 2) {
    sel[sel.length - 1].checked = false;
    showWarn("يمكن اختيار مرشحين فقط");
    updateStyle();
  }
}

function showWarn(msg) {
  const el = document.getElementById("msg-warn");
  el.textContent = msg;
  el.style.display = "block";
  setTimeout(() => el.style.display = "none", 2500);
}

function showConfirm(msg) {
  const el = document.getElementById("msg-confirm");
  el.textContent = msg;
  el.style.display = "block";
  setTimeout(() => el.style.display = "none", 3000);
}

document.querySelectorAll("input[type='radio']").forEach(radio => {
  radio.addEventListener("change", function() {
    document.querySelectorAll(".radio-item").forEach(item => item.classList.remove("selected"));
    this.closest(".radio-item").classList.add("selected");
  });
});

document.getElementById("vote-form").addEventListener("submit", function(e) {
  e.preventDefault();
  
  if (committeeNumber === 0) return showWarn("لا يمكن تسجيل الأصوات بصلاحية المشرف العام.");
  if (committeeNumber < 1 || committeeNumber > 60) return showWarn("يرجى تسجيل الدخول للجنة أولاً.");
  
  let name = document.getElementById("voter-name").value.trim();
  if (!name) name = "بدون اسم";
  
  const sel = Array.from(document.querySelectorAll('.candidate-checkbox:checked')).map(v => v.value);
  const val = document.querySelector('input[name="vvalid"]:checked');
  
  if (sel.length < 1) return showWarn("اختر مرشح واحد على الأقل");
  if (!val) return showWarn("اختر حالة الصوت");
  
  const voteKey = Date.now();
  const voteRef = ref(db, "votes/" + voteKey);
  
  set(voteRef, {
    name: name,
    selected: sel,
    vote_validity: val.value,
    committee: committeeNumber,
    timestamp: voteKey
  }).then(() => {
    showConfirm("تم التسجيل بنجاح!");
    document.getElementById("vote-form").reset();
    updateStyle();
    document.querySelectorAll(".radio-item").forEach(item => item.classList.remove("selected"));
  }).catch(err => {
    showWarn("خطأ: " + err.message);
  });
});

document.getElementById("password-input").addEventListener("keypress", function(e) {
  if (e.key === "Enter") checkPass();
});
