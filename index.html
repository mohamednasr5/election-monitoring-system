    background: #fff; padding: 40px; border-radius: 20px;

  }
  .login-input {
    width: 100%; padding: 15px; margin: 20px 0;
    border: 2px solid #e2e8f0; border-radius: 10px;
    text-align: center; font-size: 1.2em; font-weight: bold; outline: none; transition: 0.3s;
  }
  .login-input:focus { border-color: #3b82f6; }
  
  .btn-login {
    width: 100%; padding: 12px; background: #3b82f6;
    color: #fff; border: none; border-radius: 10px;
    font-size: 1.1em; cursor: pointer; font-weight: bold; transition: 0.2s;
  }
  .btn-login:hover { background: #2563eb; transform: translateY(-2px); }

  /* Alert Box */
  .alert-box {
    background: #fee2e2; border-right: 5px solid #ef4444; color: #991b1b;
    padding: 12px; border-radius: 8px; margin-top: 15px; text-align: right;
    font-size: 0.9em; display: none; animation: shake 0.3s;
  }
  @keyframes shake { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-5px);} 75% {transform: translateX(5px);} }

  /* --- 2. Committee Interface (المندوب) --- */
  .comm-container {
    width: 100%; max-width: 500px; background: #fff; border-radius: 24px;
    padding: 25px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);

    position: absolute; top: 15px; left: 15px;

  .upload-btn { margin-top: 20px; background: #6366f1; color: #fff; padding: 12px; width: 100%; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; }

  .admin-container {

// ----------------------------------------------------
// 1. MAIN LOGIN HANDLER
// ----------------------------------------------------
window.handleLogin = async function() {
  const val = document.getElementById("pass-input").value;
  const errBox = document.getElementById("login-err");
  const errText = document.getElementById("err-text");

  // === ADMIN LOGIN ===
  if(val === "521988") {
    document.getElementById("login-modal").classList.add("hidden");
    document.getElementById("admin-panel").classList.remove("hidden");
    initAdminMonitor();
    return;
  }

  // === COMMITTEE LOGIN ===
  const num = parseInt(val) - 100100;
  if(num >= 1 && num <= 60) {
    // Check for duplicate session
    const sessionRef = ref(db, `active_sessions/${num}`);
    const snapshot = await get(sessionRef);
    
    if(snapshot.exists()) {
      errText.innerText = "⚠️ يوجد مندوب آخر متصل بهذه اللجنة!";
      errBox.style.display = "block";
      return;
    }

    // Proceed to login
    myCommittee = num;
    loginTime = Date.now();
    const info = committeesDB[num];
    
    document.getElementById("c-name").innerText = `لجنة ${num} - ${info.name}`;
    document.getElementById("c-addr").innerHTML = `<i class="fa-solid fa-location-dot"></i> ${info.address}`;
    
    // Register Session
    set(sessionRef, { status: 'online', timestamp: Date.now(), id: sessionID });
    onDisconnect(sessionRef).remove();

    // Listen if Admin Kicks me
    onValue(sessionRef, (snap) => {
      if(!snap.exists() && myCommittee !== 0) {
        alert("تم تسجيل خروجك بواسطة الأدمن!");
        location.reload();
      }
    });

    document.getElementById("login-modal").classList.add("hidden");
    document.getElementById("committee-panel").classList.remove("hidden");
    
    // --- بدء الاستماع للرسائل الجديدة ---
    startMessageListener();

  } else {
    errText.innerText = "الكود غير صحيح";
    errBox.style.display = "block";
  }
};

window.logout = function() {
  if(myCommittee !== 0) {
    remove(ref(db, `active_sessions/${myCommittee}`)).then(() => location.reload());
  } else {
    location.reload();
  }
};

// ----------------------------------------------------
// 2. COMMITTEE FUNCTIONS
// ----------------------------------------------------
window.addOne = function() {
  if(myCommittee === 0) return;
  const btn = document.getElementById("main-btn");
  btn.classList.add("btn-clicked-effect");
  setTimeout(() => btn.classList.remove("btn-clicked-effect"), 200);

  const key = Date.now();
  set(ref(db, "votes/" + key), {
    committee: myCommittee, count: 1, type: "single", timestamp: key
  }).then(() => showFlashMsg("✅ تم احتساب الناخب"));
};

window.addBulk = function() {
  const val = parseInt(document.getElementById("bulk-val").value);
  if(!val || val <= 0) return;
  if(confirm(`تأكيد إضافة ${val} ناخب؟`)) {
    const key = Date.now();
    set(ref(db, "bulk_counts/" + key), {
      committee: myCommittee, count: val, type: "bulk", timestamp: key
    }).then(() => {
      showFlashMsg(`✅ تم إضافة ${val}`);
      document.getElementById("bulk-val").value = "";
    });
  }
};

window.uploadFile = function() {
  const file = document.getElementById("file-up").files[0];
  if(!file) return;
  const formData = new FormData(); formData.append("image", file);
  showFlashMsg("⏳ جاري الرفع...");
  fetch(`https://api.imgbb.com/1/upload?key=${imgbbKey}`, {method: "POST", body: formData})
  .then(res => res.json())
  .then(data => {
    if(data.success) showFlashMsg("✅ تم الرفع بنجاح");
    else showFlashMsg("❌ فشل الرفع");
  });
};

function startMessageListener() {
  // الاستماع إلى عقدة "notifications" المتوافقة مع صفحة الأدمن
  onChildAdded(ref(db, 'notifications'), (snapshot) => {
    const msg = snapshot.val();
    // تجاهل الرسائل القديمة قبل الدخول
    if(!msg || msg.timestamp < loginTime) return;

    // 1. رسالة عامة للجميع
    if(msg.target === 'all') {
      showInboxMessage(msg.body, 'public', msg.timestamp);
    } 
    // 2. رسالة خاصة لهذه اللجنة فقط
    else if(msg.target == myCommittee) {
      showInboxMessage(msg.body, 'private', msg.timestamp);
    }
  });
}

function showInboxMessage(text, type, time) {
  // تشغيل الصوت
  const audio = document.getElementById("notif-sound");
  audio.play().catch(e => console.log("Audio blocked"));

  const container = document.getElementById("msg-container");
  const isPrivate = type === 'private';
  
  // إعداد النصوص والأيقونات حسب النوع
  const headerText = isPrivate ? '📩 رسالة خاصة لك' : '📢 رسالة للجميع';
  const headerClass = isPrivate ? 'msg-private' : 'msg-public';
  const icon = isPrivate ? '<i class="fa-solid fa-envelope-open-text"></i>' : '<i class="fa-solid fa-bullhorn"></i>';
  
  const msgDiv = document.createElement("div");
  msgDiv.className = `msg-box ${headerClass}`;
  
  const timeStr = new Date(time).toLocaleTimeString('ar-EG', {hour: '2-digit', minute:'2-digit'});
  
  msgDiv.innerHTML = `
    <div class="msg-header"><span>${icon} ${headerText}</span></div>
    <div class="msg-body">${text}</div>
    <div class="msg-footer">
        <span class="msg-time">${timeStr}</span>
        <button class="btn-close-msg" onclick="this.parentElement.parentElement.remove()">إغلاق <i class="fa-solid fa-xmark"></i></button>
    </div>
  `;
  
  container.appendChild(msgDiv);
}

// ----------------------------------------------------
// 3. ADMIN FUNCTIONS
// ----------------------------------------------------
function initAdminMonitor() {
  const list = document.getElementById("active-list");
  onValue(ref(db, "active_sessions"), (snapshot) => {
    list.innerHTML = "";
    if(!snapshot.exists()) {
      list.innerHTML = "<div style='color:#64748b; text-align:center; grid-column:1/-1;'>لا يوجد لجان نشطة حالياً</div>";
      return;
    }
    snapshot.forEach((child) => {
      const id = child.key;
      const data = child.val();
      const name = committeesDB[id] ? committeesDB[id].name : "غير معروف";
      const timeStr = new Date(data.timestamp).toLocaleTimeString("ar-EG");

      const div = document.createElement("div");
      div.className = "user-card";
      div.innerHTML = `
        <div class="u-header"><span class="status-dot"></span> لجنة ${id}</div>
        <div style="font-size:0.9em; color:#94a3b8;">${name}</div>
        <div class="u-time">دخل منذ: ${timeStr}</div>
        <button class="kick-btn" onclick="kickUser('${id}')">
          <i class="fa-solid fa-ban"></i> طرد المشرف
        </button>
      `;
      list.appendChild(div);
    });
  });
}

window.kickUser = function(id) {
  if(confirm(`طرد مشرف لجنة ${id}؟`)) {
    remove(ref(db, `active_sessions/${id}`))
      .then(() => showFlashMsg("تم طرد المشرف"))
      .catch((e) => alert("خطأ: " + e));
  }
};

function showFlashMsg(txt) {
  const msg = document.getElementById("flash-msg");
  msg.innerText = txt; msg.style.display = "block";
  setTimeout(() => msg.style.display = "none", 2000);
}

// Expose kickUser to window for HTML onclick
window.kickUser = window.kickUser; 
</script>
