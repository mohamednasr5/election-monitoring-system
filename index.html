<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>نظام مراقبة وحصر الانتخابات - التسجيل</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: "Cairo", "Tajawal", -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #222;
    }

    .container {
      max-width: 520px;
      width: 100%;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 40px 30px;
      position: relative;
      overflow: hidden;
      animation: slideIn 0.5s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: linear-gradient(90deg, #667eea, #764ba2, #f093fb);
    }

    h2 {
      text-align: center;
      color: #667eea;
      font-size: 1.8em;
      font-weight: 800;
      margin-bottom: 30px;
      letter-spacing: 1.2px;
    }

    /* ===== Password Modal ===== */
    .password-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(5px);
      z-index: 1000;
    }

    .password-modal.hidden {
      display: none;
    }

    .password-box {
      background: #fff;
      border-radius: 20px;
      padding: 50px 40px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
      max-width: 420px;
      width: 90%;
      text-align: center;
      animation: popIn 0.3s ease-out;
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: scale(0.9);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .lock-icon {
      font-size: 3em;
      margin-bottom: 20px;
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .password-box h3 {
      color: #667eea;
      font-size: 1.6em;
      margin-bottom: 10px;
    }

    .password-box p {
      color: #666;
      margin-bottom: 30px;
      font-size: 0.95em;
    }

    .password-input-group {
      position: relative;
      margin-bottom: 20px;
    }

    .password-input-group input {
      width: 100%;
      padding: 14px 45px 14px 20px;
      font-size: 1.1em;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      background: #f8f9fa;
      transition: all 0.3s;
      letter-spacing: 1px;
    }

    .password-input-group input:focus {
      outline: none;
      border-color: #667eea;
      background: #fff;
      box-shadow: 0 0 15px rgba(102, 126, 234, 0.2);
    }

    .toggle-password {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      font-size: 1.3em;
      cursor: pointer;
      color: #667eea;
      transition: transform 0.2s;
    }

    .toggle-password:hover {
      transform: translateY(-50%) scale(1.1);
    }

    .password-buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .btn-enter {
      flex: 1;
      padding: 14px 30px;
      font-size: 1.05em;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
    }

    .btn-enter:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
    }

    .password-error {
      color: #e74c3c;
      font-size: 0.9em;
      margin-top: 15px;
      display: none;
      animation: shake 0.4s;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    .password-error.show {
      display: block;
    }

    /* ===== Main Form ===== */
    .form-group {
      margin-bottom: 22px;
    }

    label {
      font-weight: 600;
      color: #35536b;
      display: block;
      margin-bottom: 8px;
      font-size: 1em;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 15px;
      font-size: 1.05em;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      background: #f8f9fa;
      transition: all 0.3s;
      box-sizing: border-box;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #667eea;
      background: #fff;
      box-shadow: 0 0 15px rgba(102, 126, 234, 0.2);
    }

    /* ===== Candidate Cards ===== */
    .candidate-list {
      margin: 25px 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 12px;
    }

    .candidate-card {
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      border: 2px solid #e0e0e0;
      border-radius: 15px;
      padding: 15px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
    }

    .candidate-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      border-color: #667eea;
    }

    .candidate-card input {
      position: absolute;
      opacity: 0;
      cursor: pointer;
    }

    .candidate-card input:checked + .candidate-symbol {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      transform: scale(1.1);
    }

    .candidate-card input:checked ~ .candidate-label {
      color: #667eea;
      font-weight: 700;
    }

    .candidate-symbol {
      font-size: 2.5em;
      margin-bottom: 8px;
      display: inline-block;
      transition: all 0.3s;
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      border-radius: 12px;
      border: 2px solid #e0e0e0;
    }

    .candidate-label {
      font-size: 0.85em;
      font-weight: 600;
      color: #666;
      transition: all 0.3s;
      word-break: break-word;
    }

    /* ===== Radio Group ===== */
    .sec {
      margin: 25px 0 20px;
      padding: 20px;
      background: #f8f9fa;
      border-radius: 15px;
      border-left: 5px solid #667eea;
    }

    .sec-title {
      font-weight: 700;
      color: #35536b;
      margin-bottom: 12px;
      display: block;
    }

    .radio-group {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .radio-group label {
      display: flex;
      align-items: center;
      margin: 0;
      cursor: pointer;
      font-weight: 600;
    }

    .radio-group input[type="radio"] {
      margin-right: 8px;
      cursor: pointer;
      accent-color: #667eea;
      width: 20px;
      height: 20px;
    }

    /* ===== Buttons ===== */
    .action-line {
      margin-top: 25px;
      display: flex;
      gap: 12px;
    }

    button[type="submit"],
    button[type="reset"] {
      flex: 1;
      padding: 13px 24px;
      font-size: 1.05em;
      font-family: inherit;
      border-radius: 12px;
      border: none;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    button[type="submit"] {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
    }

    button[type="submit"]:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.3);
    }

    button[type="reset"] {
      background: #e8eef7;
      color: #667eea;
      border: 2px solid #667eea;
    }

    button[type="reset"]:hover {
      background: #667eea;
      color: #fff;
    }

    /* ===== Messages ===== */
    .msg-confirm, .msg-warn {
      font-size: 1.05em;
      font-weight: 700;
      text-align: center;
      padding: 15px;
      border-radius: 12px;
      margin: 15px 0 0;
      display: none;
      animation: fadeIn 0.3s;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .msg-confirm {
      background: #d4edda;
      color: #237a4a;
      border: 2px solid #28a745;
    }

    .msg-warn {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #f5c6cb;
    }

    /* ===== Signature ===== */
    .right-sig {
      margin-top: 40px;
      text-align: center;
      color: #999;
      font-size: 0.9em;
      font-style: italic;
      border-top: 1px solid #eee;
      padding-top: 20px;
    }

    .hidden {
      display: none !important;
    }

    /* ===== Responsive ===== */
    @media (max-width: 650px) {
      .container {
        padding: 30px 20px;
      }

      h2 {
        font-size: 1.4em;
      }

      .password-box {
        padding: 40px 25px;
      }

      .candidate-list {
        grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
      }

      .candidate-symbol {
        font-size: 2em;
        width: 50px;
        height: 50px;
      }

      button[type="submit"],
      button[type="reset"] {
        font-size: 0.95em;
        padding: 11px 16px;
      }
    }

    @media (max-width: 380px) {
      .container {
        padding: 20px 15px;
        border-radius: 15px;
      }

      h2 {
        font-size: 1.2em;
      }

      .password-box {
        padding: 30px 15px;
        width: 95%;
      }

      .radio-group {
        flex-direction: column;
        gap: 12px;
      }

      .action-line {
        flex-direction: column;
      }
    }
  </style>
</head>
