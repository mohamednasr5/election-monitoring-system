<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>تسجيل التصويت – النظام الانتخابي</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
*{ margin:0; padding:0; box-sizing:border-box; font-family:"Cairo",sans-serif; }
body{
  background:linear-gradient(135deg,#1e3c72,#2a5298);
  min-height:100vh; display:flex; justify-content:center; align-items:center;
  padding:20px; color:#fff;
}
.hidden{ display:none !important; }

#password-modal{
  position:fixed; inset:0; background:rgba(0,0,0,.6); backdrop-filter:blur(6px);
  display:flex; justify-content:center; align-items:center; z-index:9999;
}
.pass-box{
  width:90%; max-width:390px; background:#fff; color:#222;
  padding:25px; border-radius:18px; box-shadow:0 10px 40px rgba(0,0,0,.4);
  animation:pop .4s ease; text-align:center;
}
@keyframes pop{ from{transform:scale(.6);opacity:.2} to{transform:scale(1);opacity:1} }

.pass-title{ font-size:1.5em; font-weight:900; color:#1e3c72; }
.pass-row{ position:relative; margin-top:15px; }
.pass-input{
  width:100%; padding:13px; text-align:center;
  border-radius:10px; border:2px solid #d7ddff; background:#f4f6ff; font-size:1.1em;
}
.pass-toggle{
  position:absolute; left:12px; top:50%; transform:translateY(-50%);
  font-size:1.4em; color:#1e3c72; cursor:pointer;
}
.pass-btn{
  margin-top:15px; width:100%; padding:12px; background:#1e3c72; color:#fff;
  border:none; border-radius:10px; font-size:1.05em;
  font-weight:bold; cursor:pointer; transition:.2s;
}
.pass-err{ margin-top:10px; color:#b90000; font-weight:bold; display:none; font-size:.9em; }

.container{
  width:100%; max-width:750px; background:#fff; color:#222;
  padding:30px; border-radius:20px;
  box-shadow:0 18px 50px rgba(0,0,0,.3);
  animation:fade .5s ease;
}
@keyframes fade{
  from{opacity:0; transform:translateY(20px);}
  to{opacity:1; transform:translateY(0);}
}

h2{text-align:center; color:#1e3c72; font-size:2em; font-weight:900;}
.subtitle{text-align:center; color:#555; margin-top:5px; margin-bottom:20px;}

label{ font-weight:700; color:#1e3c72; margin-top:15px; display:block; }
input[type=text]{
  width:100%; padding:12px; border-radius:10px;
  border:2px solid #d4ddff; background:#f7f9ff; font-size:1.05em;
}

.candidate-list{
  margin-top:12px; background:#f4f6ff; border:1px solid #d9e2ff;
  border-radius:14px; max-height:330px; overflow-y:auto; padding:12px;
}
.candidate-item{
  background:#fff; border:1px solid #dfe6ff; padding:10px 12px;
  border-radius:12px; margin-bottom:10px;
  display:flex; justify-content:space-between; align-items:center;
  transition:.2s; cursor:pointer;
}
.candidate-item:hover{ background:#eef3ff; border-color:#b7c8ff; }
.num-circle{
  width:28px; height:28px; border-radius:50%;
  background:#1e3c72; color:#fff;
  display:flex; align-items:center; justify-content:center;
  font-size:.9em; font-weight:900;
}
.c-name{ font-weight:700; color:#1e3c72; }
.c-icon{ font-size:1.6em; }

.sec-box{
  margin-top:12px; background:#eef2ff; border:1px solid #d3ddff;
  border-radius:12px; padding:14px;
}
.sec-box span{ font-weight:700; color:#1e3c72; display:block; margin-bottom:5px; }

.btn-row{ display:flex; gap:12px; margin-top:20px; }
button{
  flex:1; padding:12px; border:none; border-radius:12px;
  cursor:pointer; font-weight:700; font-size:1.05em; transition:.2s;
}
.btn-primary{ background:#1e3c72; color:#fff; }
.btn-primary:hover{ background:#152d55; }
.btn-reset{ background:#e8ecff; color:#1e3c72; }

.msg-warn, .msg-confirm{
  display:none; margin-top:12px; padding:11px; border-radius:10px;
  text-align:center; font-weight:700;
}
.msg-warn{ background:#ffd8dd; color:#900; }
.msg-confirm{ background:#d4edda; color:#137d37; }

#notify-btn{
  position:fixed; bottom:25px; left:25px;
  width:60px; height:60px; background:#ffcc00;
  border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:26px; color:#000; cursor:pointer;
  box-shadow:0 6px 20px rgba(0,0,0,.3); z-index:9999;
}

#bubble{
  position:fixed; bottom:100px; left:25px;
  background:#fff; color:#000;
  padding:15px; border-radius:12px;
  box-shadow:0 6px 20px rgba(0,0,0,.3);
  font-size:1em; font-weight:700;
  display:none; width:260px;
  animation:slide .4s ease;
}
@keyframes slide{
  from{transform:translateY(20px);opacity:0;}
  to{transform:translateY(0);opacity:1;}
}

.sig{text-align:left; margin-top:20px; color:#999; font-style:italic; font-size:.85em;}
</style>
</head>

<body>

<!-- زر الإشعار -->
<div id="notify-btn">🔔</div>
<div id="bubble"></div>

<!-- مودال الدخول -->
<div id="password-modal">
  <div class="pass-box">
    <div class="pass-title">من فضلك أدخل كلمة السر</div>

    <div class="pass-row">
      <input type="password" id="password-input" class="pass-input" placeholder="••••••" autocomplete="off">
      <span class="pass-toggle" onclick="togglePass()">👁</span>
    </div>

    <button class="pass-btn" onclick="checkPass()">دخول</button>
    <div id="pw-err" class="pass-err">كلمة السر غير صحيحة</div>
  </div>
</div>

<!-- الصفحة الرئيسية -->
<div class="container hidden" id="main-container">

  <h2 id="welcome-title">تسجيل التصويت</h2>
  <div class="subtitle">نظام مراقبة وحصر العملية الانتخابية</div>

  <form id="vote-form">
    <label>اسم الناخب:</label>
    <input type="text" id="voter-name" placeholder="اكتب اسم الناخب (اختياري)">

    <label>اختر المرشح (حتى 2):</label>
    <div class="candidate-list" id="candidate-list"></div>

    <div class="sec-box">
      <span>حالة الصوت:</span>
      <label><input type="radio" name="vvalid" value="صحيح"> صحيح</label>
      <label><input type="radio" name="vvalid" value="باطل"> باطل</label>
    </div>

    <div class="btn-row">
      <button type="submit" class="btn-primary">تسجيل التصويت</button>
      <button type="reset" class="btn-reset">إعادة ضبط</button>
    </div>

    <div id="msg-warn" class="msg-warn"></div>
    <div id="msg-confirm" class="msg-confirm"></div>
  </form>

  <div class="sig">تم تطوير النظام بواسطة المهندس محمد حماد</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import {
  getDatabase, ref, push
} from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

import {
  getMessaging, getToken, onMessage
} from "https://www.gstatic.com/firebasejs/9.23.0/firebase-messaging.js";

/* إعداد Firebase */
const firebaseConfig = {
  apiKey: "AIzaSyCxxXV_6CEo1fTp3rRbfwfYbe7WH0Cyg38",
  authDomain: "elahmadiya.firebaseapp.com",
  databaseURL: "https://elahmadiya-default-rtdb.firebaseio.com",
  projectId: "elahmadiya",
  storageBucket: "elahmadiya.firebasestorage.app",
  messagingSenderId: "594580767620",
  appId: "1:594580767620:web:f5be3b87d4c704854e53d1"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const messaging = getMessaging(app);

/* رقم اللجنة */
let committeeNumber = 0;

/* إظهار/إخفاء كلمة المرور */
window.togglePass = function(){
  const p = document.getElementById("password-input");
  p.type = (p.type === "password") ? "text" : "password";
};

/* تسجيل الدخول */
window.checkPass = function(){
  const val = document.getElementById("password-input").value.trim();
  const err = document.getElementById("pw-err");

  /* دخول الأدمن */
  if(val === "521988"){
    document.getElementById("password-modal").classList.add("hidden");
    document.getElementById("main-container").classList.remove("hidden");
    document.getElementById("welcome-title").textContent =
      "مرحباً بالمهندس محمد نصر كينج البرمجة";
    return;
  }

  /* دخول اللجان */
  if (val < 100101 || val > 100160) {
    err.style.display = "block";
    setTimeout(()=> err.style.display="none",1800);
    return;
  }

  committeeNumber = parseInt(val) - 100100;

  document.getElementById("password-modal").classList.add("hidden");
  document.getElementById("main-container").classList.remove("hidden");

  document.getElementById("welcome-title").textContent =
    "مرحبًا بكم في لجنة رقم " + committeeNumber;

  requestFCM();
};

/* تفعيل الإشعارات */
function requestFCM(){
  Notification.requestPermission().then((permission)=>{
    if(permission === "granted"){
      getToken(messaging,{
        vapidKey:"BC4Mh4NtSNGjRaIyPAtDrC1FcxQoPMoHDjrOTSwe9CzcppZcqOyeClR-zKo3R68r9iY_DyKPmoDUrmDdU0BR9W8"
      }).then((token)=>{
        if(token){
          push(ref(db, "tokens/" + committeeNumber), token);
        }
      });
    }
  });
}

/* استقبال الإشعارات داخل الصفحة */
onMessage(messaging, (payload)=>{
  const bubble = document.getElementById("bubble");
  bubble.textContent = payload.notification.body;
  bubble.style.display = "block";
  setTimeout(()=> bubble.style.display="none", 6000);
});

/* قائمة المرشحين */
const candidates = [
  ["1","ايهاب العمده","👑"],
  ["2","محمد العتمانى","🍞"],
  ["3","أحمد الحديدى","🦁"],
  ["4","عادل الجيار","🦅"],
  ["5","احمد محمد محمد سمره","💣"],
  ["6","وليد تيسير الامير","🐊"],
  ["7","كمال العيسوى","🌀"],
  ["8","البدوى جميز","🐋"],
  ["9","احمد الريس","🦂"],
  ["10","أحمد عوف","✋"],
  ["11","حسن الملهاط","🌿"],
  ["12","عمرو محمد بحيرى","🚌"],
  ["13","السيد طمان","🔫"],
  ["14","محمد دندن","🚁"],
  ["15","مجدى الأمير","🖊"]
];

/* إنشاء قائمة المرشحين */
const listBox = document.getElementById("candidate-list");
candidates.forEach(c => {
  const item = document.createElement("div");
  item.className = "candidate-item";

  const checkbox = document.createElement("input");
  checkbox.type = "checkbox";
  checkbox.value = c[1];
  checkbox.className = "candidate-checkbox";

  item.innerHTML = `
    <div class="c-left">
      <div class="num-circle">${c[0]}</div>
      <div class="c-name">${c[1]}</div>
    </div>
    <div class="c-right"><span class="c-icon">${c[2]}</span></div>
  `;

  item.appendChild(checkbox);

  item.addEventListener("click",(e)=>{
    if(e.target!==checkbox) checkbox.checked=!checkbox.checked;
    limitSelect(checkbox);
  });
  checkbox.addEventListener("change",()=> limitSelect(checkbox));

  listBox.appendChild(item);
});

/* اختيار مرشحين فقط */
function limitSelect(ch){
  const sel = document.querySelectorAll('.candidate-checkbox:checked');
  if(sel.length > 2){
    ch.checked = false;
    showWarn("يمكن اختيار مرشحين فقط");
  }
}

/* رسائل */
function showWarn(msg){
  const el = document.getElementById("msg-warn");
  el.textContent = msg;
  el.style.display = "block";
  setTimeout(()=> el.style.display="none",2000);
}
function showConfirm(msg){
  const el = document.getElementById("msg-confirm");
  el.textContent = msg;
  el.style.display = "block";
  setTimeout(()=> el.style.display="none",2500);
}

/* تسجيل التصويت */
document.getElementById("vote-form").addEventListener("submit",function(e){
  e.preventDefault();

  // اسم الناخب — اختياري
  let name = document.getElementById("voter-name").value.trim();
  if(name.length < 1){
      name = "No Name";
  }

  const sel = [...document.querySelectorAll('.candidate-checkbox:checked')].map(v=>v.value);
  const val = document.querySelector('input[name="vvalid"]:checked');

  if(sel.length<1) return showWarn("اختر مرشح واحد على الأقل");
  if(!val) return showWarn("اختر حالة الصوت");

  push(ref(db, "votes"), {
    name, selected:sel, validity:val.value,
    committee: committeeNumber,
    timestamp: Date.now()
  }).then(()=>{
    showConfirm("تم التسجيل بنجاح ✓");
    document.getElementById("vote-form").reset();
  });
});
</script>

</body>
</html>
