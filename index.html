<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>تسجيل التصويت – النظام الانتخابي</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
*{
  margin:0; padding:0; box-sizing:border-box;
  font-family:"Cairo",sans-serif;
}

body{
  background:linear-gradient(135deg,#1e3c72,#2a5298);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  color:#fff;
}

.hidden{ display:none !important; }

#password-modal{
  position:fixed; inset:0;
  background:rgba(0,0,0,.6);
  backdrop-filter:blur(6px);
  display:flex; justify-content:center; align-items:center;
  z-index:9999;
}
.pass-box{
  width:90%; max-width:390px;
  background:#fff; color:#222;
  padding:25px; border-radius:18px;
  box-shadow:0 10px 40px rgba(0,0,0,.4);
  animation:pop .4s ease;
  text-align:center;
}
@keyframes pop{
  from{transform:scale(.6);opacity:.2}
  to{transform:scale(1);opacity:1}
}
.pass-title{ font-size:1.5em; font-weight:900; color:#1e3c72; }
.pass-text{ color:#555; margin-top:5px; }

.pass-row{ position:relative; margin-top:15px; }
.pass-input{
  width:100%; padding:13px; text-align:center;
  border-radius:10px; border:2px solid #d7ddff;
  background:#f4f6ff; font-size:1.1em;
}
.pass-toggle{
  position:absolute; left:12px; top:50%;
  transform:translateY(-50%);
  font-size:1.4em; color:#1e3c72; cursor:pointer;
}

.pass-btn{
  margin-top:15px;
  width:100%; padding:12px;
  background:#1e3c72; color:#fff;
  border:none; border-radius:10px;
  font-size:1.05em; font-weight:bold;
  cursor:pointer; transition:.2s;
}
.pass-btn:hover{ background:#152d55; }

.pass-err{
  margin-top:10px; color:#b90000; font-weight:bold;
  display:none; font-size:.9em;
}

.container{
  width:100%; max-width:750px;
  background:#fff; color:#222;
  padding:30px; border-radius:20px;
  box-shadow:0 18px 50px rgba(0,0,0,.3);
  animation:fade .5s ease;
}
@keyframes fade{
  from{opacity:0; transform:translateY(20px);}
  to{opacity:1; transform:translateY(0);}
}

h2{
  text-align:center; color:#1e3c72;
  font-size:2em; font-weight:900;
}
.subtitle{
  text-align:center; color:#555;
  margin-top:5px; margin-bottom:20px;
}

label{ font-weight:700; color:#1e3c72; margin-top:15px; display:block; }
input[type=text]{
  width:100%; padding:12px;
  border-radius:10px;
  border:2px solid #d4ddff;
  background:#f7f9ff; 
  font-size:1.05em;
}

.candidate-list{
  margin-top:12px;
  background:#f4f6ff;
  border:1px solid #d9e2ff;
  border-radius:14px;
  max-height:330px;
  overflow-y:auto;
  padding:12px;
}
.candidate-item{
  background:#fff;
  border:1px solid #dfe6ff;
  padding:10px 12px;
  border-radius:12px;
  margin-bottom:10px;
  display:flex; justify-content:space-between; align-items:center;
  transition:.2s;
  cursor:pointer;
}
.candidate-item:hover{
  background:#eef3ff; border-color:#b7c8ff;
}
.c-left{ display:flex; align-items:center; gap:10px; }
.num-circle{
  width:28px; height:28px; border-radius:50%;
  background:#1e3c72; color:#fff;
  display:flex; align-items:center; justify-content:center;
  font-size:.9em; font-weight:900;
}
.c-name{ font-weight:700; color:#1e3c72; }
.c-icon{ font-size:1.6em; }

.sec-box{
  margin-top:12px;
  background:#eef2ff;
  border:1px solid #d3ddff;
  border-radius:12px;
  padding:14px;
}
.sec-box span{
  font-weight:700; color:#1e3c72;
  display:block; margin-bottom:5px;
}

.btn-row{
  display:flex; gap:12px;
  margin-top:20px;
}
button{
  flex:1;
  padding:12px;
  border:none; border-radius:12px;
  cursor:pointer; font-weight:700;
  font-size:1.05em;
  transition:.2s;
}
.btn-primary{ background:#1e3c72; color:#fff; }
.btn-primary:hover{ background:#152d55; }
.btn-reset{ background:#e8ecff; color:#1e3c72; }

.msg-warn, .msg-confirm{
  display:none; margin-top:12px;
  padding:11px; border-radius:10px;
  text-align:center; font-weight:700;
}
.msg-warn{ background:#ffd8dd; color:#900; }
.msg-confirm{ background:#d4edda; color:#137d37; }

.sig{
  text-align:left; margin-top:20px;
  color:#999; font-style:italic; font-size:.85em;
}
</style>
</head>

<body>

<!-- مودال كلمة السر -->
<div id="password-modal">
  <div class="pass-box">
    <div class="pass-title">من فضلك أدخل كلمة السر</div>
    <div class="pass-text">هذه الصفحة مخصصة للمشرفين فقط</div>

    <div class="pass-row">
      <input type="password" id="password-input" class="pass-input" placeholder="••••••" autocomplete="off">
      <span class="pass-toggle" onclick="togglePass()">👁</span>
    </div>

    <button class="pass-btn" onclick="checkPass()">دخول</button>
    <div id="pw-err" class="pass-err">كلمة السر غير صحيحة</div>
  </div>
</div>

<!-- الصفحة الرئيسية -->
<div class="container hidden" id="main-container">

  <h2>تسجيل التصويت</h2>
  <div class="subtitle">نظام مراقبة وحصر العملية الانتخابية</div>

  <form id="vote-form">
    <label>اسم الناخب:</label>
    <input type="text" id="voter-name" placeholder="اكتب اسم الناخب">

    <label>اختر المرشح (حتى 2):</label>
    <div class="candidate-list" id="candidate-list"></div>

    <div class="sec-box">
      <span>حالة الصوت:</span>
      <label><input type="radio" name="vvalid" value="صحيح"> صحيح</label>
      <label><input type="radio" name="vvalid" value="باطل"> باطل</label>
    </div>

    <div class="btn-row">
      <button type="submit" class="btn-primary">تسجيل التصويت</button>
      <button type="reset" class="btn-reset">إعادة ضبط</button>
    </div>

    <div id="msg-warn" class="msg-warn"></div>
    <div id="msg-confirm" class="msg-confirm"></div>
  </form>

  <div class="sig">تم تطوير النظام بواسطة المهندس محمد حماد</div>

</div>

<script>
// متغيرات التخزين المؤقت
let votesData = [];

// عرض/إخفاء الباسورد
function togglePass(){
  const p = document.getElementById("password-input");
  p.type = (p.type==="password") ? "text" : "password";
}

// التحقق من الباسورد
function checkPass(){
  const val = document.getElementById("password-input").value.trim();
  const modal = document.getElementById("password-modal");
  const main  = document.getElementById("main-container");
  const err   = document.getElementById("pw-err");

  if(val === "521988"){
    modal.classList.add("hidden");
    main.classList.remove("hidden");
    document.getElementById("voter-name").focus();
  }
  else{
    err.style.display="block";
    setTimeout(()=> err.style.display="none",1800);
  }
}

// قائمة المرشحين
const candidates = [
  ["1","ايهاب العمده","👑"],
  ["2","محمد العتمانى","🍞"],
  ["3","أحمد الحديدى","🦁"],
  ["4","عادل الجيار","🦅"],
  ["5","احمد محمد محمد سمره","💣"],
  ["6","وليد تيسير الامير","🐊"],
  ["7","كمال العيسوى","🌀"],
  ["8","البدوى جميز","🐋"],
  ["9","احمد الريس","🦂"],
  ["10","أحمد عوف","✋"],
  ["11","حسن الملهاط","🌿"],
  ["12","عمرو محمد بحيرى","🚌"],
  ["13","السيد طمان","🔫"],
  ["14","محمد دندن","🚁"],
  ["15","مجدى الأمير","🖊"]
];

// إنشاء المرشحين
const listBox = document.getElementById("candidate-list");
candidates.forEach(c => {
  const item = document.createElement("div");
  item.className = "candidate-item";
  
  const checkbox = document.createElement("input");
  checkbox.type = "checkbox";
  checkbox.value = c[1];
  checkbox.className = "candidate-checkbox";
  
  item.innerHTML = `
    <div class="c-left">
      <div class="num-circle">${c[0]}</div>
      <div class="c-name">${c[1]}</div>
    </div>
    <div class="c-right">
      <span class="c-icon">${c[2]}</span>
    </div>
  `;
  
  item.appendChild(checkbox);
  
  item.addEventListener("click", function(e){
    if(e.target !== checkbox){
      checkbox.checked = !checkbox.checked;
    }
    limitSelect(checkbox);
  });
  
  checkbox.addEventListener("change", function(){
    limitSelect(this);
  });
  
  listBox.appendChild(item);
});

// منع اختيار أكثر من 2
function limitSelect(ch){
  const sel = document.querySelectorAll('.candidate-checkbox:checked');
  if(sel.length > 2){
    ch.checked = false;
    showWarn("يمكن اختيار مرشحين فقط");
  }
}

// التحقق من صحة الاسم
function invalidName(name){
  if(name.length < 4) return true;
  if(/[0-9]/.test(name)) return true;
  if(/[^ء-يA-Za-z ]/.test(name)) return true;
  return false;
}

// التحقق من تكرار الاسم
function isNameUsed(name){
  return votesData.some(v => v.name === name);
}

// معالج تسجيل التصويت
document.getElementById("vote-form").addEventListener("submit", function(e){
  e.preventDefault();

  const name = document.getElementById("voter-name").value.trim();
  const sel = [...document.querySelectorAll('.candidate-checkbox:checked')].map(v => v.value);
  const val = document.querySelector('input[name="vvalid"]:checked');

  console.log("الاسم:", name);
  console.log("المرشحون:", sel);
  console.log("الحالة:", val ? val.value : null);

  if(invalidName(name))
    return showWarn("اسم الناخب غير صالح");

  if(sel.length < 1)
    return showWarn("اختر مرشح واحد على الأقل");

  if(!val)
    return showWarn("اختر حالة الصوت");

  if(isNameUsed(name))
    return showWarn("تم التصويت من قبل لهذا الاسم");

  // تسجيل التصويت
  votesData.push({
    name,
    selected: sel,
    vote_validity: val.value,
    timestamp: new Date().toISOString()
  });

  console.log("تم التسجيل بنجاح! البيانات:", votesData);

  showConfirm("تم التسجيل بنجاح ✓");
  document.getElementById("vote-form").reset();
  document.getElementById("voter-name").focus();
});

// عرض رسالة تحذير
function showWarn(msg){
  const el = document.getElementById("msg-warn");
  el.textContent = msg;
  el.style.display = "block";
  setTimeout(() => el.style.display = "none", 2000);
}

// عرض رسالة تأكيد
function showConfirm(msg){
  const el = document.getElementById("msg-confirm");
  el.textContent = msg;
  el.style.display = "block";
  setTimeout(() => el.style.display = "none", 2500);
}
</script>

</body>
</html>
