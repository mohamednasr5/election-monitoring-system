<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>تسجيل التصويت – النظام الانتخابي</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Cairo', 'Tajawal', -apple-system, BlinkMacSystemFont, sans-serif;
}

/* الخلفية العامة */
body {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 20px;
  color: #fff;
}

/* إخفاء العناصر */
.hidden {
  display: none !important;
}

/* الحاوية الرئيسية */
.container {
  width: 100%;
  max-width: 850px;
  background: #fff;
  color: #222;
  padding: 40px 35px;
  border-radius: 22px;
  box-shadow: 0 25px 70px rgba(0, 0, 0, 0.35);
  animation: fadeIn 0.6s ease-out;
  position: relative;
  overflow: hidden;
}

.container::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 4px;
  background: linear-gradient(90deg, #667eea, #764ba2, #f093fb);
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: scale(0.96);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

/* العناوين */
h2 {
  text-align: center;
  font-size: 2em;
  font-weight: 900;
  background: linear-gradient(135deg, #667eea, #764ba2);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 8px;
}

.subtitle {
  text-align: center;
  color: #777;
  margin-bottom: 25px;
  font-size: 0.95em;
  font-weight: 500;
}

/* مودال كلمة السر */
#password-modal {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.65);
  backdrop-filter: blur(6px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}

.pass-box {
  width: 90%;
  max-width: 420px;
  background: #fff;
  padding: 45px 35px;
  border-radius: 20px;
  text-align: center;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
  animation: pop 0.4s ease;
}

@keyframes pop {
  from {
    transform: scale(0.6);
    opacity: 0;
  }
  to {
    transform: scale(1);
    opacity: 1;
  }
}

.lock-icon {
  font-size: 3.5em;
  margin-bottom: 15px;
  animation: bounce 2s infinite;
}

@keyframes bounce {
  0%, 100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-12px);
  }
}

.pass-title {
  color: #667eea;
  font-size: 1.6em;
  font-weight: 900;
  margin-bottom: 8px;
}

.pass-text {
  font-size: 0.95em;
  color: #666;
  margin-bottom: 25px;
}

/* حقل كلمة السر + زر الإظهار */
.pass-row {
  position: relative;
  margin-bottom: 20px;
}

.pass-input {
  width: 100%;
  padding: 14px 50px 14px 18px;
  border-radius: 12px;
  border: 2px solid #e0e0e0;
  background: #f8f9fa;
  font-size: 1.1em;
  text-align: center;
  letter-spacing: 1px;
  transition: all 0.3s;
  font-family: inherit;
}

.pass-input:focus {
  outline: none;
  border-color: #667eea;
  background: #fff;
  box-shadow: 0 0 15px rgba(102, 126, 234, 0.2);
}

.pass-toggle {
  position: absolute;
  left: 15px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 1.4em;
  color: #667eea;
  cursor: pointer;
  transition: transform 0.2s;
  padding: 5px;
  user-select: none;
}

.pass-toggle:hover {
  transform: translateY(-50%) scale(1.15);
}

/* زر الدخول */
.pass-btn {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: #fff;
  font-size: 1.05em;
  font-weight: 900;
  cursor: pointer;
  transition: all 0.3s;
  box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
  font-family: inherit;
}

.pass-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
}

.pass-btn:active {
  transform: translateY(0);
}

/* رسالة الخطأ في كلمة السر */
.pass-err {
  color: #e74c3c;
  font-weight: 900;
  margin-top: 15px;
  display: none;
  font-size: 0.92em;
  animation: shake 0.4s;
}

@keyframes shake {
  0%, 100% {
    transform: translateX(0);
  }
  25% {
    transform: translateX(-5px);
  }
  75% {
    transform: translateX(5px);
  }
}

/* تسميات ومدخلات النموذج */
label {
  font-weight: 700;
  color: #667eea;
  margin-top: 18px;
  display: block;
  margin-bottom: 8px;
  font-size: 0.98em;
}

input[type="text"] {
  width: 100%;
  padding: 13px 16px;
  border-radius: 12px;
  border: 2px solid #e0e0e0;
  background: #f8f9fa;
  font-size: 1.05em;
  transition: all 0.3s;
  font-family: inherit;
}

input[type="text"]:focus {
  outline: none;
  border-color: #667eea;
  background: #fff;
  box-shadow: 0 0 15px rgba(102, 126, 234, 0.2);
}

/* قائمة المرشحين */
.candidate-list {
  background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
  border: 2px solid #e0e0e0;
  padding: 16px;
  border-radius: 15px;
  max-height: 380px;
  overflow-y: auto;
  margin-top: 10px;
}

.candidate-item {
  padding: 12px 14px;
  margin-bottom: 10px;
  background: #fff;
  border: 2px solid #e0e0e0;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  transition: all 0.3s;
  cursor: pointer;
}

.candidate-item:hover {
  background: linear-gradient(135deg, #f0f4ff, #e8f0ff);
  border-color: #667eea;
  transform: translateX(-4px);
  box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
}

.c-left {
  display: flex;
  align-items: center;
  gap: 12px;
  flex: 1;
}

.num-circle {
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: #fff;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.9em;
  font-weight: 900;
  flex-shrink: 0;
}

.c-name {
  font-weight: 700;
  color: #35536b;
  font-size: 0.98em;
}

.c-right {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}

.c-icon {
  font-size: 1.8em;
}

input[type="checkbox"] {
  accent-color: #667eea;
  width: 22px;
  height: 22px;
  cursor: pointer;
  transition: transform 0.2s;
}

input[type="checkbox"]:checked {
  transform: scale(1.15);
}

/* حالة الصوت */
.sec-box {
  background: linear-gradient(135deg, #f0f4ff, #e8f0ff);
  padding: 18px;
  border: 2px solid #667eea;
  border-radius: 12px;
  margin-top: 18px;
  border-left: 5px solid #667eea;
}

.sec-box span {
  font-weight: 900;
  color: #667eea;
  margin-bottom: 12px;
  display: block;
  font-size: 0.98em;
}

.sec-box label {
  margin-top: 8px;
  margin-bottom: 0;
  display: flex;
  align-items: center;
  font-weight: 600;
  color: #35536b;
  cursor: pointer;
}

.sec-box input[type="radio"] {
  margin-left: 10px;
  margin-top: 0;
  accent-color: #667eea;
  width: 20px;
  height: 20px;
  cursor: pointer;
}

/* الأزرار السفلية */
.btn-row {
  display: flex;
  gap: 14px;
  margin-top: 22px;
}

button[type="submit"],
button[type="reset"] {
  flex: 1;
  padding: 13px;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  font-weight: 900;
  font-size: 1.05em;
  transition: all 0.3s;
  font-family: inherit;
}

.btn-primary {
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: #fff;
  box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
}

.btn-primary:active {
  transform: translateY(0);
}

.btn-reset {
  background: #e8eef7;
  color: #667eea;
  border: 2px solid #667eea;
}

.btn-reset:hover {
  background: #667eea;
  color: #fff;
  transform: translateY(-2px);
}

/* رسائل التنبيه والتأكيد */
.msg-warn,
.msg-confirm {
  margin-top: 15px;
  padding: 13px;
  border-radius: 12px;
  font-weight: 900;
  text-align: center;
  display: none;
  font-size: 0.95em;
  animation: slideDown 0.3s ease;
}

@keyframes slideDown {
  from {
    opacity: 0;
    transform: translateY(-10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.msg-warn {
  background: #fde8ea;
  color: #c92a2a;
  border: 2px solid #f08080;
}

.msg-confirm {
  background: #d4edda;
  color: #155724;
  border: 2px solid #28a745;
}

/* التوقيع */
.sig {
  text-align: center;
  margin-top: 28px;
  color: #999;
  font-size: 0.88em;
  font-style: italic;
  border-top: 1px solid #eee;
  padding-top: 20px;
}

/* Scrollbar */
::-webkit-scrollbar {
  width: 8px;
}

::-webkit-scrollbar-track {
  background: #f1f1f1;
  border-radius: 10px;
}

::-webkit-scrollbar-thumb {
  background: #667eea;
  border-radius: 10px;
}

::-webkit-scrollbar-thumb:hover {
  background: #764ba2;
}

/* Responsive */
@media (max-width: 768px) {
  .container {
    padding: 30px 20px;
  }

  h2 {
    font-size: 1.6em;
  }

  .candidate-list {
    max-height: 300px;
  }

  .btn-row {
    gap: 10px;
  }

  button[type="submit"],
  button[type="reset"] {
    font-size: 0.98em;
    padding: 11px;
  }
}

@media (max-width: 480px) {
  .container {
    padding: 20px 15px;
    border-radius: 18px;
  }

  h2 {
    font-size: 1.3em;
  }
