<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>تسجيل التصويت – النظام الانتخابي المتطور</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
/* ====== RESET ====== */
* { box-sizing: border-box; margin:0; padding:0; }

/* ====== BACKGROUND ====== */
body {
  font-family: "Cairo", sans-serif;
  background: linear-gradient(135deg,#1e3c72 0%,#2a5298 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  min-height: 100vh;
}

/* ====== CONTAINER ====== */
.container {
  width: 100%;
  max-width: 700px;
  background: #fff;
  border-radius: 22px;
  padding: 30px 25px;
  box-shadow: 0 18px 60px rgba(0,0,0,0.28);
  animation: fadeIn .5s ease-out;
}

@keyframes fadeIn {
  from { opacity:0; transform:scale(.96); }
  to { opacity:1; transform:scale(1); }
}

.hidden { display:none !important; }

/* ====== TITLES ====== */
h2 {
  text-align: center;
  font-size: 2em;
  font-weight: 900;
  color: #1e3c72;
  margin-bottom: 10px;
}
.subtitle {
  text-align:center;
  color:#666;
  margin-bottom:25px;
  font-size: .95em;
}

/* ====== INPUTS ====== */
input[type="text"], input[type="password"] {
  width:100%;
  padding:13px;
  border:2px solid #d0dbf0;
  border-radius:12px;
  background:#f7faff;
  margin-top:5px;
  font-size:1.05em;
  transition:.25s;
}
input:focus {
  border-color:#4286f5;
  box-shadow:0 0 0 3px #e4efff;
  outline:none;
}

/* PASSWORD TOGGLE */
.password-group {
  position:relative;
}
.toggle-pass {
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  cursor:pointer;
  font-size:1.4em;
  color:#2a5298;
}

/* ====== CANDIDATE LIST ====== */
.candidate-list {
  max-height:240px;
  overflow-y:auto;
  padding:10px 0;
}
.candidate-row {
  background:#f3f6ff;
  padding:12px;
  border-radius:12px;
  margin-bottom:10px;
  display:flex;
  align-items:center;
  transition:.2s;
  border:1px solid #dce5ff;
}
.candidate-row:hover {
  background:#e6eeff;
}
.candidate-row label {
  width:100%;
  display:flex;
  align-items:center;
  gap:10px;
  cursor:pointer;
  font-size:1.1em;
}
.c-icon {
  font-size: 1.7em;
  width:40px;
  text-align:center;
}
input[type="checkbox"] {
  accent-color:#2a5298;
}

/* ====== RADIO SECTION ====== */
.sec-box {
  margin-top:15px;
  padding:15px;
  background:#f1f5ff;
  border-radius:12px;
  border:1px solid #d0dbf0;
}
.sec-box span.title {
  display:block;
  font-weight:700;
  color:#1e3c72;
  margin-bottom:6px;
}
.sec-box label { margin-right:16px; }

/* ====== BUTTONS ====== */
.btn-row {
  margin-top:20px;
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}
button {
  padding:12px 20px;
  font-size:1.05em;
  border:none;
  border-radius:12px;
  cursor:pointer;
  transition:.2s;
  font-weight:700;
}
.btn-primary {
  background:#1e3c72;
  color:#fff;
}
.btn-primary:hover { background:#17335c; }

.btn-reset {
  background:#e4e7f3;
  color:#1e3c72;
}
.btn-reset:hover { background:#d6d9e8; }

.msg-warn, .msg-confirm {
  margin-top:12px;
  padding:12px;
  border-radius:12px;
  text-align:center;
  display:none;
  font-weight:bold;
}
.msg-warn {
  background:#ffd8dd;
  color:#b00020;
}
.msg-confirm {
  background:#d4edda;
  color:#237a4a;
}

.sig {
  margin-top:25px;
  text-align:left;
  color:#777;
  font-size:.9em;
  font-style:italic;
}

/* Scrollbar */
::-webkit-scrollbar { width:8px; }
::-webkit-scrollbar-thumb {
  background:#b7c9ff;
  border-radius:8px;
}
</style>
</head>

<body>

<div class="container">
  <h2>تسجيل التصويت</h2>
  <div class="subtitle">دخول المشرف بالرقم السري</div>

  <!-- PASSWORD SECTION -->
  <div id="password-section">
    <label>أدخل الرقم السري:</label>
    <div class="password-group">
      <input type="password" id="password-input" placeholder="••••••">
      <span class="toggle-pass" onclick="togglePassword()">👁</span>
    </div>
    <button class="btn-primary" style="width:100%;margin-top:12px;" onclick="checkPassword()">دخول</button>
    <div id="pw-err" class="msg-warn"></div>
  </div>

  <!-- MAIN FORM -->
  <form id="main-form" class="hidden">
    <label>اسم الناخب:</label>
    <input type="text" id="voter-name" placeholder="اكتب اسم الناخب">

    <div style="margin-top:18px;font-weight:700;color:#1e3c72;">اختر المرشح (حتى 2 فقط):</div>
    <div class="candidate-list" id="candidates"></div>

    <div class="sec-box">
      <span class="title">حالة الصوت:</span>
      <label><input type="radio" name="vote-valid" value="صحيح"> صحيح</label>
      <label><input type="radio" name="vote-valid" value="باطل"> باطل</label>
    </div>

    <div class="btn-row">
      <button type="submit" class="btn-primary">تسجيل التصويت</button>
      <button type="reset" class="btn-reset">إعادة ضبط</button>
    </div>

    <div id="msg-warn" class="msg-warn"></div>
    <div id="msg-confirm" class="msg-confirm"></div>
  </form>

  <div class="sig">برمجة المهندس محمد حماد</div>
</div>

<!-- ========================== JAVASCRIPT ========================== -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

const app = initializeApp({
  apiKey: "AIzaSyCxxXV_6CEo1fTp3rRbfwfYbe7WH0Cyg38",
  authDomain: "elahmadiya.firebaseapp.com",
  databaseURL: "https://elahmadiya-default-rtdb.firebaseio.com",
  projectId: "elahmadiya",
  storageBucket: "elahmadiya.firebasestorage.app",
  messagingSenderId: "594580767620",
  appId: "1:594580767620:web:f5be3b87d4c704854e53d1"
});

const db = getDatabase(app);

/* ==================== CANDIDATE LIST WITH ICONS ==================== */
const candidateIcons = [
  ["ايهاب العمده", "👑"],
  ["محمد العتمانى", "🍞"],
  ["أحمد الحديدى", "🦁"],
  ["عادل الجيار", "🦅"],
  ["-", "💣"],
  ["وليد تيسير الامير", "🐊"],
  ["كمال العيسوى", "🌀"],
  ["البدوى جميز", "🐋"],
  ["احمد الريس", "🦂"],
  ["أحمد عوف", "✋"],
  ["حسن الملهاط", "🌿"],
  ["عمرو محمد بحيرى", "🚍"],
  ["السيد طمان", "🔫"],
  ["محمد دندن", "🚁"],
  ["مجدى الأمير", "🖊"]
];

const list = document.getElementById("candidates");
candidateIcons.forEach(c=>{
  list.innerHTML += `
    <div class="candidate-row">
      <label>
        <span class="c-icon">${c[1]}</span>
        <input type="checkbox" value="${c[0]}" onclick="selectLimit(this)">
        ${c[0]}
      </label>
    </div>
  `;
});

/* ==================== PASSWORD LOGIC ==================== */
window.togglePassword = function(){
  const inp = document.getElementById("password-input");
  inp.type = (inp.type === "password") ? "text" : "password";
};

window.checkPassword = function(){
  let x = document.getElementById("password-input").value.trim();
  if(x === "521988"){
    document.getElementById("password-section").classList.add("hidden");
    document.getElementById("main-form").classList.remove("hidden");
  } else {
    showWarn("pw-err", "الرقم السري غير صحيح");
  }
};

/* ==================== LIMIT CANDIDATES ==================== */
window.selectLimit = function(box){
  const checked = document.querySelectorAll('input[type="checkbox"]:checked');
  if(checked.length > 2){
    box.checked = false;
    showWarn("msg-warn", "اختر مرشحين فقط");
  }
};

/* ==================== SUBMIT FORM ==================== */
document.getElementById("main-form").onsubmit = async(e)=>{
  e.preventDefault();

  const name = document.getElementById("voter-name").value.trim();
  const selected = [...document.querySelectorAll('input[type="checkbox"]:checked')].map(v=>v.value);
  const validity = document.querySelector('input[name="vote-valid"]:checked');

  if(name === "") return showWarn("msg-warn", "اسم الناخب مطلوب");
  if(selected.length === 0) return showWarn("msg-warn","اختر مرشحًا واحدًا على الأقل");
  if(!validity) return showWarn("msg-warn","اختر حالة الصوت");

  /* حساب مدة اتخاذ القرار */
  const start = performance.now();
  const end = performance.now();
  const duration = ((end - start)/1000).toFixed(3);

  const vote = {
    name,
    selected,
    vote_validity: validity.value,
    timestamp: Date.now(),
    duration_seconds: duration
  };

  await push(ref(db,"votes"), vote);

  showConfirm("msg-confirm", "تم تسجيل التصويت بنجاح");
  document.getElementById("main-form").reset();
};

/* ==================== HELPERS ==================== */
function showWarn(id,msg){
  const el = document.getElementById(id);
  el.innerText = msg;
  el.style.display = "block";
  setTimeout(()=> el.style.display="none", 2000);
}
function showConfirm(id,msg){
  const el = document.getElementById(id);
  el.innerText = msg;
  el.style.display = "block";
  setTimeout(()=> el.style.display="none", 2500);
}
</script>

</body>
</html>
