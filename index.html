<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>عداد اللجنة</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Cairo", sans-serif;
}

body {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  color: #333;
}

.hidden { display: none !important; }

/* Login Modal */
#login-modal {
  position: fixed; inset: 0; background: rgba(0,0,0,0.8);
  display: flex; justify-content: center; align-items: center; z-index: 9999;
}
.login-box {
  background: #fff; padding: 30px; border-radius: 15px;
  width: 90%; max-width: 400px; text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}
.login-input {
  width: 100%; padding: 15px; margin: 15px 0;
  border: 2px solid #eee; border-radius: 10px;
  text-align: center; font-size: 1.2em;
}
.btn-login {
  width: 100%; padding: 12px; background: #667eea;
  color: #fff; border: none; border-radius: 10px;
  font-size: 1.1em; cursor: pointer; font-weight: bold;
}

/* Main Container */
.container {
  width: 100%; max-width: 500px;
  background: #fff; border-radius: 20px;
  padding: 25px; box-shadow: 0 20px 60px rgba(0,0,0,0.2);
  text-align: center; animation: slideUp 0.4s ease;
}
@keyframes slideUp { from{transform:translateY(20px);opacity:0} to{transform:translateY(0);opacity:1} }

.header-info {
  background: #f3f4f6; padding: 15px; border-radius: 12px;
  margin-bottom: 25px; border: 1px solid #e5e7eb;
}
.comm-title { font-weight: 900; font-size: 1.2em; color: #4b5563; }
.comm-address { font-size: 0.9em; color: #6b7280; }

/* THE BIG BUTTON (+1) */
.btn-counter {
  width: 100%;
  background: linear-gradient(135deg, #10b981 0%, #059669 100%);
  color: #fff;
  border: none;
  border-radius: 20px;
  padding: 40px 20px;
  font-size: 2.5em;
  font-weight: 900;
  cursor: pointer;
  box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
  transition: all 0.1s;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  margin-bottom: 30px;
  position: relative;
  overflow: hidden;
}
.btn-counter:active {
  transform: scale(0.96);
  box-shadow: 0 5px 15px rgba(16, 185, 129, 0.4);
}
.btn-subtext {
  display: block; font-size: 0.35em; font-weight: normal;
  opacity: 0.9; margin-top: 5px;
}

/* Bulk Section */
.bulk-section {
  border-top: 2px dashed #e5e7eb;
  padding-top: 20px; display: flex; gap: 10px;
  align-items: center; justify-content: center;
}
.bulk-input {
  width: 60%; padding: 12px; border: 2px solid #e5e7eb;
  border-radius: 10px; text-align: center; font-size: 1.1em;
}
.btn-bulk {
  width: 35%; padding: 12px; background: #f59e0b;
  color: #fff; border: none; border-radius: 10px;
  font-weight: bold; cursor: pointer;
}

/* Upload & Extra */
.upload-btn {
  margin-top: 20px; background: #6366f1; color: #fff;
  padding: 10px; width: 100%; border: none; border-radius: 10px;
  cursor: pointer; font-weight: bold;
}

/* Feedback Message */
.flash-msg {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  background: #1f2937; color: #fff; padding: 10px 20px;
  border-radius: 50px; z-index: 10000; display: none;
  font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}
</style>
</head>
<body>

<div id="flash-msg" class="flash-msg">✅ تم الاحتساب</div>

<div id="login-modal">
  <div class="login-box">
    <h2 style="margin-bottom:10px; color:#4b5563;">تسجيل دخول اللجنة</h2>
    <input type="number" id="pass-input" class="login-input" placeholder="اكتب رقم اللجنة">
    <button class="btn-login" onclick="login()">دخول</button>
    <div id="login-err" style="color:red; margin-top:10px; display:none;">رقم اللجنة غير صحيح</div>
  </div>
</div>

<div id="app-container" class="container hidden">
  <div class="header-info">
    <div id="c-name" class="comm-title">لجنة رقم ...</div>
    <div id="c-addr" class="comm-address">العنوان...</div>
  </div>

  <button class="btn-counter" onclick="addOne()" id="main-btn">
    +1 ناخب
    <span class="btn-subtext">اضغط مرة واحدة عند دخول الناخب</span>
  </button>

  <div class="bulk-section">
    <input type="number" id="bulk-val" class="bulk-input" placeholder="عدد (جملة)">
    <button class="btn-bulk" onclick="addBulk()">إضافة رقم</button>
  </div>

  <button class="upload-btn" onclick="document.getElementById('file-up').click()">📤 رفع صورة المحضر</button>
  <input type="file" id="file-up" style="display:none" accept="image/*" onchange="uploadFile()">
  
  <div style="margin-top:20px; font-size:0.8em; color:#999;">برمجة م. محمد حماد</div>
</div>

<script type="module">

  51: {name: "شارع الدقهلية", address: "مدرسة خالد بن الوليد"},

  53: {name: "شارع الثانوية", address: "مدرسة الثانوية بنين"},
  54: {name: "شارع مصنع البصل", address: "مدرسة عثمان بن عفان الإعدادية"},
  55: {name: "شارع مصنع البصل", address: "مدرسة عثمان بن عفان الإعدادية"},
  56: {name: "شارع بورسعيد", address: "مدرسة الأنصاري الابتدائية"},
  57: {name: "هاشم شلباية", address: "مدرسة هاشم شلباية خلف المستشفى"},
  58: {name: "شارع الزهراء", address: "مدرسة الزهراء الابتدائية"},
  59: {name: "شارع الزهراء", address: "مدرسة الزهراء الابتدائية"},
  60: {name: "سوق الجمعة", address: "مدرسة الامام علي الابتدائية"}
};

let myCommittee = 0;
const imgbbKey = "4580317b11de33e7c7630672bfc20bf9";

window.login = function() {
  const val = document.getElementById("pass-input").value;
  const num = parseInt(val) - 100100; // كلمة السر: 100101 للجنة 1 وهكذا

  if(num >= 1 && num <= 60) {
    myCommittee = num;
    const info = committeesDB[num] || {name: "لجنة", address: ""};
    
    document.getElementById("c-name").innerText = `لجنة رقم ${num} - ${info.name}`;
    document.getElementById("c-addr").innerText = info.address;
    
    document.getElementById("login-modal").classList.add("hidden");
    document.getElementById("app-container").classList.remove("hidden");
  } else {
    document.getElementById("login-err").style.display = "block";
  }
};

// ---------------------------------------------------------
// دالة الزر +1 (عداد فردي)
// ---------------------------------------------------------
window.addOne = function() {
  if(myCommittee === 0) return;

  // 1. تأثير بصري للزر
  const btn = document.getElementById("main-btn");
  btn.style.transform = "scale(0.95)";
  setTimeout(() => btn.style.transform = "scale(1)", 100);

  const key = Date.now();
  
  // 2. الإرسال لقاعدة البيانات (يرسل رقم 1)
  set(ref(db, "votes/" + key), {
    committee: myCommittee,
    count: 1,            // القيمة 1
    type: "single",      // نوع العملية
    timestamp: key
  }).then(() => {
    showFlashMsg("✅ تم احتساب الناخب");
  }).catch(err => alert("خطأ في الاتصال"));
};

// ---------------------------------------------------------
// دالة إضافة جملة (رقم كبير)
// ---------------------------------------------------------
window.addBulk = function() {
  const val = parseInt(document.getElementById("bulk-val").value);
  if(!val || val <= 0) return;

  if(confirm(`هل أنت متأكد من إضافة ${val} ناخب مرة واحدة؟`)) {
    const key = Date.now();
    set(ref(db, "bulk_counts/" + key), {
      committee: myCommittee,
      count: val,
      type: "bulk",
      timestamp: key
    }).then(() => {
      showFlashMsg(`✅ تم إضافة ${val} ناخب`);
      document.getElementById("bulk-val").value = "";
    });
  }
};

// ---------------------------------------------------------
// دالة رفع الصورة (نفس القديمة)
// ---------------------------------------------------------
window.uploadFile = function() {
  const file = document.getElementById("file-up").files[0];
  if(!file) return;
  
  const formData = new FormData();
  formData.append("image", file);
  
  showFlashMsg("⏳ جاري رفع الصورة...");
  
  fetch(`https://api.imgbb.com/1/upload?key=${imgbbKey}`, {method: "POST", body: formData})
  .then(res => res.json())
  .then(data => {
    if(data.success) showFlashMsg("✅ تم رفع الصورة بنجاح");
    else showFlashMsg("❌ فشل الرفع");
  });
};

function showFlashMsg(txt) {
  const msg = document.getElementById("flash-msg");
  msg.innerText = txt;
  msg.style.display = "block";
  setTimeout(() => msg.style.display = "none", 2000);
}

</script>
</body>
</html>
