<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>تسجيل التصويت</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
*{ margin:0; padding:0; box-sizing:border-box; font-family:"Cairo",sans-serif; }
body{
  background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
  min-height:100vh; display:flex; justify-content:center; align-items:center;
  padding:20px; color:#fff;
  overflow-x: hidden;
}
.hidden{ display:none !important; }

#password-modal{
  position:fixed; inset:0; background:rgba(0,0,0,.7); backdrop-filter:blur(10px);
  display:flex; justify-content:center; align-items:center; z-index:9999;
}
.pass-box{
  width:95%; max-width:400px; background:#fff; color:#222;
  padding:35px 18px; border-radius:18px; box-shadow:0 20px 60px rgba(0,0,0,.4);
  animation:pop .4s ease; text-align:center;
}
@keyframes pop{ from{transform:scale(.6);opacity:.2} to{transform:scale(1);opacity:1} }

.pass-title{ font-size:1.6em; font-weight:900; background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent; }
.pass-row{ position:relative; margin-top:20px; }
.pass-input{
  width:100%; padding:14px 16px; text-align:center;
  border-radius:12px; border:2px solid #e0e7ff; background:#f8f9ff; font-size:1.1em;
  transition:all 0.3s;
}
.pass-input:focus{
  outline:none; border-color:#667eea; box-shadow:0 0 0 3px rgba(102,126,234,0.1);
}
.pass-toggle{
  position:absolute; left:15px; top:50%; transform:translateY(-50%);
  font-size:1.3em; color:#667eea; cursor:pointer; opacity:0.6;
  transition:all 0.3s;
}
.pass-btn{
  margin-top:20px; width:100%; padding:13px; background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
  color:#fff; border:none; border-radius:12px; font-size:1.05em;
  font-weight:bold; cursor:pointer; transition:all 0.3s;
}
.pass-btn:hover{ transform:translateY(-2px); }
.pass-err{ margin-top:12px; color:#c62828; font-weight:bold; display:none; font-size:0.95em; }

.logout-btn{
  position:fixed; top:20px; left:20px; z-index:1000;
  background:linear-gradient(135deg,#ff6b6b 0%,#c62828 100%);
  color:#fff; border:none; padding:14px 26px;
  border-radius:12px; font-weight:700; font-size:1.07em;
  cursor:pointer; transition:all 0.3s;
  box-shadow:0 4px 12px rgba(198,40,40,0.3);
}
.logout-btn:hover{ transform:translateY(-2px); box-shadow:0 6px 16px rgba(198,40,40,0.4); }

.container{
  width:100%; max-width:420px; background:#fff; color:#222;
  padding:26px; border-radius:20px;
  box-shadow:0 20px 60px rgba(0,0,0,.3);
  animation:fade .5s ease;
  box-sizing: border-box;
}
@keyframes fade{
  from{opacity:0; transform:translateY(20px);}
  to{opacity:1; transform:translateY(0);}
}

h2{
  text-align:center; background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  font-size:2em; font-weight:900;
}

.committee-info{
  text-align:center; margin-top:12px; margin-bottom:25px;
  background:linear-gradient(135deg,#f5f7ff 0%,#eff2ff 100%);
  padding:12px; border-radius:12px; border-left:4px solid #667eea;
}

.committee-name{
  font-size:1.06em; font-weight:700; color:#667eea; margin-bottom:4px;
}

.committee-address{
  font-size:0.88em; color:#666; font-weight:500;
}

.subtitle{text-align:center; color:#999; margin-top:8px; margin-bottom:25px; font-size:0.93em;}

label{ font-weight:700; color:#333; margin-top:16px; display:block; }
input[type=text]{
  width:100%; padding:13px 12px; border-radius:12px;
  border:2px solid #e0e7ff; background:#f8f9ff; font-size:1em; transition:all 0.3s;
}
input[type=text]:focus{
  outline:none; border-color:#667eea; box-shadow:0 0 0 3px rgba(102,126,234,0.1);
}

.candidate-list{
  margin-top:10px; background:#f8f9ff; border:2px solid #e0e7ff;
  border-radius:14px; max-height:320px; overflow-y:auto; padding:8px;
}
.candidate-item{
  background:#fff; border:1px solid #e8ecff; padding:10px;
  border-radius:12px; margin-bottom:9px;
  display:flex; justify-content:space-between; align-items:center;
  transition:all 0.3s; cursor:pointer; border-left:4px solid #667eea;
  min-height:47px;
}
.candidate-item:hover{
  background:linear-gradient(135deg,#f5f7ff 0%,#eff2ff 100%);
  border-color:#667eea; box-shadow:0 4px 12px rgba(102,126,234,0.17);
}
.candidate-item.selected{
  background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
  color:#fff; border-left-color:#fff;
}
.c-left{ display:flex; align-items:center; gap:10px; flex:1; }
.num-circle{
  width:32px; height:32px; border-radius:50%;
  background:#667eea; color:#fff;
  display:flex; align-items:center; justify-content:center;
  font-size:0.97em; font-weight:900;
}
.candidate-item.selected .num-circle{
  background:#fff; color:#667eea;
}
.c-name{ font-weight:700; word-break:break-word; }
.c-right{ display:flex; align-items:center; gap:10px; }
.c-icon{ font-size:1.5em; }
input[type="checkbox"]{ width:22px; height:22px; cursor:pointer; accent-color:#667eea; }

.sec-box{
  margin-top:13px; background:linear-gradient(135deg,#f5f7ff 0%,#eff2ff 100%);
  border:2px solid #e0e7ff; border-radius:12px; padding:12px;
}
.sec-title{ font-weight:700; color:#667eea; display:block; margin-bottom:12px; font-size:1em; }
.radio-group{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.radio-item{
  display:flex; align-items:center; gap:8px; cursor:pointer;
  padding:8px; background:#fff; border-radius:10px;
  border:2px solid #e0e7ff; transition:all 0.3s;
}
.radio-item:hover{ border-color:#667eea; background:#f8f9ff; }
.radio-item input[type="radio"]{ width:18px; height:18px; cursor:pointer; }
.radio-item.selected{
  background:#667eea; color:#fff; border-color:#667eea;
}
.radio-item.selected input[type="radio"]{ accent-color:#fff; }

.btn-row{ display:flex; gap:10px; margin-top:23px; }
button{
  flex:1; padding:13px; border:none; border-radius:12px;
  cursor:pointer; font-weight:700; font-size:1.03em; transition:all 0.3s;
}
.btn-primary{ background:linear-gradient(135deg,#667eea 0%,#764ba2 100%); color:#fff; }
.btn-primary:hover{ transform:translateY(-2px); }
.btn-reset{ background:#e0e7ff; color:#667eea; font-weight:700; }
.btn-reset:hover{ background:#d3ddff; }

.msg-warn, .msg-confirm{
  display:none; margin-top:12px; padding:11px; border-radius:10px;
  text-align:center; font-weight:700; animation:slideDown 0.3s ease;
  font-size: 1em;
}
@keyframes slideDown{
  from{opacity:0; transform:translateY(-10px);}
  to{opacity:1; transform:translateY(0);}
}
.msg-warn{ background:#ffebee; color:#c62828; border-left:4px solid #c62828; }
.msg-confirm{ background:#e8f5e9; color:#2e7d32; border-left:4px solid #2e7d32; }

#bubble{
  position:fixed; bottom:13px; right:13px;
  background:#fff; color:#222;
  padding:16px; border-radius:12px;
  box-shadow:0 8px 24px rgba(0,0,0,.25);
  font-size:1em; font-weight:700;
  display:none; width:320px; max-width:calc(100vw - 26px);
  animation:slide .4s ease; border-left:4px solid #667eea;
  z-index:99999;
}

#bubble.active{
  display:flex;
  align-items:flex-start;
  gap:10px;
}

#bubble-icon{
  font-size:1.3em;
  min-width:28px;
  text-align:center;
  margin-top:2px;
}

#bubble-content{
  flex:1;
  line-height:1.55;
}

#bubble-close{
  background:none;
  border:none;
  font-size:1.4em;
  color:#999;
  cursor:pointer;
  padding:0;
  min-width:28px;
  text-align:center;
  transition:all 0.3s;
  opacity:0.6;
}

#bubble-close:hover{
  opacity:1;
  color:#667eea;
}

@keyframes slide{
  from{transform:translateY(18px);opacity:0;}
  to{transform:translateY(0);opacity:1;}
}

.sig{text-align:left; margin-top:17px; color:#999; font-style:italic; font-size:0.82em;}

/* تجاوب أقوى */
@media(max-width:600px){
  .container{ max-width:98vw; padding:9vw 4vw; border-radius:8px; }
  h2{ font-size:1.17em; }
  .radio-group{ grid-template-columns:1fr; }
  .candidate-list{ max-height:340px; }
  .logout-btn{ top:7px; left:6px; padding:9px 13px; font-size:0.95em; border-radius:9px;}
  .c-name, .committee-address{ font-size:1em;}
}

@media(max-width:400px){
  #bubble{ padding:8px; font-size:0.95em; max-width:90vw; }
  .container{ padding:6vw 2vw;}
}
</style>
</head>
<body>

<button class="logout-btn hidden" id="logout-btn" onclick="logoutCommittee()">تسجيل الخروج</button>

<div id="bubble">
  <div id="bubble-icon">💬</div>
  <div id="bubble-content"></div>
  <button id="bubble-close" onclick="closeBubble()">×</button>
</div>

<div id="password-modal">
  <div class="pass-box">
    <div class="pass-title">تسجيل الدخول</div>
    <div class="pass-row">
      <input type="password" id="password-input" class="pass-input" placeholder="ادخل كلمة السر" autocomplete="off">
      <span class="pass-toggle" onclick="togglePass()">👁</span>
    </div>
    <button class="pass-btn" onclick="checkPass()">دخول</button>
    <div id="pw-err" class="pass-err">كلمة السر غير صحيحة</div>
  </div>
</div>

<div class="container hidden" id="main-container">
  <h2 id="welcome-title">تسجيل التصويت</h2>
  <div class="committee-info">
    <div class="committee-name" id="committee-name-display"></div>
    <div class="committee-address" id="committee-address-display"></div>
  </div>

  <form id="vote-form">
    <label>اسم الناخب:</label>
    <input type="text" id="voter-name" placeholder="اكتب اسم الناخب (اختياري)">

    <label>اختر المرشح (حتى 2):</label>
    <div class="candidate-list" id="candidate-list"></div>

    <div class="sec-box">
      <span class="sec-title">حالة الصوت:</span>
      <div class="radio-group">
        <label class="radio-item">
          <input type="radio" name="vvalid" value="صحيح">
          <span>✓ صحيح</span>
        </label>
        <label class="radio-item">
          <input type="radio" name="vvalid" value="باطل">
          <span>✗ باطل</span>
        </label>
      </div>
    </div>

    <div class="btn-row">
      <button type="submit" class="btn-primary">تسجيل التصويت</button>
      <button type="reset" class="btn-reset">إعادة ضبط</button>
    </div>

    <div id="msg-warn" class="msg-warn"></div>
    <div id="msg-confirm" class="msg-confirm"></div>
  </form>

  <div class="sig">
    تم البرمجة بواسطة
    <a href="https://www.facebook.com/en.mohamed.nasr" target="_blank"
       style="color:#1e3c72; font-weight:900; text-decoration:underline;">
       المهندس محمد حماد
    </a>
  </div>
</div>

<script type="module">
// --- نفس كود جافا سكريبت كما هو بدون تعديل جوهري ---
// ضع الكود جافا سكريبت هنا كما بالنسخة الأصلية، لأنه جاهز للتجاوب

</script>

</body>
</html>
