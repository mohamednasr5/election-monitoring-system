<style>
* { box-sizing: border-box; font-family: "Cairo", sans-serif; margin: 0; padding: 0; }
body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; color: #fff; }
.hidden { display: none !important; }

/* Login Modal */
.login-box { background: #fff; color: #333; padding: 30px; border-radius: 16px; text-align: center; width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
.login-box input { width: 100%; padding: 15px; margin: 15px 0; border: 2px solid #ddd; border-radius: 10px; font-size: 1.1em; text-align: center; }
.btn-login { width: 100%; padding: 15px; background: #667eea; color: #fff; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 1.1em; }

/* Main Interface */
.container { width: 100%; max-width: 450px; background: #fff; color: #333; padding: 25px; border-radius: 20px; box-shadow: 0 15px 50px rgba(0,0,0,0.2); text-align: center; }
h2 { color: #667eea; margin-bottom: 5px; }
.comm-info { background: #f0f4ff; padding: 10px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #dbeafe; }
.comm-name { font-weight: bold; color: #4a5568; }

/* Big Button */
.btn-plus-one {
  display: block;
  width: 100%;
  background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
  color: #fff;
  border: none;
  padding: 30px 20px;
  border-radius: 20px;
  font-size: 2em;
  font-weight: 900;
  cursor: pointer;
  box-shadow: 0 10px 30px rgba(46, 125, 50, 0.3);
  transition: transform 0.1s, box-shadow 0.1s;
  margin-bottom: 25px;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.btn-plus-one:active { transform: scale(0.95); box-shadow: 0 5px 15px rgba(46, 125, 50, 0.3); }

/* Bulk Section */
.bulk-sec { border-top: 2px dashed #eee; padding-top: 20px; margin-top: 20px; }
.bulk-inp { width: 70%; padding: 10px; border: 2px solid #eee; border-radius: 8px; text-align: center; font-size: 1.1em; }
.btn-bulk { width: 28%; padding: 10px; background: #ff9800; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }

/* Messages */
.msg { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 20px; border-radius: 50px; z-index: 9999; display: none; animation: fadeDown 0.3s; }
@keyframes fadeDown { from {top:-50px; opacity:0;} to {top:20px; opacity:1;} }

.logout-btn { position: fixed; top: 20px; left: 20px; background: #ff5252; color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; }
</style>
</head>

  <h2>تسجيل الدخول</h2>
  <p>أدخل رقم اللجنة</p>
  <input type="number" id="login-pass" placeholder="رقم اللجنة">
  <button class="btn-login" onclick="login()">دخول</button>
  <p id="login-err" style="color:red; display:none; margin-top:10px;">رقم خطأ</p>

  </button>

  <div class="bulk-sec">
    <p style="margin-bottom:8px; font-weight:bold; color:#666;">أو أضف عدد (جملة)</p>

    <button class="btn-bulk" onclick="addBulk()">إرسال</button>

window.login = function() {
  const val = document.getElementById("login-pass").value;
  const num = parseInt(val) - 100100; // Assuming password logic remains
  
  // Simple check for this example
  if(val.length >= 6 && num >= 1 && num <= 60) {
    committeeNum = num;
    document.getElementById("login-screen").classList.add("hidden");
    document.getElementById("main-screen").classList.remove("hidden");
    document.getElementById("logout-btn").classList.remove("hidden");
    document.getElementById("comm-display").textContent = `لجنة ${num} - ${commNames[num] || ""}`;
  } else {
    document.getElementById("login-err").style.display = "block";
  }
};

// Function 1: Add Single Voter (+1)
window.addOne = function() {
  if(committeeNum === 0) return;
  
  // Visual Feedback
  const btn = document.getElementById("btn-clicker");
  btn.style.background = "linear-gradient(135deg, #0e7a72 0%, #2ecc71 100%)";
  setTimeout(() => btn.style.background = "", 150);

  const key = Date.now();
  // We send count:1 to the 'votes' node. No name needed.
  set(ref(db, "votes/" + key), {
    type: "single_click",
    count: 1,
    committee: committeeNum,
    timestamp: key
  }).then(() => {
    showMsg("✅ تم احتساب الناخب");
  }).catch(err => alert("خطأ في الاتصال"));
};

// Function 2: Add Bulk
window.addBulk = function() {
  const val = parseInt(document.getElementById("bulk-val").value);
  if(!val || val <= 0) return;
  
  if(!confirm(`تأكيد إضافة ${val} صوت مرة واحدة؟`)) return;

  const key = Date.now();
  set(ref(db, "bulk_counts/" + key), {
    type: "bulk_add",
    count: val,
    committee: committeeNum,
    timestamp: key
  }).then(() => {
    showMsg(`✅ تم إضافة ${val} صوت`);
    document.getElementById("bulk-val").value = "";
  });
};

function showMsg(txt) {
  const box = document.getElementById("msg-box");
  box.textContent = txt;
  box.style.display = "block";
  setTimeout(() => box.style.display = "none", 1500);
}
