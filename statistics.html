<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>غرفة العمليات المركزية - مراقبة الانتخابات</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">

<style>
  :root {
    --primary: #2563eb;
    --bg-body: #f1f5f9;
    --bg-card: #ffffff;
    --text-main: #1e293b;
    --flash-blue: rgba(59, 130, 246, 0.5);
    --flash-green: rgba(34, 197, 94, 0.5);
  }

  * { box-sizing: border-box; font-family: "Cairo", sans-serif; margin:0; padding:0; outline: none; }
  body { background: var(--bg-body); color: var(--text-main); padding: 20px; min-height: 100vh; }
  
  /* --- Login Screen --- */
  #login-screen {
    position: fixed; inset: 0; background: #0f172a; z-index: 10000;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .login-box {
    background: #1e293b; padding: 40px; border-radius: 20px;
    text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); width: 90%; max-width: 400px;
    border: 1px solid #334155;
  }
  .login-box h2 { color: #fff; margin-bottom: 20px; font-weight: 900; }
  .pass-input {
    width: 100%; padding: 15px; border-radius: 10px; border: 2px solid #334155;
    background: #0f172a; color: #fff; font-size: 1.2em; text-align: center; letter-spacing: 5px;
    margin-bottom: 20px; transition: 0.3s;
  }
  .pass-input:focus { border-color: #3b82f6; box-shadow: 0 0 15px rgba(59, 130, 246, 0.3); }
  .login-btn {
    background: linear-gradient(135deg, #3b82f6, #2563eb); color: #fff; border: none;
    padding: 12px 30px; border-radius: 10px; font-size: 1.1em; font-weight: bold;
    cursor: pointer; width: 100%; transition: 0.3s;
  }
  .login-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(37, 99, 235, 0.4); }
  .error-msg { color: #ef4444; margin-top: 15px; font-size: 0.9em; display: none; font-weight: bold; }

  /* --- Main Dashboard --- */
  #dashboard-content { display: none; animation: fadeIn 1s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* Header Stats Grid */
  .header-stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 25px;
  }
  .stat-card {
    background: var(--bg-card); padding: 20px; border-radius: 16px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.05); position: relative; overflow: hidden;
    border-bottom: 4px solid transparent; transition: transform 0.3s;
  }
  .stat-card:hover { transform: translateY(-5px); }
  .stat-icon { position: absolute; top: 15px; left: 15px; font-size: 2em; opacity: 0.1; }
  
  .stat-value { font-size: 2.4em; font-weight: 900; line-height: 1; margin-bottom: 5px; }
  .stat-label { color: #64748b; font-size: 0.85em; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }

  /* Specific Colors for Header Cards */
  .card-blue { border-color: #3b82f6; } .card-blue .stat-value { color: #1e3a8a; }
  .card-green { border-color: #10b981; } .card-green .stat-value { color: #064e3b; }
  .card-red { border-color: #ef4444; } .card-red .stat-value { color: #7f1d1d; }
  .card-purple { border-color: #8b5cf6; } .card-purple .stat-value { color: #4c1d95; }
  /* New Live Stats Colors */
  .card-orange { border-color: #f59e0b; background: #fffbeb; } .card-orange .stat-value { color: #92400e; }
  .card-cyan { border-color: #06b6d4; background: #ecfeff; } .card-cyan .stat-value { color: #155e75; }

  /* Committees Grid */
  .controls-bar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px; flex-wrap: wrap; gap: 10px;
  }
  .section-title { font-size: 1.5em; font-weight: 900; color: #0f172a; }
  .search-box {
    padding: 12px 20px; border: 2px solid #e2e8f0; border-radius: 12px;
    width: 250px; font-weight: 700; transition: 0.3s;
  }
  .search-box:focus { border-color: #3b82f6; box-shadow: 0 0 0 4px rgba(59,130,246,0.1); }

  .comm-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 15px;
  }
  .comm-card {
    background: #fff; border-radius: 14px; padding: 15px;
    cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    border: 1px solid #e2e8f0; position: relative; overflow: hidden;
    display: flex; flex-direction: column; justify-content: space-between;
    height: 140px;
  }
  .comm-card:hover {
    transform: translateY(-5px) scale(1.02);
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    border-color: #3b82f6;
  }

  /* Flash Animations */
  @keyframes flashBlue {
    0% { background-color: var(--flash-blue); box-shadow: 0 0 20px var(--flash-blue); }
    100% { background-color: #fff; }
  }
  @keyframes flashGreen {
    0% { background-color: var(--flash-green); box-shadow: 0 0 20px var(--flash-green); }
    100% { background-color: #fff; }
  }
  .flash-effect-blue { animation: flashBlue 1.2s ease-out; }
  .flash-effect-green { animation: flashGreen 1.2s ease-out; }

  .comm-top { display: flex; justify-content: space-between; align-items: center; }
  .badge-id { background: #f1f5f9; padding: 4px 8px; border-radius: 6px; font-size: 0.8em; font-weight: 800; color: #64748b; }
  .comm-name { font-size: 1em; font-weight: 800; color: #1e293b; margin-top: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  
  .comm-stats-row { display: flex; align-items: flex-end; justify-content: space-between; margin-top: auto; }
  .comm-current { font-size: 1.8em; font-weight: 900; color: #2563eb; line-height: 1; }
  .comm-target { font-size: 0.75em; color: #94a3b8; font-weight: 600; }
  
  .progress-bg { height: 6px; background: #f1f5f9; border-radius: 3px; margin-top: 10px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #3b82f6, #2563eb); width: 0%; transition: width 0.6s ease; }

  /* Modal */
  .overlay {
    position: fixed; inset: 0; background: rgba(15, 23, 42, 0.7);
    display: none; align-items: center; justify-content: center; z-index: 5000;
    backdrop-filter: blur(5px);
  }
  .modal {
    background: #fff; width: 95%; max-width: 550px; border-radius: 20px; padding: 30px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.25); animation: slideUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    max-height: 90vh; display: flex; flex-direction: column;
  }
  @keyframes slideUp { from {transform: translateY(50px); opacity: 0;} to {transform: translateY(0); opacity: 1;} }
  
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid #f1f5f9; padding-bottom: 15px; }
  .modal-title { font-size: 1.4em; font-weight: 900; color: #0f172a; }
  .close-btn { background: #f1f5f9; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 1.2em; cursor: pointer; color: #64748b; transition: 0.2s; }
  .close-btn:hover { background: #e2e8f0; color: #ef4444; }

  .log-container { flex: 1; overflow-y: auto; padding: 10px; background: #f8fafc; border-radius: 12px; border: 1px solid #e2e8f0; }
  .log-entry { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #e2e8f0; background: #fff; margin-bottom: 8px; border-radius: 8px; align-items: center; }
  .log-entry:last-child { margin-bottom: 0; }
  .log-badge { padding: 4px 10px; border-radius: 6px; font-weight: 800; font-size: 0.85em; }
  .badge-single { background: #dbeafe; color: #1e40af; }
  .badge-bulk { background: #dcfce7; color: #166534; }

</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <h2>بوابة الدخول الآمنة</h2>
    <p style="color:#94a3b8; margin-bottom:20px; font-size:0.9em;">نظام مراقبة سير العملية الانتخابية</p>
    <input type="password" id="password" class="pass-input" placeholder="أدخل الرقم السري" onkeyup="checkEnter(event)">
    <button class="login-btn" onclick="attemptLogin()">تسجيل الدخول</button>
    <div class="error-msg" id="error-msg">الرقم السري غير صحيح!</div>
  </div>
</div>

<div id="dashboard-content">
  
  <div class="header-stats">
    <div class="stat-card card-blue">
      <div class="stat-value" id="total-all">0</div>
      <div class="stat-label">إجمالي الحضور</div>
    </div>
    
    <div class="stat-card card-green">
      <div class="stat-value" id="percent-all">0%</div>
      <div class="stat-label">نسبة التصويت</div>
    </div>

    <div class="stat-card card-orange">
      <div class="stat-value" id="speed-min">0</div>
      <div class="stat-label">متوسط (ناخب/دقيقة)</div>
    </div>

    <div class="stat-card card-cyan">
      <div class="stat-value" id="speed-hour">0</div>
      <div class="stat-label">متوسط (ناخب/ساعة)</div>
    </div>

    <div class="stat-card card-red">
      <div class="stat-value" id="total-remaining">0</div>
      <div class="stat-label">المتبقي للتصويت</div>
    </div>
  </div>

  <div class="controls-bar">
    <div class="section-title">موقف اللجان الفرعية (60 لجنة)</div>
    <input type="text" id="search" class="search-box" placeholder="ابحث برقم اللجنة..." onkeyup="filterCommittees()">
  </div>

  <div class="comm-grid" id="grid-container">
    </div>
</div>

<div class="overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="m-title">لجنة 1</div>
        <div style="color:#64748b; font-weight:600; font-size:0.9em;" id="m-subtitle">المدرسة...</div>
      </div>
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-bottom:20px; text-align:center;">
      <div style="background:#f1f5f9; padding:15px; border-radius:12px;">
        <div style="font-size:2em; font-weight:900; color:#2563eb;" id="m-present">0</div>
        <div style="font-size:0.8em; font-weight:700; color:#64748b;">عدد الحضور</div>
      </div>
      <div style="background:#f1f5f9; padding:15px; border-radius:12px;">
        <div style="font-size:2em; font-weight:900; color:#0f172a;" id="m-original">0</div>
        <div style="font-size:0.8em; font-weight:700; color:#64748b;">المقيدين</div>
      </div>
    </div>

    <div style="font-size:0.9em; font-weight:800; margin-bottom:10px; color:#334155;">سجل الحركات (الأحدث أولاً):</div>
    <div class="log-container" id="m-logs">
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

// --- إعدادات فايربيس ---
const firebaseConfig = {
  apiKey: "AIzaSyCxxXV_6CEo1fTp3rRbfwfYbe7WH0Cyg38",
  authDomain: "elahmadiya.firebaseapp.com",
  databaseURL: "https://elahmadiya-default-rtdb.firebaseio.com",
  projectId: "elahmadiya",
  storageBucket: "elahmadiya.firebasestorage.app",
  messagingSenderId: "594580767620",
  appId: "1:594580767620:web:f5be3b87d4c704854e53d1"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// --- بيانات اللجان ---
const committeesDB = {
  1: {name: "الفروسات", original: 5929}, 2: {name: "الفروسات", original: 5554}, 3: {name: "أبو الأخضر", original: 4617},
  4: {name: "جديدة المنزلة", original: 9197}, 5: {name: "العامرة", original: 3519}, 6: {name: "جديدة المنزلة", original: 3781},
  7: {name: "عرب زيدان", original: 1848}, 8: {name: "الستايتة", original: 2239}, 9: {name: "كفر حجاج", original: 2689},
  10: {name: "ميت خضير", original: 2204}, 11: {name: "المواجدة", original: 4891}, 12: {name: "البصراط", original: 9075},
  13: {name: "البصراط", original: 8966}, 14: {name: "الطوابرة", original: 4194}, 15: {name: "العمارنة", original: 9886},
  16: {name: "أولاد بانا", original: 1892}, 17: {name: "أولاد حانا", original: 4334}, 18: {name: "القزاقزة", original: 2239},
  19: {name: "الحوته", original: 4400}, 20: {name: "أولاد نور", original: 2290}, 21: {name: "الخلايفة", original: 1904},
  22: {name: "القطشة", original: 2052}, 23: {name: "الجماملة", original: 1868}, 24: {name: "العزيزة", original: 10131},
  25: {name: "العزيزة", original: 10191}, 26: {name: "الأحمدية", original: 4683}, 27: {name: "العربان", original: 560},
  28: {name: "أولاد علم", original: 1342}, 29: {name: "أولاد ناصر", original: 1642}, 30: {name: "ببر هلال", original: 3328},
  31: {name: "الشبول", original: 6250}, 32: {name: "الشبول", original: 5863}, 33: {name: "الرودة", original: 5498},
  34: {name: "ميت شريف", original: 5498}, 35: {name: "بحر حادوث", original: 9792}, 36: {name: "النسايمة", original: 7021},
  37: {name: "النسايمة", original: 6121}, 38: {name: "شارع الثورة", original: 7446}, 39: {name: "شارع الثورة", original: 7447},
  40: {name: "شارع محمد فريد", original: 8538}, 41: {name: "شارع المينا القبلي", original: 7310}, 42: {name: "شارع الدقهلية", original: 8793},
  43: {name: "شارع الدقهلية", original: 8793}, 44: {name: "شارع المينا البحري", original: 7721}, 45: {name: "شارع المينا البحري", original: 7421},
  46: {name: "قرية العصافرة", original: 9704}, 47: {name: "قرية العصافرة", original: 9704}, 48: {name: "قرية الضهير", original: 3119},
  49: {name: "شارع صلاح الدين", original: 8214}, 50: {name: "شارع الدقهلية", original: 6247}, 51: {name: "شارع الدقهلية", original: 6247},
  52: {name: "شارع المينا البحري", original: 6600}, 53: {name: "شارع الثانوية", original: 10721}, 54: {name: "شارع مصنع البصل", original: 7871},
  55: {name: "شارع مصنع البصل", original: 8436}, 56: {name: "شارع بورسعيد", original: 9689}, 57: {name: "هاشم شلباية", original: 10055},
  58: {name: "شارع الزهراء", original: 6975}, 59: {name: "شارع الزهراء", original: 5580}, 60: {name: "سوق الجمعة", original: 10989}
};

// متغيرات النظام
let allLogs = [];
let commStats = {};
let previousCommStats = {}; // لمقارنة القيم وتفعيل الأنيميشن
let isFirstLoad = true; // لمنع الأنيميشن عند فتح الصفحة لأول مرة
let lightToggle = false; // للتبديل بين الأزرق والأخضر

// --- كود الدخول (Login) ---
window.checkEnter = function(e) {
  if(e.key === "Enter") attemptLogin();
}

window.attemptLogin = function() {
  const pass = document.getElementById('password').value;
  if(pass === "521988") {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('dashboard-content').style.display = 'block';
    initDashboard(); // بدء الاتصال بفايربيس بعد الدخول
  } else {
    document.getElementById('error-msg').style.display = 'block';
    document.getElementById('password').value = "";
    document.getElementById('password').focus();
  }
}

// --- بدء النظام ---
function initDashboard() {
  // تهيئة الـ DOM الفارغ للجان لضمان الترتيب
  const container = document.getElementById("grid-container");
  container.innerHTML = "";
  for(let i=1; i<=60; i++) {
    createCommitteeCard(i, committeesDB[i]);
  }

  const rootRef = ref(db, "/");
  onValue(rootRef, (snapshot) => {
    processData(snapshot.val());
  });
}

// إنشاء بطاقة HTML (مرة واحدة فقط)
function createCommitteeCard(id, info) {
  const div = document.createElement("div");
  div.className = "comm-card";
  div.id = `comm-card-${id}`; // معرف فريد للوصول السريع
  div.onclick = () => openModal(id);
  
  div.innerHTML = `
    <div class="comm-top">
      <span class="badge-id">لجنة ${id}</span>
      <span class="comm-target">الهدف: ${info.original.toLocaleString()}</span>
    </div>
    <div class="comm-name">${info.name}</div>
    
    <div class="comm-stats-row">
      <div class="comm-current" id="val-${id}">0</div>
      <div style="font-size:0.8em; font-weight:bold; color:#64748b;" id="perc-${id}">0%</div>
    </div>
    
    <div class="progress-bg">
      <div class="progress-fill" id="bar-${id}"></div>
    </div>
  `;
  document.getElementById("grid-container").appendChild(div);
}

function processData(data) {
  data = data || {};
  allLogs = [];
  
  // تصفير العدادات الحالية مع الاحتفاظ بالسجلات السابقة للمقارنة
  let tempStats = {};
  for(let i=1; i<=60; i++) {
    tempStats[i] = { 
      current: 0, 
      original: committeesDB[i] ? committeesDB[i].original : 0,
      logs: [] 
    };
  }

  // معالجة الأصوات الفردية
  if(data.votes) {
    Object.values(data.votes).forEach(v => {
      const c = v.committee;
      if(tempStats[c]) {
        tempStats[c].current += (v.count || 1);
        tempStats[c].logs.push({type: 'single', val: 1, time: v.timestamp});
        allLogs.push({type: 'single', val: 1, time: v.timestamp});
      }
    });
  }

  // معالجة الأصوات المجمعة
  if(data.bulk_counts) {
    Object.values(data.bulk_counts).forEach(v => {
      const c = v.committee;
      const num = parseInt(v.count);
      if(tempStats[c]) {
        tempStats[c].current += num;
        tempStats[c].logs.push({type: 'bulk', val: num, time: v.timestamp});
        allLogs.push({type: 'bulk', val: num, time: v.timestamp});
      }
    });
  }

  commStats = tempStats;
  
  updateUI();
  calculateAdvancedStats();
  
  // بعد أول تحميل، نغير الحالة لتفعيل الأنيميشن مستقبلاً
  if(isFirstLoad) isFirstLoad = false;
  
  // حفظ الحالة الحالية للمقارنة في المرة القادمة
  previousCommStats = JSON.parse(JSON.stringify(commStats));
}

// --- تحديث الواجهة الذكي (Smart Update) ---
function updateUI() {
  let totalCurrent = 0;
  const totalOriginal = 350757;

  // تحديث كل بطاقة
  for(let i=1; i<=60; i++) {
    const stats = commStats[i];
    const prev = previousCommStats[i] ? previousCommStats[i].current : 0;
    totalCurrent += stats.current;

    // تحديث النصوص والبروجرس
    const percent = stats.original > 0 ? (stats.current / stats.original) * 100 : 0;
    
    const valEl = document.getElementById(`val-${i}`);
    const percEl = document.getElementById(`perc-${i}`);
    const barEl = document.getElementById(`bar-${i}`);
    const cardEl = document.getElementById(`comm-card-${i}`);

    if(valEl) valEl.innerText = stats.current.toLocaleString();
    if(percEl) percEl.innerText = percent.toFixed(1) + "%";
    if(barEl) barEl.style.width = percent + "%";

    // --- منطق الإضاءة (Flash Logic) ---
    // إذا لم يكن أول تحميل، وكانت القيمة الجديدة أكبر من القديمة
    if(!isFirstLoad && stats.current > prev) {
      // إزالة الكلاسات القديمة لإعادة تفعيل الأنيميشن
      cardEl.classList.remove('flash-effect-blue', 'flash-effect-green');
      void cardEl.offsetWidth; // Trick to restart css animation

      // التبديل بين الأزرق والأخضر
      if(lightToggle) {
        cardEl.classList.add('flash-effect-blue');
      } else {
        cardEl.classList.add('flash-effect-green');
      }
      lightToggle = !lightToggle; // عكس الحالة للمرة القادمة
    }
  }

  // تحديث الهيدر
  document.getElementById("total-all").innerText = totalCurrent.toLocaleString();
  document.getElementById("total-remaining").innerText = (totalOriginal - totalCurrent).toLocaleString();
  const totalPercent = ((totalCurrent / totalOriginal) * 100).toFixed(1);
  document.getElementById("percent-all").innerText = totalPercent + "%";
}

// --- حساب الإحصائيات المتقدمة ---
function calculateAdvancedStats() {
  const now = Date.now();
  const oneMinute = 60 * 1000;
  const oneHour = 60 * 60 * 1000;

  // فلترة السجلات
  const votesLastMinute = allLogs.filter(l => (now - l.time) < oneMinute);
  const votesLastHour = allLogs.filter(l => (now - l.time) < oneHour);

  // جمع القيم (لأن بعض السجلات قد تكون +5 أو +10)
  const countMin = votesLastMinute.reduce((acc, curr) => acc + parseInt(curr.val), 0);
  const countHour = votesLastHour.reduce((acc, curr) => acc + parseInt(curr.val), 0);

  // عرض النتائج
  // إذا كانت الدقيقة 0 (لا يوجد نشاط)، نعرض 0
  document.getElementById("speed-min").innerText = countMin;
  
  // المعدل بالساعة (يمكن تحسينه ليكون توقعاً، لكن سنعرض الفعلي في آخر ساعة)
  document.getElementById("speed-hour").innerText = countHour;
}

// --- الفلترة ---
window.filterCommittees = function() {
  const term = document.getElementById("search").value.trim();
  for(let i=1; i<=60; i++) {
    const card = document.getElementById(`comm-card-${i}`);
    if(term === "" || i == term) {
      card.style.display = "flex";
    } else {
      card.style.display = "none";
    }
  }
}

// --- المودال ---
window.openModal = function(id) {
  const stats = commStats[id];
  const info = committeesDB[id];
  
  document.getElementById("m-title").innerText = `لجنة فرعية رقم ${id}`;
  document.getElementById("m-subtitle").innerText = info.name;
  document.getElementById("m-present").innerText = stats.current.toLocaleString();
  document.getElementById("m-original").innerText = stats.original.toLocaleString();

  const logsContainer = document.getElementById("m-logs");
  logsContainer.innerHTML = "";

  const sortedLogs = stats.logs.sort((a,b) => b.time - a.time);

  if(sortedLogs.length === 0) {
    logsContainer.innerHTML = "<div style='text-align:center; padding:20px; color:#94a3b8;'>لا توجد بيانات حتى الآن</div>";
  } else {
    sortedLogs.forEach(log => {
      const dateObj = new Date(log.time);
      const timeStr = dateObj.toLocaleTimeString("ar-EG", {hour: '2-digit', minute:'2-digit', second:'2-digit'});
      
      const div = document.createElement("div");
      div.className = "log-entry";
      
      const typeText = log.type === 'single' ? "ناخب فردي" : "دفعة مجمعة";
      const badgeClass = log.type === 'single' ? "badge-single" : "badge-bulk";
      
      div.innerHTML = `
        <div style="text-align:right;">
          <div style="font-weight:800; color:#1e293b; font-size:0.9em;">${timeStr}</div>
          <div style="font-size:0.8em; color:#64748b;">${typeText}</div>
        </div>
        <div class="log-badge ${badgeClass}">+${log.val}</div>
      `;
      logsContainer.appendChild(div);
    });
  }

  document.getElementById("modal-overlay").style.display = "flex";
};

window.closeModal = function() {
  document.getElementById("modal-overlay").style.display = "none";
};

</script>

</body>
