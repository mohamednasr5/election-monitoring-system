  .login-box {
    background: rgba(30, 41, 59, 0.95); padding: 40px; border-radius: 20px;
    text-align: center; box-shadow: 0 0 50px rgba(59, 130, 246, 0.2); width: 90%; max-width: 400px;
    border: 1px solid #334155; backdrop-filter: blur(10px);
  }
  .login-box h2 { color: #fff; margin-bottom: 20px; font-weight: 900; }
  .pass-input {
    width: 100%; padding: 15px; border-radius: 10px; border: 2px solid #475569;
    background: #020617; color: #fff; font-size: 1.2em; text-align: center; letter-spacing: 5px;
    margin-bottom: 20px; transition: 0.3s;
  }
  .pass-input:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(59, 130, 246, 0.5); }
  .login-btn {
    background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: #fff; border: none;
    padding: 12px 30px; border-radius: 10px; font-size: 1.1em; font-weight: bold;
    cursor: pointer; width: 100%; transition: 0.3s;
  }
  .login-btn:hover { transform: translateY(-3px); }

  /* --- Dashboard --- */
  #dashboard-content { display: none; animation: fadeIn 0.8s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

  .header-stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px;

  .stat-card {
    background: var(--surface); padding: 20px; border-radius: 16px;

    text-align: center; transition: transform 0.3s; position: relative; overflow: hidden;

  .stat-card:hover { transform: translateY(-5px); }
  .stat-value { font-size: 2.2em; font-weight: 900; color: #0f172a; line-height: 1; }
  .stat-label { color: #64748b; font-size: 0.85em; font-weight: 700; margin-top: 8px; }

    background: #fff; padding: 20px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);

    display: flex; gap: 0; align-items: center; background: #f1f5f9; 
    border-radius: 12px; border: 1px solid #cbd5e1; flex: 1; overflow: hidden;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.03);

  .msg-icon-box {
    background: #e2e8f0; padding: 0 20px; height: 50px; display: flex; align-items: center; justify-content: center;

  }
  
  .msg-select { 
    padding: 0 15px; height: 50px; border: none; background: transparent; font-weight: bold; outline: none; cursor: pointer; width: 220px;
  }
  .msg-input { 
    flex: 1; padding: 0 15px; height: 50px; border: none; background: transparent; outline: none; border-right: 1px solid #cbd5e1;
  }
  
  .btn-send-msg {
    padding: 0 25px; height: 50px; border: none; background: #3b82f6; color: white; 
    font-weight: bold; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 8px;

  .btn-send-msg:hover { background: #2563eb; }

  .comm-card {
    background: #fff; border-radius: 16px; padding: 15px; cursor: pointer; transition: all 0.3s;

  @keyframes pulseGlow {
    0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); border-color: #3b82f6; }
    70% { box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); border-color: #3b82f6; }
    100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); border-color: #e2e8f0; }
  }
  .update-anim { animation: pulseGlow 1s ease-out; }

  .comm-header { display: flex; justify-content: space-between; align-items: flex-start; }
  .badge-id { background: #f1f5f9; color: #475569; padding: 2px 8px; border-radius: 6px; font-size: 0.75em; font-weight: 800; }
  .badge-status { width: 10px; height: 10px; border-radius: 50%; background: #cbd5e1; }
  .status-active { background: #10b981; box-shadow: 0 0 8px #10b981; }
  
  .comm-name { font-size: 1em; font-weight: 800; color: #1e293b; margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .comm-sub { font-size: 0.75em; color: #64748b; margin-bottom: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .val-big { font-size: 1.8em; font-weight: 900; color: var(--primary); line-height: 1; }
  .val-small { font-size: 0.8em; color: #94a3b8; font-weight: 600; }

  .progress-bg { height: 6px; background: #f1f5f9; border-radius: 3px; overflow: hidden; margin-top: 10px; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #60a5fa, #2563eb); width: 0%; transition: width 0.6s; }

  /* --- Modal --- */
  .overlay {

window.checkEnter = (e) => { if(e.key === "Enter") attemptLogin(); }
window.attemptLogin = () => {
  const p = document.getElementById('password').value;
  if(p === "521988") {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('dashboard-content').style.display = 'block';
    initDashboard();
  } else {
    document.getElementById('error-msg').style.display = 'block';
  }
}

function initDashboard() {
  const container = document.getElementById("grid-container");
  const select = document.getElementById("msg-target");
  container.innerHTML = "";
  
  for(let i=1; i<=60; i++) {
    const info = committeesDB[i];
    const d = document.createElement("div");
    d.className = "comm-card";
    d.id = `comm-${i}`;
    d.onclick = () => openModal(i);
    d.innerHTML = `
      <div class="comm-header"><span class="badge-id">#${i}</span><div class="badge-status" id="status-${i}"></div></div>
      <div><div class="comm-name">${info.name}</div><div class="comm-sub">${info.address}</div></div>
      <div class="stats-row"><div class="val-big" id="val-${i}">0</div><div class="val-small">/ ${info.original.toLocaleString()}</div></div>
      <div class="progress-bg"><div class="progress-fill" id="bar-${i}"></div></div>
    `;
    container.appendChild(d);

    const opt = document.createElement("option");
    opt.value = i;
    opt.innerText = `لجنة ${i} - ${info.name}`;
    select.appendChild(opt);
  }

  onValue(ref(db, "/"), (snap) => processData(snap.val()));
}

function processData(data) {
  data = data || {};
  allLogs = [];
  let tempStats = {};
  
  for(let i=1; i<=60; i++) {
    tempStats[i] = { current:0, original: committeesDB[i].original, logs:[] };
  }

  if(data.votes) Object.values(data.votes).forEach(v => { if(tempStats[v.committee]) { tempStats[v.committee].current += (v.count||1); tempStats[v.committee].logs.push({val:1, time:v.timestamp}); allLogs.push({val:1, time:v.timestamp}); }});
  if(data.bulk_counts) Object.values(data.bulk_counts).forEach(v => { if(tempStats[v.committee]) { const n=parseInt(v.count); tempStats[v.committee].current += n; tempStats[v.committee].logs.push({val:n, time:v.timestamp}); allLogs.push({val:n, time:v.timestamp}); }});
  
  commStats = tempStats;
  updateUI();
  if(currentOpenCommitteeId) renderModalContent(currentOpenCommitteeId);
  isFirstLoad = false;
  previousCommStats = JSON.parse(JSON.stringify(commStats));
}

function updateUI() {
  let totalC = 0; const totalO = 350757;
  for(let i=1; i<=60; i++) {
    const s = commStats[i];
    const prev = previousCommStats[i] ? previousCommStats[i].current : 0;
    totalC += s.current;
    document.getElementById(`val-${i}`).innerText = s.current.toLocaleString();
    const per = s.original > 0 ? (s.current/s.original)*100 : 0;
    document.getElementById(`bar-${i}`).style.width = per + "%";
    const card = document.getElementById(`comm-${i}`);
    if(!isFirstLoad && s.current > prev) {
      card.classList.remove('update-anim'); void card.offsetWidth; card.classList.add('update-anim');
      document.getElementById(`status-${i}`).classList.add('status-active');
    } else if (isFirstLoad && s.current > 0) document.getElementById(`status-${i}`).classList.add('status-active');
  }
  document.getElementById("total-all").innerText = totalC.toLocaleString();
  document.getElementById("percent-all").innerText = ((totalC/totalO)*100).toFixed(1) + "%";
  document.getElementById("total-remaining").innerText = (totalO - totalC).toLocaleString();
  const now = Date.now();
  document.getElementById("speed-min").innerText = allLogs.filter(l => (now - l.time) < 60000).reduce((a,b)=>a+b.val,0);
}

// --- MESSAGING LOGIC ---
window.updateMsgIcon = () => {
  const val = document.getElementById("msg-target").value;
  const visualBox = document.getElementById("msg-icon-visual");
  const btnText = document.getElementById("btn-msg-text");
  const btnIcon = document.getElementById("btn-msg-icon");

  if(val === 'all') {
    // وضع الميكروفون (إذاعة)
    visualBox.innerHTML = '<i class="fa-solid fa-bullhorn" style="color:#ef4444;"></i>';
    btnText.innerText = "إذاعة للكل";
    btnIcon.className = "fa-solid fa-bullhorn";
  } else {
    // وضع الرسالة الفردية
    visualBox.innerHTML = '<i class="fa-solid fa-envelope" style="color:#3b82f6;"></i>';
    btnText.innerText = "إرسال خاص";
    btnIcon.className = "fa-solid fa-paper-plane";
  }
}

window.sendMessage = () => {
  const target = document.getElementById("msg-target").value;
  const text = document.getElementById("msg-text").value;
  if(!text.trim()) { alert("الرجاء كتابة رسالة"); return; }
  
  const msgType = target === 'all' ? "📢 رسالة عامة" : `📩 رسالة للجنة ${target}`;
  
  if(confirm(`تأكيد إرسال ${msgType}؟`)) {
    push(ref(db, 'messages'), {
      target: target, text: text, timestamp: Date.now(), sender: 'Admin'
    }).then(() => {
      alert("تم الإرسال بنجاح");
      document.getElementById("msg-text").value = "";
    }).catch(e => alert("خطأ: " + e));
  }
}

window.confirmReset = () => {
  if(prompt("الرقم السري للتصفير:") === "521988") {
    if(confirm("تنبيه! سيتم حذف كل البيانات!")) {
      set(ref(db, 'votes'), null);
      set(ref(db, 'bulk_counts'), null);
      set(ref(db, 'messages'), null);
      alert("تم التصفير.");
    }
  }
}

window.exportToExcel = () => {
  const data = [["رقم", "اسم", "عنوان", "مقيدين", "حضور", "نسبة"]];
  for(let i=1; i<=60; i++) {
    const s=commStats[i], inf=committeesDB[i], p=s.original>0?((s.current/s.original)*100).toFixed(2)+"%":"0%";
    data.push([i, inf.name, inf.address, inf.original, s.current, p]);
  }
  const wb = XLSX.utils.book_new(), ws = XLSX.utils.aoa_to_sheet(data);
  XLSX.utils.book_append_sheet(wb, ws, "تقرير");
  XLSX.writeFile(wb, "Election_Report.xlsx");
}

window.openModal = (id) => { currentOpenCommitteeId = id; renderModalContent(id); document.getElementById("modal-overlay").style.display = "flex"; }
window.closeModal = () => { currentOpenCommitteeId = null; document.getElementById("modal-overlay").style.display = "none"; }

function renderModalContent(id) {
  const s = commStats[id], info = committeesDB[id], now = Date.now();
  document.getElementById("m-title").innerText = `لجنة ${id}`;
  document.getElementById("m-subtitle").innerText = info.name;
  document.getElementById("m-original").innerText = info.original.toLocaleString();
  document.getElementById("m-present").innerText = s.current.toLocaleString();
  
  document.getElementById("m-rate-min").innerText = s.logs.filter(l => (now - l.time) < 60000).reduce((a,b)=>a+b.val, 0);
  document.getElementById("m-rate-hour").innerText = s.logs.filter(l => (now - l.time) < 3600000).reduce((a,b)=>a+b.val, 0);

  const logs = [...s.logs].sort((a,b)=>b.time - a.time).slice(0,50);
  document.getElementById("m-logs").innerHTML = logs.length ? logs.map(l => `<div class="log-item"><span class="log-time">${new Date(l.time).toLocaleTimeString("ar-EG")}</span><span class="log-v">+${l.val}</span></div>`).join('') : "<div style='text-align:center;padding:10px;color:#999'>لا يوجد نشاط</div>";
}

window.filterCommittees = () => {
  const v = document.getElementById("search").value.trim();
  for(let i=1; i<=60; i++) {
    const el = document.getElementById(`comm-${i}`);
    el.style.display = (v === "" || i == v || committeesDB[i].name.includes(v)) ? "flex" : "none";
  }
}
</script>
