<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>لوحة التحكم المركزية</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; font-family: "Cairo", sans-serif; margin:0; padding:0; }
  body { background: #f3f4f6; color: #1f2937; padding: 20px; }
  
  /* Header Stats */
  .header-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 15px;
    margin-bottom: 25px;
  }
  .stat-card {
    background: #fff; padding: 20px; border-radius: 12px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center;
    border-bottom: 4px solid #667eea;
  }
  .stat-num { font-size: 2.2em; font-weight: 900; color: #111; }
  .stat-label { color: #6b7280; font-size: 0.9em; font-weight: 600; }

  /* Committees Grid */
  .section-title { margin-bottom: 15px; font-weight: 800; color: #374151; display: flex; justify-content: space-between; align-items: center; }
  .comm-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 12px;
  }
  .comm-card {
    background: #fff;
    border-radius: 10px;
    padding: 15px;
    cursor: pointer;
    transition: all 0.2s;
    border: 1px solid #e5e7eb;
    position: relative;
    overflow: hidden;
  }
  .comm-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 15px rgba(0,0,0,0.1);
    border-color: #667eea;
  }
  .comm-id { font-size: 0.85em; color: #6b7280; font-weight: 700; }
  .comm-name { font-size: 0.95em; font-weight: 800; color: #111; margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .comm-val { font-size: 1.4em; font-weight: 900; color: #667eea; }
  .comm-total { font-size: 0.75em; color: #9ca3af; }

  /* Progress Bar inside card */
  .mini-progress { height: 4px; background: #f3f4f6; margin-top: 8px; border-radius: 2px; overflow: hidden; }
  .mini-bar { height: 100%; background: #667eea; width: 0%; transition: width 0.5s; }

  /* Modal (Popup) */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: none; align-items: center; justify-content: center; z-index: 9999;
    backdrop-filter: blur(4px);
  }
  .modal {
    background: #fff; width: 95%; max-width: 500px;
    border-radius: 16px; padding: 25px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.25);
    animation: slideUp 0.3s ease-out;
    max-height: 90vh; display: flex; flex-direction: column;
  }
  @keyframes slideUp { from {transform: translateY(20px); opacity: 0;} to {transform: translateY(0); opacity: 1;} }
  
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .modal-title { font-size: 1.2em; font-weight: 900; color: #111; }
  .close-btn { background: #f3f4f6; border: none; width: 32px; height: 32px; border-radius: 50%; font-weight: bold; cursor: pointer; color: #374151; }
  
  .modal-stats {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;
    background: #f9fafb; padding: 15px; border-radius: 12px; margin-bottom: 20px;
    text-align: center;
  }
  .ms-item h4 { font-size: 1.4em; font-weight: 900; color: #667eea; margin: 0; }
  .ms-item span { font-size: 0.75em; color: #6b7280; font-weight: 700; }

  .log-list { flex: 1; overflow-y: auto; padding-right: 5px; border-top: 1px solid #e5e7eb; padding-top: 10px; }
  .log-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px; border-bottom: 1px solid #f3f4f6;
  }
  .log-item:last-child { border-bottom: none; }
  .log-time { font-weight: 700; color: #374151; font-size: 0.9em; }
  .log-detail { font-size: 0.85em; color: #6b7280; }
  .log-val { font-weight: 900; padding: 4px 8px; border-radius: 6px; font-size: 0.9em; }
  .val-single { background: #dbeafe; color: #1e40af; } /* +1 Blue */
  .val-bulk { background: #d1fae5; color: #065f46; }   /* Bulk Green */

  .search-box { padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; width: 200px; }
</style>
</head>
<body>

<div class="header-stats">
  <div class="stat-card">
    <div class="stat-num" id="total-all">0</div>
    <div class="stat-label">إجمالي الحضور العام</div>
  </div>
  <div class="stat-card" style="border-bottom-color: #10b981;">
    <div class="stat-num" id="total-original">350,757</div>
    <div class="stat-label">القوة التصويتية</div>
  </div>
  <div class="stat-card" style="border-bottom-color: #ef4444;">
    <div class="stat-num" id="total-remaining">0</div>
    <div class="stat-label">المتبقي</div>
  </div>
  <div class="stat-card" style="border-bottom-color: #f59e0b;">
    <div class="stat-num" id="percent-all">0%</div>
    <div class="stat-label">نسبة الحضور</div>
  </div>
</div>

<div class="section-title">
  <span>إحصائيات اللجان (اضغط للتفاصيل)</span>
  <input type="text" id="search" class="search-box" placeholder="بحث برقم اللجنة..." onkeyup="filterGrid()">
</div>

<div class="comm-grid" id="grid-container">
  </div>

<div class="overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="m-title">لجنة 1</div>
        <div style="font-size:0.8em; color:#666;" id="m-subtitle">المدرسة...</div>
      </div>
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>

    <div class="modal-stats">
      <div class="ms-item">
        <h4 id="m-present">0</h4>
        <span>الحضور</span>
      </div>
      <div class="ms-item">
        <h4 id="m-original" style="color:#374151;">0</h4>
        <span>الأصلي</span>
      </div>
      <div class="ms-item">
        <h4 id="m-remaining" style="color:#ef4444;">0</h4>
        <span>المتبقي</span>
      </div>
    </div>
    
    <div style="font-size:0.9em; font-weight:800; margin-bottom:10px; color:#374151;">سجل الإدخال (بالوقت):</div>
    <div class="log-list" id="m-logs">
      </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCxxXV_6CEo1fTp3rRbfwfYbe7WH0Cyg38",
  authDomain: "elahmadiya.firebaseapp.com",
  databaseURL: "https://elahmadiya-default-rtdb.firebaseio.com",
  projectId: "elahmadiya",
  storageBucket: "elahmadiya.firebasestorage.app",
  messagingSenderId: "594580767620",
  appId: "1:594580767620:web:f5be3b87d4c704854e53d1"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// بيانات اللجان (الاسم والعدد الأصلي)
const committeesDB = {
  1: {name: "الفروسات", original: 5929},
  2: {name: "الفروسات", original: 5554},
  3: {name: "أبو الأخضر", original: 4617},
  4: {name: "جديدة المنزلة", original: 9197},
  5: {name: "العامرة", original: 3519},
  6: {name: "جديدة المنزلة", original: 3781},
  7: {name: "عرب زيدان", original: 1848},
  8: {name: "الستايتة", original: 2239},
  9: {name: "كفر حجاج", original: 2689},
  10: {name: "ميت خض", original: 2204},
  11: {name: "المواجدة", original: 4891},
  12: {name: "البضاط", original: 9075},
  13: {name: "البضاط", original: 8966},
  14: {name: "الطوابرة", original: 4194},
  15: {name: "العمارنة", original: 9886},
  16: {name: "أولاد بانا", original: 1892},
  17: {name: "أولاد حانا", original: 4334},
  18: {name: "القزاقزة", original: 2239},
  19: {name: "الحوته", original: 4400},
  20: {name: "أولاد نور", original: 2290},
  21: {name: "الخلايفة", original: 1904},
  22: {name: "القطشة", original: 2052},
  23: {name: "الجماملة", original: 1868},
  24: {name: "العزيزة", original: 10131},
  25: {name: "العزيزة", original: 10191},
  26: {name: "الأحمدية", original: 4683},
  27: {name: "العربان", original: 560},
  28: {name: "أولاد علم", original: 1342},
  29: {name: "أولاد ناصر", original: 1642},
  30: {name: "ببر هلال", original: 3328},
  31: {name: "الشبول", original: 6250},
  32: {name: "الشبول", original: 5863},
  33: {name: "الرودة", original: 5498},
  34: {name: "ميت شريف", original: 5498},
  35: {name: "بحر حادوث", original: 9792},
  36: {name: "النسايمة", original: 7021},
  37: {name: "النسايمة", original: 6121},
  38: {name: "شارع الثورة", original: 7446},
  39: {name: "شارع الثورة", original: 7447},
  40: {name: "شارع محمد فريد", original: 8538},
  41: {name: "شارع المينا القبلي", original: 7310},
  42: {name: "شارع الدقهلية", original: 8793},
  43: {name: "شارع الدقهلية", original: 8793},
  44: {name: "شارع المينا البحري", original: 7721},
  45: {name: "شارع المينا البحري", original: 7421},
  46: {name: "قرية العصافرة", original: 9704},
  47: {name: "قرية العصافرة", original: 9704},
  48: {name: "قرية الضهير", original: 3119},
  49: {name: "شارع صلاح الدين", original: 8214},
  50: {name: "شارع الدقهلية", original: 6247},
  51: {name: "شارع الدقهلية", original: 6247},
  52: {name: "شارع المينا البحري", original: 6600},
  53: {name: "شارع الثانوية", original: 10721},
  54: {name: "شارع مصنع البصل", original: 7871},
  55: {name: "شارع مصنع البصل", original: 8436},
  56: {name: "شارع بورسعيد", original: 9689},
  57: {name: "هاشم شلباية", original: 10055},
  58: {name: "شارع الزهراء", original: 6975},
  59: {name: "شارع الزهراء", original: 5580},
  60: {name: "سوق الجمعة", original: 10989}
};

let allLogs = []; // To store all operations
let commStats = {}; // To store aggregated stats per committee

const rootRef = ref(db, "/");

onValue(rootRef, (snapshot) => {
  const data = snapshot.val() || {};
  allLogs = [];
  
  // Reset stats
  for(let i=1; i<=60; i++) {
    commStats[i] = { 
      current: 0, 
      original: committeesDB[i] ? committeesDB[i].original : 0,
      logs: [] 
    };
  }

  // Process Individual Votes
  if(data.votes) {
    Object.values(data.votes).forEach(v => {
      const c = v.committee;
      if(commStats[c]) {
        commStats[c].current += (v.count || 1);
        allLogs.push({c: c, type: 'single', val: 1, time: v.timestamp});
        commStats[c].logs.push({type: 'single', val: 1, time: v.timestamp});
      }
    });
  }

  // Process Bulk Counts
  if(data.bulk_counts) {
    Object.values(data.bulk_counts).forEach(v => {
      const c = v.committee;
      const num = parseInt(v.count);
      if(commStats[c]) {
        commStats[c].current += num;
        allLogs.push({c: c, type: 'bulk', val: num, time: v.timestamp});
        commStats[c].logs.push({type: 'bulk', val: num, time: v.timestamp});
      }
    });
  }

  updateHeader();
  renderGrid();
});

function updateHeader() {
  let totalCurrent = 0;
  let totalOriginal = 350757; 

  Object.values(commStats).forEach(s => totalCurrent += s.current);

  document.getElementById("total-all").innerText = totalCurrent.toLocaleString();
  document.getElementById("total-remaining").innerText = (totalOriginal - totalCurrent).toLocaleString();
  
  const percent = totalOriginal > 0 ? ((totalCurrent / totalOriginal) * 100).toFixed(1) : 0;
  document.getElementById("percent-all").innerText = percent + "%";
}

function renderGrid() {
  const container = document.getElementById("grid-container");
  const searchTerm = document.getElementById("search").value.trim();
  container.innerHTML = "";

  for(let i=1; i<=60; i++) {
    const stats = commStats[i];
    const info = committeesDB[i] || {name: "غير معروف"};

    // Search Filter
    if(searchTerm && i != searchTerm) continue;

    const percent = stats.original > 0 ? (stats.current / stats.original) * 100 : 0;

    const div = document.createElement("div");
    div.className = "comm-card";
    div.onclick = () => openModal(i);
    div.innerHTML = `
      <div style="display:flex; justify-content:space-between;">
        <div class="comm-id">لجنة ${i}</div>
        <div class="comm-total">الهدف: ${stats.original}</div>
      </div>
      <div class="comm-name">${info.name}</div>
      <div class="comm-val">${stats.current}</div>
      <div class="mini-progress">
        <div class="mini-bar" style="width:${percent}%"></div>
      </div>
    `;
    container.appendChild(div);
  }
}

window.filterGrid = renderGrid;

window.openModal = function(id) {
  const stats = commStats[id];
  const info = committeesDB[id];
  
  document.getElementById("m-title").innerText = `لجنة رقم ${id}`;
  document.getElementById("m-subtitle").innerText = info.name;
  
  document.getElementById("m-present").innerText = stats.current;
  document.getElementById("m-original").innerText = stats.original;
  document.getElementById("m-remaining").innerText = stats.original - stats.current;

  const logsContainer = document.getElementById("m-logs");
  logsContainer.innerHTML = "";

  // Sort logs desc
  const sortedLogs = stats.logs.sort((a,b) => b.time - a.time);

  if(sortedLogs.length === 0) {
    logsContainer.innerHTML = "<div style='text-align:center; padding:20px; color:#999;'>لا يوجد نشاط مسجل حتى الآن</div>";
  } else {
    sortedLogs.forEach(log => {
      const dateObj = new Date(log.time);
      const timeStr = dateObj.toLocaleTimeString("ar-EG", {hour: '2-digit', minute:'2-digit'});
      
      const item = document.createElement("div");
      item.className = "log-item";
      
      const typeText = log.type === 'single' ? "إضافة ناخب فردي" : "إضافة عدد (جملة)";
      const valClass = log.type === 'single' ? "val-single" : "val-bulk";
      
      item.innerHTML = `
        <div>
          <div class="log-time">${timeStr}</div>
          <div class="log-detail">${typeText}</div>
        </div>
        <div class="log-val ${valClass}">+${log.val}</div>
      `;
      logsContainer.appendChild(item);
    });
  }

  document.getElementById("modal-overlay").style.display = "flex";
};

window.closeModal = function() {
  document.getElementById("modal-overlay").style.display = "none";
};
</script>

</body>
</html>
