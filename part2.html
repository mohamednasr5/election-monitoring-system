<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نموذج إدخال نتائج المرشحين</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
        }
        
        .container {
            width: 100%;
            max-width: 850px;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(to right, #4b6cb7, #182848);
            color: white;
            padding: 25px 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
            font-weight: 700;
        }
        
        .header p {
            font-size: 16px;
            opacity: 0.9;
        }
        
        .form-container {
            padding: 35px 40px;
        }
        
        .form-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 25px;
            margin-bottom: 30px;
        }
        
        .candidate-box {
            flex: 1;
            min-width: 250px;
            background-color: #f8f9fa;
            border-radius: 12px;
            padding: 25px;
            border: 2px solid #e9ecef;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }
        
        .candidate-box:hover {
            border-color: #4b6cb7;
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(75, 108, 183, 0.15);
        }
        
        .candidate-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px dashed #dee2e6;
        }
        
        .candidate-icon {
            background-color: #4b6cb7;
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            margin-left: 15px;
            font-weight: bold;
        }
        
        .candidate-title {
            font-size: 20px;
            font-weight: 700;
            color: #182848;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        .input-group:last-child {
            margin-bottom: 0;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #495057;
            font-size: 16px;
        }
        
        .input-with-icon {
            position: relative;
        }
        
        .input-with-icon input {
            width: 100%;
            padding: 14px 50px 14px 20px;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
            background-color: white;
            color: #333;
        }
        
        .input-with-icon input:focus {
            outline: none;
            border-color: #4b6cb7;
            box-shadow: 0 0 0 3px rgba(75, 108, 183, 0.2);
        }
        
        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #6c757d;
            font-size: 18px;
        }
        
        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #6c757d;
            cursor: pointer;
            font-size: 18px;
        }
        
        .submit-section {
            text-align: center;
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px dashed #dee2e6;
        }
        
        .submit-btn {
            background: linear-gradient(to right, #4b6cb7, #182848);
            color: white;
            border: none;
            padding: 16px 45px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(75, 108, 183, 0.3);
        }
        
        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(75, 108, 183, 0.4);
        }
        
        .submit-btn:active {
            transform: translateY(0);
        }
        
        .footer {
            text-align: center;
            padding: 20px;
            color: #6c757d;
            font-size: 14px;
            background-color: #f8f9fa;
            border-top: 1px solid #e9ecef;
        }
        
        @media (max-width: 768px) {
            .form-row {
                flex-direction: column;
            }
            
            .candidate-box {
                min-width: 100%;
            }
            
            .form-container {
                padding: 25px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-poll"></i> نظام إدخال نتائج المرشحين</h1>
            <p>أدخل نتائج المرشحين الأربعة بكلمات مرور آمنة ومشفرة</p>
        </div>
        
        <div class="form-container">
            <form id="resultsForm">
                <div class="form-row">
                    <!-- المرشح الأول -->
                    <div class="candidate-box">
                        <div class="candidate-header">
                            <div class="candidate-icon">1</div>
                            <div class="candidate-title">المرشح الأول</div>
                        </div>
                        
                        <div class="input-group">
                            <label for="candidate1-name"><i class="fas fa-user"></i> اسم المرشح</label>
                            <div class="input-with-icon">
                                <input type="text" id="candidate1-name" placeholder="أدخل اسم المرشح الأول" required>
                                <div class="input-icon"><i class="fas fa-user-tag"></i></div>
                            </div>
                        </div>
                        
                        <div class="input-group">
                            <label for="candidate1-password"><i class="fas fa-key"></i> كلمة المرور</label>
                            <div class="input-with-icon">
                                <input type="password" id="candidate1-password" class="password-input" placeholder="أدخل كلمة المرور" required>
                                <div class="input-icon"><i class="fas fa-lock"></i></div>
                                <button type="button" class="password-toggle" data-target="candidate1-password">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>
                        
                        <div class="input-group">
                            <label for="candidate1-result"><i class="fas fa-chart-line"></i> النتيجة</label>
                            <div class="input-with-icon">
                                <input type="number" id="candidate1-result" placeholder="أدخل النتيجة العددية" min="0" required>
                                <div class="input-icon"><i class="fas fa-percentage"></i></div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- المرشح الثاني -->
                    <div class="candidate-box">
                        <div class="candidate-header">
                            <div class="candidate-icon">2</div>
                            <div class="candidate-title">المرشح الثاني</div>
                        </div>
                        
                        <div class="input-group">
                            <label for="candidate2-name"><i class="fas fa-user"></i> اسم المرشح</label>
                            <div class="input-with-icon">
                                <input type="text" id="candidate2-name" placeholder="أدخل اسم المرشح الثاني" required>
                                <div class="input-icon"><i class="fas fa-user-tag"></i></div>
                            </div>
                        </div>
                        
                        <div class="input-group">
                            <label for="candidate2-password"><i class="fas fa-key"></i> كلمة المرور</label>
                            <div class="input-with-icon">
                                <input type="password" id="candidate2-password" class="password-input" placeholder="أدخل كلمة المرور" required>
                                <div class="input-icon"><i class="fas fa-lock"></i></div>
                                <button type="button" class="password-toggle" data-target="candidate2-password">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>
                        
                        <div class="input-group">
                            <label for="candidate2-result"><i class="fas fa-chart-line"></i> النتيجة</label>
                            <div class="input-with-icon">
                                <input type="number" id="candidate2-result" placeholder="أدخل النتيجة العددية" min="0" required>
                                <div class="input-icon"><i class="fas fa-percentage"></i></div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="form-row">
                    <!-- المرشح الثالث -->
                    <div class="candidate-box">
                        <div class="candidate-header">
                            <div class="candidate-icon">3</div>
                            <div class="candidate-title">المرشح الثالث</div>
                        </div>
                        
                        <div class="input-group">
                            <label for="candidate3-name"><i class="fas fa-user"></i> اسم المرشح</label>
                            <div class="input-with-icon">
                                <input type="text" id="candidate3-name" placeholder="أدخل اسم المرشح الثالث" required>
                                <div class="input-icon"><i class="fas fa-user-tag"></i></div>
                            </div>
                        </div>
                        
                        <div class="input-group">
                            <label for="candidate3-password"><i class="fas fa-key"></i> كلمة المرور</label>
                            <div class="input-with-icon">
                                <input type="password" id="candidate3-password" class="password-input" placeholder="أدخل كلمة المرور" required>
                                <div class="input-icon"><i class="fas fa-lock"></i></div>
                                <button type="button" class="password-toggle" data-target="candidate3-password">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>
                        
                        <div class="input-group">
                            <label for="candidate3-result"><i class="fas fa-chart-line"></i> النتيجة</label>
                            <div class="input-with-icon">
                                <input type="number" id="candidate3-result" placeholder="أدخل النتيجة العددية" min="0" required>
                                <div class="input-icon"><i class="fas fa-percentage"></i></div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- المرشح الرابع -->
                    <div class="candidate-box">
                        <div class="candidate-header">
                            <div class="candidate-icon">4</div>
                            <div class="candidate-title">المرشح الرابع</div>
                        </div>
                        
                        <div class="input-group">
                            <label for="candidate4-name"><i class="fas fa-user"></i> اسم المرشح</label>
                            <div class="input-with-icon">
                                <input type="text" id="candidate4-name" placeholder="أدخل اسم المرشح الرابع" required>
                                <div class="input-icon"><i class="fas fa-user-tag"></i></div>
                            </div>
                        </div>
                        
                        <div class="input-group">
                            <label for="candidate4-password"><i class="fas fa-key"></i> كلمة المرور</label>
                            <div class="input-with-icon">
                                <input type="password" id="candidate4-password" class="password-input" placeholder="أدخل كلمة المرور" required>
                                <div class="input-icon"><i class="fas fa-lock"></i></div>
                                <button type="button" class="password-toggle" data-target="candidate4-password">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>
                        
                        <div class="input-group">
                            <label for="candidate4-result"><i class="fas fa-chart-line"></i> النتيجة</label>
                            <div class="input-with-icon">
                                <input type="number" id="candidate4-result" placeholder="أدخل النتيجة العددية" min="0" required>
                                <div class="input-icon"><i class="fas fa-percentage"></i></div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="submit-section">
                    <button type="submit" class="submit-btn">
                        <i class="fas fa-paper-plane"></i> إرسال النتائج
                    </button>
                </div>
            </form>
        </div>
        
        <div class="footer">
            <p>جميع النتائج محمية بكلمات مرور مشفرة • نظام آمن © 2023</p>
        </div>
    </div>

    <script>
        // إضافة وظيفة إظهار/إخفاء كلمة المرور
        document.querySelectorAll('.password-toggle').forEach(button => {
            button.addEventListener('click', function() {
                const targetId = this.getAttribute('data-target');
                const passwordInput = document.getElementById(targetId);
                const icon = this.querySelector('i');
                
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    icon.classList.remove('fa-eye');
                    icon.classList.add('fa-eye-slash');
                } else {
                    passwordInput.type = 'password';
                    icon.classList.remove('fa-eye-slash');
                    icon.classList.add('fa-eye');
                }
            });
        });
        
        // التحكم في إرسال النموذج
        document.getElementById('resultsForm').addEventListener('submit', function(event) {
            event.preventDefault();
            
            // جمع البيانات من النموذج
            const formData = {
                candidate1: {
                    name: document.getElementById('candidate1-name').value,
                    password: document.getElementById('candidate1-password').value,
                    result: document.getElementById('candidate1-result').value
                },
                candidate2: {
                    name: document.getElementById('candidate2-name').value,
                    password: document.getElementById('candidate2-password').value,
                    result: document.getElementById('candidate2-result').value
                },
                candidate3: {
                    name: document.getElementById('candidate3-name').value,
                    password: document.getElementById('candidate3-password').value,
                    result: document.getElementById('candidate3-result').value
                },
                candidate4: {
                    name: document.getElementById('candidate4-name').value,
                    password: document.getElementById('candidate4-password').value,
                    result: document.getElementById('candidate4-result').value
                }
            };
            
            // في التطبيق الفعلي، هنا ستقوم بإرسال البيانات إلى الخادم
            console.log('بيانات النموذج:', formData);
            
            // عرض رسالة نجاح
            alert('تم إرسال نتائج المرشحين بنجاح! سيتم معالجة البيانات بأمان.');
            
            // إعادة تعيين النموذج (اختياري)
            // this.reset();
            
            // إعادة جميع أزرار إظهار كلمات المرور إلى حالتها الأصلية
            document.querySelectorAll('.password-toggle i').forEach(icon => {
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            });
            
            document.querySelectorAll('.password-input').forEach(input => {
                input.type = 'password';
            });
        });
    </script>
</body>
</html>
