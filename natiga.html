<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>نظام إحصاءات الانتخابات | لوحة التحكم</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<style>
/* =========================================
   🎨 المتغيرات ونظام الألوان (Theme System)
   ========================================= */
:root {
  --bg-body: #0f172a;       /* خلفية الصفحة */
  --bg-card: #1e293b;       /* خلفية البطاقات */
  --bg-input: #334155;      /* خلفية الحقول */
  --text-main: #f1f5f9;     /* النص الأساسي */
  --text-muted: #94a3b8;    /* النص الفرعي */
  
  --primary: #3b82f6;       /* أزرق */
  --success: #10b981;       /* أخضر */
  --danger: #ef4444;        /* أحمر */
  --warning: #f59e0b;       /* برتقالي */
  --accent: #8b5cf6;        /* بنفسجي */

  --radius: 12px;           /* استدارة الحواف */
  --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
}

* { box-sizing: border-box; outline: none; }

body {
  font-family: 'Cairo', sans-serif;
  background-color: var(--bg-body);
  color: var(--text-main);
  margin: 0;
  padding-bottom: 40px;
  line-height: 1.6;
}

/* =========================================
   🔐 شاشة الدخول (Login Modal)
   ========================================= */
.login-screen {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.9);
  backdrop-filter: blur(8px);
  z-index: 999;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.login-box {
  background: var(--bg-card);
  padding: 40px;
  border-radius: 16px;
  width: 100%;
  max-width: 400px;
  text-align: center;
  box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
  border: 1px solid #334155;
}

.login-box h2 { margin: 0 0 10px 0; color: var(--primary); }
.login-note { color: var(--text-muted); margin-bottom: 25px; font-size: 0.9rem; }

.login-input {
  width: 100%;
  padding: 14px;
  background: var(--bg-input);
  border: 2px solid transparent;
  color: white;
  border-radius: var(--radius);
  margin-bottom: 15px;
  text-align: center;
  font-size: 1.2rem;
  transition: 0.3s;
}
.login-input:focus { border-color: var(--primary); background: #1e293b; }

.login-btn {
  width: 100%;
  padding: 14px;
  background: var(--primary);
  color: white;
  border: none;
  border-radius: var(--radius);
  font-size: 1rem;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
}
.login-btn:hover { background: #2563eb; transform: translateY(-2px); }
.login-error { margin-top: 15px; color: var(--danger); font-weight: bold; min-height: 24px; }

/* =========================================
   🏠 التخطيط العام (Layout)
   ========================================= */
.container {
  max-width: 1280px;
  margin: 0 auto;
  padding: 20px;
}

/* الرأس */
header {
  text-align: center;
  margin-bottom: 30px;
  border-bottom: 1px solid #334155;
  padding-bottom: 20px;
}

.headline {
  font-size: 2rem;
  margin: 0;
  background: linear-gradient(90deg, var(--primary), var(--accent));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  font-weight: 900;
}

.subtitle { color: var(--text-muted); font-size: 1rem; margin-top: 5px; }

/* حالة الاتصال */
.status-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-card);
  padding: 10px 20px;
  border-radius: var(--radius);
  margin-bottom: 25px;
  border: 1px solid #334155;
  flex-wrap: wrap;
  gap: 10px;
}
.status-badge {
  color: var(--success);
  font-weight: bold;
  display: flex;
  align-items: center;
  gap: 8px;
}
.day-selector select {
  background: var(--bg-input);
  color: white;
  border: 1px solid #475569;
  padding: 8px 15px;
  border-radius: 8px;
  cursor: pointer;
}

/* =========================================
   📊 البطاقات (Stats Cards)
   ========================================= */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 20px;
  margin-bottom: 30px;
}

.card {
  background: var(--bg-card);
  padding: 20px;
  border-radius: var(--radius);
  text-align: center;
  box-shadow: var(--shadow);
  border-top: 4px solid transparent;
  transition: transform 0.2s;
}
.card:hover { transform: translateY(-5px); }

.card.blue { border-color: var(--primary); }
.card.green { border-color: var(--success); }
.card.red { border-color: var(--danger); }
.card.purple { border-color: var(--accent); }

.card-title { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 8px; }
.card-num { font-size: 2rem; font-weight: 900; color: var(--text-main); }

/* =========================================
   📝 النماذج (Forms)
   ========================================= */
.main-section {
  background: var(--bg-card);
  padding: 25px;
  border-radius: 16px;
  margin-bottom: 30px;
  box-shadow: var(--shadow);
  border: 1px solid #334155;
}

.section-header {
  margin-bottom: 20px;
  font-size: 1.25rem;
  font-weight: 700;
  border-right: 4px solid var(--primary);
  padding-right: 15px;
  color: white;
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 15px;
  margin-bottom: 25px;
}

.input-group label {
  display: block;
  margin-bottom: 6px;
  font-size: 0.9rem;
  color: var(--text-muted);
}

.input-group input, .input-group select {
  width: 100%;
  padding: 12px;
  background: var(--bg-input);
  border: 1px solid #475569;
  border-radius: 8px;
  color: white;
  font-size: 1rem;
  transition: 0.2s;
}
.input-group input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }

/* شبكة المرشحين */
.candidates-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 12px;
  margin-bottom: 25px;
  background: #162032;
  padding: 15px;
  border-radius: var(--radius);
}

.cand-item {
  background: var(--bg-input);
  padding: 10px;
  border-radius: 8px;
  text-align: center;
}
.cand-item label {
  display: block;
  font-size: 0.85rem;
  margin-bottom: 5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.cand-item input {
  width: 100%;
  text-align: center;
  background: var(--bg-card);
  border: 1px solid #475569;
  color: var(--warning);
  font-weight: bold;
  padding: 8px;
  border-radius: 6px;
}

.save-btn {
  width: 100%;
  padding: 15px;
  background: var(--success);
  color: white;
  border: none;
  border-radius: var(--radius);
  font-size: 1.1rem;
  font-weight: bold;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  transition: 0.3s;
}
.save-btn:hover { background: #059669; }

/* =========================================
   🕹️ الأزرار والعمليات (Actions)
   ========================================= */
.actions-bar {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 30px;
}
.btn {
  flex: 1;
  min-width: 140px;
  padding: 12px;
  border: none;
  border-radius: var(--radius);
  color: white;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
  background: var(--bg-input);
  border: 1px solid #475569;
}
.btn:hover { background: #475569; }

.btn-export { background: var(--primary); border:none; }
.btn-export:hover { background: #2563eb; }

.btn-danger { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid var(--danger); }
.btn-danger:hover { background: var(--danger); color: white; }

/* =========================================
   📉 الجداول والرسم البياني (Tables & Charts)
   ========================================= */
.chart-container {
  background: var(--bg-card);
  padding: 20px;
  border-radius: 16px;
  margin-bottom: 30px;
  height: 350px;
  position: relative;
}

.table-responsive {
  overflow-x: auto;
  border-radius: var(--radius);
  border: 1px solid #334155;
}

table {
  width: 100%;
  border-collapse: collapse;
  background: var(--bg-card);
  min-width: 600px; /* لمنع الانكماش الزائد */
}

th {
  background: #0f172a;
  padding: 15px;
  text-align: right;
  color: var(--text-muted);
  font-weight: 600;
  border-bottom: 2px solid #334155;
}

td {
  padding: 14px 15px;
  border-bottom: 1px solid #334155;
  color: var(--text-main);
}

tr:hover { background: #334155; }

/* تنسيق خاص لأول 3 مراكز */
tr:nth-child(1) td:first-child { color: #fbbf24; } /* ذهبي */
tr:nth-child(2) td:first-child { color: #94a3b8; } /* فضي */
tr:nth-child(3) td:first-child { color: #b45309; } /* برونزي */

</style>

</head>
<body>

<div id="login-screen" class="login-screen">
  <div class="login-box">
    <h2>🔐 تسجيل الدخول</h2>
    <p class="login-note">أدخل كود النظام للمتابعة</p>

    <input type="password" id="login-pass" placeholder="أدخل الكود هنا" class="login-input" />
    <button class="login-btn" onclick="loginNow()">دخول للنظام</button>

    <div id="login-error" class="login-error"></div>
  </div>
</div>

<div id="main-app" style="display:none;">

<div class="container">

  <header>
    <h1 class="headline">🗳️ نظام رصد الانتخابات</h1>
    <div class="subtitle">تحديث لحظي • واجهة متطورة • دقة عالية</div>
  </header>

  <div class="status-bar">
    <div class="status-badge">
      <span style="width:10px; height:10px; background:var(--success); border-radius:50%; display:inline-block;"></span>
      متصل بقاعدة البيانات
    </div>
    
    <div class="day-selector">
      <select id="day">
        <option value="all">عرض: إجمالي اليومين</option>
        <option value="day1">عرض: اليوم الأول</option>
        <option value="day2">عرض: اليوم الثاني</option>
      </select>
    </div>
  </div>

  <div class="stat-grid" id="stat-cards">
    </div>

  <form id="add-form" autocomplete="off" class="main-section">
    <div class="section-header">➕ إضافة / تعديل لجنة</div>

    <div class="form-grid">
      <div class="input-group">
        <label>رقم اللجنة (1 - 60)</label>
        <input name="num" type="number" min="1" max="60" required placeholder="مثلاً: 5">
      </div>
      <div class="input-group">
        <label>إجمالي الحضور</label>
        <input name="total" type="number" required placeholder="0">
      </div>
      <div class="input-group">
        <label style="color:var(--success)">🟢 الأصوات الصحيحة</label>
        <input name="valid" type="number" required placeholder="0" style="border-color:var(--success)">
      </div>
      <div class="input-group">
        <label style="color:var(--danger)">🔴 الأصوات الباطلة</label>
        <input name="invalid" type="number" required placeholder="0" style="border-color:var(--danger)">
      </div>
    </div>

    <div style="margin-bottom:10px; font-weight:bold; color:var(--warning)">🔻 توزيع أصوات المرشحين:</div>
    <div class="candidates-grid cand-row">
      </div>

    <div class="form-grid">
        <div class="input-group">
            <label>تحديد اليوم لهذه اللجنة:</label>
            <select name="add_day">
                <option value="day1">اليوم الأول</option>
                <option value="day2">اليوم الثاني</option>
            </select>
        </div>
    </div>

    <button type="submit" class="save-btn">
      <span>💾 حفظ بيانات اللجنة</span>
    </button>
  </form>

  <div class="actions-bar">
    <button class="btn btn-export" id="export-btn">📤 تصدير Excel</button>
    <button class="btn" onclick="window.print()">🖨️ طباعة تقرير</button>
    <button class="btn" onclick="location.reload()">🔄 تحديث الصفحة</button>
    <button class="btn btn-danger" onclick="resetData()">🗑️ تصفير قاعدة البيانات</button>
  </div>

  <div class="chart-container">
    <canvas id="mainChart"></canvas>
  </div>

  <div class="main-section">
    <div class="section-header">🏆 ترتيب المرشحين</div>
    <div class="table-responsive">
      <table id="cand-table">
        <thead>
          <tr>
            <th>#</th>
            <th>المرشح</th>
            <th>الأصوات</th>
            <th>النسبة</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <div class="main-section">
    <div class="section-header">📋 سجل اللجان المدخلة</div>
    <div class="table-responsive">
      <table id="comm-table">
        <thead>
          <tr>
            <th>رقم اللجنة</th>
            <th>إجمالي الأصوات</th>
            <th>صحيحة</th>
            <th>باطلة</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

</div>
</div>

<script>
// 1. نظام الدخول
function loginNow() {
  const pass = document.getElementById("login-pass").value.trim();
  const err = document.getElementById("login-error");
  if (pass === "521988") { 
    document.getElementById("login-screen").style.display = "none";
    document.getElementById("main-app").style.display = "block";
  } else {
    err.textContent = "❌ الكود غير صحيح";
  }
}

// 2. إعدادات Firebase
const firebaseConfig = {
  apiKey: "AIzaSyARV_6b-JA6FkWE5EwqMZeLUi2D5ZGonDI",
  authDomain: "natiga-16c46.firebaseapp.com",
  databaseURL: "https://natiga-16c46-default-rtdb.firebaseio.com",
  projectId: "natiga-16c46",
  storageBucket: "natiga-16c46.firebasestorage.app",
  messagingSenderId: "213324147570",
  appId: "1:213324147570:web:3eff7ea7eddac2c5eb4beb",
  measurementId: "G-TLBTLKY983"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// 3. قائمة المرشحين
const candidates = [
  ["1", "ايهاب العمده", "👑"],["2","محمد العتمانى","🍞"],["3","أحمد الحديدى","🦁"],
  ["4","عادل الجيار","🦅"],["5","احمد محمد محمد سمره","💣"],["6","وليد تيسير الامير","🐊"],
  ["7","كمال العيسوى","🌀"],["8","البدوى جميز","🐋"],["9","احمد الريس","🦂"],
  ["10","أحمد عوف","✋"],["11","حسن الملهاط","🌿"],["12","عمرو محمد بحيرى","🚌"],
  ["13","السيد طمان","🔫"],["14","محمد دندن","🚁"],["15","مجدى الأمير","🖊"]
];

// توليد HTML المرشحين داخل النموذج
document.querySelector(".cand-row").innerHTML =
  candidates.map(([id,name,emj]) =>
    `<div class="cand-item">
       <label>${id}. ${name}</label>
       <input type="number" min="0" value="0" name="cand_${id}" placeholder="${emj}">
     </div>`
  ).join("");

let allCommittees = [];
let chartInstance;

// 4. جلب البيانات
db.ref("committees").on("value", snap => {
  allCommittees = [];
  if (snap.exists()) {
    Object.keys(snap.val()).forEach(id => {
      allCommittees.push({ number: parseInt(id), ...snap.val()[id] });
    });
  }
  renderAll();
});

// 5. إضافة لجنة
document.getElementById("add-form").onsubmit = function(e) {
  e.preventDefault();
  const dt = new FormData(e.target);
  const number = parseInt(dt.get("num"));
  const total = parseInt(dt.get("total"));
  const valid = parseInt(dt.get("valid"));
  const invalid = parseInt(dt.get("invalid"));
  const day = dt.get("add_day");

  if (valid + invalid !== total) {
    alert("❌ خطأ: مجموع (الصحيحة + الباطلة) لا يساوي الإجمالي!");
    return;
  }

  let cand = {};
  let sumCandidates = 0;
  candidates.forEach(([id]) => {
    cand[id] = parseInt(dt.get(`cand_${id}`)) || 0;
    sumCandidates += cand[id];
  });

  if (sumCandidates !== valid) {
    alert("❌ خطأ: مجموع أصوات المرشحين لا يساوي الأصوات الصحيحة!");
    return;
  }

  const data = {
    number, totalVotes: total, validVotes: valid, invalidVotes: invalid, day, candidates: cand
  };

  db.ref("committees/" + number).set(data, err => {
    if (err) alert("حدث خطأ");
    else {
        alert("✅ تم حفظ اللجنة رقم " + number);
        e.target.reset(); // تفريغ الحقول بعد الحفظ لسهولة الإدخال التالي
    }
  });
};

// 6. الحسابات
function getFilteredCommittees() {
  const d = document.getElementById("day").value;
  if (d === "all") return allCommittees;
  return allCommittees.filter(c => c.day === d);
}

function calculateTotals() {
  const list = getFilteredCommittees();
  let totals = { totalVotes: 0, validVotes: 0, invalidVotes: 0, candidates: {} };
  candidates.forEach(([id]) => totals.candidates[id] = 0);

  list.forEach(comm => {
    totals.totalVotes += comm.totalVotes;
    totals.validVotes += comm.validVotes;
    totals.invalidVotes += comm.invalidVotes;
    Object.keys(comm.candidates).forEach(id => {
      totals.candidates[id] += comm.candidates[id];
    });
  });
  totals.count = list.length;
  totals.dayName = document.getElementById("day").selectedOptions[0].textContent;
  return totals;
}

// 7. العرض (Rendering)
function renderStats() {
  const t = calculateTotals();
  document.getElementById("stat-cards").innerHTML = `
    <div class="card blue"><div class="card-title">🗳️ إجمالي الأصوات</div><div class="card-num">${t.totalVotes}</div></div>
    <div class="card green"><div class="card-title">✅ الأصوات الصحيحة</div><div class="card-num">${t.validVotes}</div></div>
    <div class="card red"><div class="card-title">❌ الأصوات الباطلة</div><div class="card-num">${t.invalidVotes}</div></div>
    <div class="card purple"><div class="card-title">🏫 عدد اللجان التي فرزت</div><div class="card-num">${t.count} / 60</div></div>
  `;
}

function renderCandidates() {
  const t = calculateTotals();
  let arr = candidates.map(([id,name,emj]) => ({
    name: `${emj} ${name}`,
    votes: t.candidates[id],
    percent: t.validVotes ? ((t.candidates[id] / t.validVotes) * 100).toFixed(2) : 0
  })).sort((a,b) => b.votes - a.votes);

  document.querySelector("#cand-table tbody").innerHTML =
    arr.map((c,i) => `
      <tr>
        <td><span style="font-weight:bold; font-size:1.1rem;">${i+1}</span></td>
        <td>${c.name}</td>
        <td style="font-weight:bold; color:var(--primary);">${c.votes}</td>
        <td>
            <div style="display:flex; align-items:center; gap:10px;">
                <span>${c.percent}%</span>
                <div style="flex:1; height:6px; background:#334155; border-radius:3px; min-width:50px;">
                    <div style="width:${c.percent}%; height:100%; background:var(--primary); border-radius:3px;"></div>
                </div>
            </div>
        </td>
      </tr>`).join("");

  const list = getFilteredCommittees();
  document.querySelector("#comm-table tbody").innerHTML =
    list.map(comm => `
      <tr>
        <td style="font-weight:bold">لجنة ${comm.number}</td>
        <td>${comm.totalVotes}</td>
        <td style="color:var(--success)">${comm.validVotes}</td>
        <td style="color:var(--danger)">${comm.invalidVotes}</td>
      </tr>
    `).join("");
}

function renderChart() {
  const t = calculateTotals();
  let arr = candidates.map(([id,name,emj]) => ({
    name: name.split(" ")[0] + " " + (name.split(" ")[1] || ""), // اختصار الاسم للرسم
    votes: t.candidates[id]
  })).sort((a,b) => b.votes - a.votes);

  const ctx = document.getElementById("mainChart").getContext("2d");
  if (chartInstance) chartInstance.destroy();

  chartInstance = new Chart(ctx, {
    type: "bar",
    data: {
      labels: arr.map(x => x.name),
      datasets: [{
        label: 'عدد الأصوات',
        data: arr.map(x => x.votes),
        backgroundColor: "#3b82f6",
        borderRadius: 5
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        title: { display: true, text: `مؤشرات الفرز - ${t.dayName}`, color: "#94a3b8", font: {size:16} }
      },
      scales: {
        x: { ticks: { color: "#cbd5e1", font: {family: 'Cairo'} }, grid: {display:false} },
        y: { ticks: { color: "#cbd5e1" }, grid: {color: "#334155"} }
      }
    }
  });
}

// 8. التصدير والتصفير
document.getElementById("export-btn").onclick = function () {
  const t = calculateTotals();
  const list = getFilteredCommittees();
  let ws = [];
  ws.push(["تقرير الإحصائيات", t.dayName, new Date().toLocaleString("ar-EG")]);
  ws.push([]);
  ws.push(["الإجمالي", t.totalVotes, "الصحيحة", t.validVotes, "الباطلة", t.invalidVotes]);
  ws.push([]);
  ws.push(["اسم المرشح", "عدد الأصوات"]);
  
  let sortedCand = candidates.map(([id,name]) => ({name, v: t.candidates[id]})).sort((a,b)=> b.v - a.v);
  sortedCand.forEach(c => ws.push([c.name, c.v]));

  ws.push([]);
  ws.push(["رقم اللجنة", "الإجمالي", "الصحيحة", "الباطلة"]);
  list.forEach(comm => ws.push([comm.number, comm.totalVotes, comm.validVotes, comm.invalidVotes]));

  let sheet = XLSX.utils.aoa_to_sheet(ws);
  let wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, sheet, "Results");
  XLSX.writeFile(wb, "Election_Results.xlsx");
};

function resetData() {
  if (confirm("⚠️ تحذير: هل أنت متأكد من حذف كل بيانات اللجان؟ لا يمكن التراجع.")) {
    db.ref("committees").remove();
    alert("تم تصفير البيانات بنجاح.");
  }
}

document.getElementById("day").onchange = renderAll;
function renderAll() {
  renderStats();
  renderCandidates();
  renderChart();
}
</script>
