<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

<style>
:root {
  --bg-body: #0f172a;
  --bg-card: #1e293b;
  --bg-input: #334155;
  --text-main: #f1f5f9;
  --text-muted: #94a3b8;
  --primary: #3b82f6;
  --success: #10b981;
  --danger: #ef4444;
  --warning: #f59e0b;
  --radius: 12px;
}

* { box-sizing: border-box; outline: none; }
body { font-family: 'Cairo', sans-serif; background-color: var(--bg-body); color: var(--text-main); margin: 0; padding-bottom: 40px; }

/* الهيكل العام */
.container { max-width: 1300px; margin: 0 auto; padding: 20px; }
header { text-align: center; margin-bottom: 25px; border-bottom: 1px solid #334155; padding-bottom: 20px; }
.headline { font-size: 2rem; margin: 0; background: linear-gradient(90deg, var(--primary), #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; }

/* شاشة الدخول */
.login-screen { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.95); z-index: 999; display: flex; align-items: center; justify-content: center; }
.login-box { background: var(--bg-card); padding: 40px; border-radius: 16px; width: 100%; max-width: 400px; text-align: center; border: 1px solid #334155; }
.login-input { width: 100%; padding: 12px; background: var(--bg-input); border: none; color: white; border-radius: 8px; margin-bottom: 15px; text-align: center; font-size: 1.1rem; }
.login-btn { width: 100%; padding: 12px; background: var(--success); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }

/* البطاقات */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 25px; }
.card { background: var(--bg-card); padding: 20px; border-radius: var(--radius); text-align: center; border-top: 4px solid transparent; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
.card.blue { border-color: var(--primary); } .card.green { border-color: var(--success); } .card.red { border-color: var(--danger); } .card.purple { border-color: #8b5cf6; }
.card-num { font-size: 1.8rem; font-weight: 900; margin-top: 5px; }

/* أقسام التحليل (الجديد) */
.analysis-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
@media (max-width: 768px) { .analysis-row { grid-template-columns: 1fr; } }

.analysis-box { background: var(--bg-card); padding: 20px; border-radius: 16px; border: 1px solid #334155; }
.box-title { font-weight: bold; margin-bottom: 15px; color: var(--warning); border-bottom: 1px solid #334155; padding-bottom: 10px; }

.vs-container { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
.vs-select { flex: 1; padding: 8px; background: var(--bg-input); border: 1px solid #475569; color: white; border-radius: 8px; }
.vs-badge { background: var(--danger); color: white; padding: 5px 10px; border-radius: 20px; font-weight: bold; font-size: 0.8rem; }

.result-box { background: #0f172a; padding: 15px; border-radius: 8px; text-align: center; min-height: 80px; display: flex; flex-direction: column; justify-content: center; }
.result-highlight { font-size: 1.2rem; font-weight: bold; color: var(--success); }
.result-sub { font-size: 0.9rem; color: var(--text-muted); }

/* الجداول */
table { width: 100%; border-collapse: collapse; background: var(--bg-card); }
th { background: #111827; padding: 12px; color: var(--text-muted); text-align: right; font-size: 0.9rem; }
td { padding: 10px 12px; border-bottom: 1px solid #334155; font-size: 0.95rem; }
.comm-name { font-weight: bold; color: var(--primary); display: block; }
.comm-addr { font-size: 0.8rem; color: var(--text-muted); }

/* أزرار */
.btn { padding: 10px 20px; border-radius: 8px; border: none; color: white; cursor: pointer; font-weight: bold; margin-left: 5px; }
.btn-save { background: var(--success); width: 100%; padding: 15px; font-size: 1.1rem; margin-top: 15px; }
.btn-export { background: var(--primary); }
.btn-danger { background: var(--danger); }

/* نموذج الإدخال */
.form-section { background: var(--bg-card); padding: 25px; border-radius: 16px; margin-bottom: 30px; border: 1px solid #334155; }
.input-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 15px; }
.input-row input, select { width: 100%; padding: 10px; background: var(--bg-input); border: 1px solid #475569; border-radius: 8px; color: white; }
.cand-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; background: #111827; padding: 15px; border-radius: 12px; }
.cand-item { background: var(--bg-input); padding: 8px; border-radius: 6px; text-align: center; }
.cand-item input { text-align: center; color: var(--warning); font-weight: bold; }

</style>
</head>

</div>

db.ref("committees").on("value", snap => {
  allCommittees = [];
  if (snap.exists()) {
    Object.keys(snap.val()).forEach(id => {
        allCommittees.push({ number: parseInt(id), ...snap.val()[id] });
    });
  }
  renderAll();
});

// الإضافة
document.getElementById("add-form").onsubmit = function(e) {
  e.preventDefault();
  const dt = new FormData(e.target);
  const num = parseInt(dt.get("num"));
  const total = parseInt(dt.get("total"));
  const valid = parseInt(dt.get("valid"));
  const invalid = parseInt(dt.get("invalid"));
  
  if(valid + invalid !== total) return alert("مجموع الصحيحة والباطلة غير مطابق للإجمالي");
  
  let cand = {}, sum=0;
  candidates.forEach(([id]) => {
    cand[id] = parseInt(dt.get(`cand_${id}`)) || 0;
    sum += cand[id];
  });
  
  if(sum !== valid) return alert("مجموع أصوات المرشحين لا يساوي الصحيحة");
  
  db.ref("committees/" + num).set({
    number: num, totalVotes: total, validVotes: valid, invalidVotes: invalid, day: dt.get("add_day"), candidates: cand
  }, err => {
      if(!err) { alert("✅ تم الحفظ"); e.target.reset(); document.getElementById("comm-name-hint").textContent=""; }
  });
};

// الحسابات
function getTotals() {
  const d = document.getElementById("day").value;
  const list = (d === "all") ? allCommittees : allCommittees.filter(c => c.day === d);
  
  let t = { total:0, valid:0, invalid:0, cands:{}, list: list };
  candidates.forEach(([id]) => t.cands[id]=0);
  
  list.forEach(c => {
    t.total += c.totalVotes; t.valid += c.validVotes; t.invalid += c.invalidVotes;
    for(let id in c.candidates) t.cands[id] += c.candidates[id];
  });
  return t;
}

    const id2 = document.getElementById("comp2").value;
    const name1 = candidates.find(c=>c[0]==id1)[1];
    const name2 = candidates.find(c=>c[0]==id2)[1];
    
    const v1 = t.cands[id1] || 0;
    const v2 = t.cands[id2] || 0;
    const diff = Math.abs(v1 - v2);
    let leader = (v1 >= v2) ? name1 : name2;
    if(v1 === v2) leader = "تعادل";

    let html = `
        <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
            <div style="text-align:center; width:45%;">
                <div style="font-size:1.5rem; font-weight:bold; color:#3b82f6">${v1}</div>
                <div style="font-size:0.8rem;">${name1}</div>
            </div>
            <div style="text-align:center; width:45%;">
                <div style="font-size:1.5rem; font-weight:bold; color:#ef4444">${v2}</div>
                <div style="font-size:0.8rem;">${name2}</div>
            </div>
        </div>
        <div style="border-top:1px solid #334155; padding-top:10px;">
            الفرق: <span style="color:var(--warning); font-weight:bold; font-size:1.1rem;">${diff}</span> صوت
            <br>
            المتفوق: <span style="color:var(--success)">${leader}</span>
        </div>
    `;
    document.getElementById("comp-result").innerHTML = html;
}

function updateBestComm() {
    const candId = document.getElementById("best-cand-select").value;
    const resBox = document.getElementById("best-comm-result");
    
    if(!candId) {
        resBox.innerHTML = '<span class="text-muted">اختر نائباً للعرض</span>';
        return;
    }

    const t = getTotals(); // تأخذ الفلتر (يوم 1 أو 2 أو الكل)
    
    let maxVotes = -1;
    let bestCommNum = -1;

    // البحث في اللجان المفلترة حالياً
    t.list.forEach(comm => {
        let votes = comm.candidates[candId] || 0;
        if(votes > maxVotes) {
            maxVotes = votes;
            bestCommNum = comm.number;
        }
    });

    if(bestCommNum !== -1 && maxVotes > 0) {
        const commInfo = commMap[bestCommNum] || {name: "لجنة غير معروفة", address: ""};
        resBox.innerHTML = `
            <div class="result-highlight">${commInfo.name}</div>
            <div style="font-size:0.9rem; margin-bottom:5px;">${commInfo.address}</div>
            <div style="background:var(--primary); display:inline-block; padding:2px 10px; borderRadius:4px; margin-top:5px;">
                لجنة رقم ${bestCommNum} : <strong>${maxVotes}</strong> صوت
            </div>
        `;
    } else {
        resBox.innerHTML = `<span style="color:var(--warning)">لا توجد أصوات مسجلة حتى الآن</span>`;
    }
}

// ==========================================
//  العرض الرئيسي (الجداول والرسوم)
// ==========================================

function renderAll() {
  const t = getTotals();
  
  // البطاقات
  document.getElementById("stat-cards").innerHTML = `
    <div class="card blue"><div>إجمالي الأصوات</div><div class="card-num">${t.total}</div></div>
    <div class="card green"><div>الصحيحة</div><div class="card-num">${t.valid}</div></div>
    <div class="card red"><div>الباطلة</div><div class="card-num">${t.invalid}</div></div>
    <div class="card purple"><div>تم فرز</div><div class="card-num">${t.list.length} / 60</div></div>
  `;

  // جدول المرشحين
  let arr = candidates.map(([id,n,e]) => ({
    name: `${e} ${n}`, v: t.cands[id], p: t.valid ? ((t.cands[id]/t.valid)*100).toFixed(1) : 0
  })).sort((a,b) => b.v - a.v);
  
  document.querySelector("#cand-table tbody").innerHTML = arr.map((c,i) => `
    <tr>
        <td>${i+1}</td>
        <td>${c.name}</td>
        <td style="font-weight:bold; color:var(--primary)">${c.v}</td>
        <td>${c.p}%</td>
    </tr>`).join("");

  // جدول اللجان (بتسمية جديدة)
  document.querySelector("#comm-table tbody").innerHTML = t.list.map(c => {
      const info = commMap[c.number] || {name: "لجنة "+c.number, address: ""};
      return `
        <tr>
            <td>
                <span class="comm-name">${c.number}. ${info.name}</span>
                <span class="comm-addr">${info.address}</span>
            </td>
            <td>${c.totalVotes}</td>
            <td style="color:var(--success)">${c.validVotes}</td>
            <td style="color:var(--danger)">${c.invalidVotes}</td>
        </tr>`;
  }).join("");

  // الرسم البياني
  const ctx = document.getElementById("mainChart").getContext("2d");
  if(chartInstance) chartInstance.destroy();
  chartInstance = new Chart(ctx, {
    type: "bar",
    data: {
        labels: arr.map(x => x.name.split(" ")[1]), // الاسم الثاني فقط للاختصار
        datasets: [{ label:"أصوات", data: arr.map(x=>x.v), backgroundColor:"#3b82f6", borderRadius:4 }]
    },
    options: { 
        responsive:true, maintainAspectRatio:false,
        scales: { x: {ticks:{color:"#94a3b8"}}, y: {ticks:{color:"#94a3b8"}, grid:{color:"#334155"}} },
        plugins: { legend:{display:false} }
    }
  });
  
  // تحديث التحليلات المتقدمة تلقائياً عند تغيير البيانات
  updateCompare();
  updateBestComm();
}

// وظائف إضافية
function exportToExcel() {
    const t = getTotals();
    const wb = XLSX.utils.book_new();
    
    // شيت النتائج
    const resData = [["المرشح", "الأصوات"]];
    candidates.forEach(([id,n]) => resData.push([n, t.cands[id]]));
    const ws1 = XLSX.utils.aoa_to_sheet(resData);
    XLSX.utils.book_append_sheet(wb, ws1, "النتائج");
    
    // شيت التفاصيل
    const detData = [["رقم اللجنة", "اسم اللجنة", "الإجمالي", "صحيح", "باطل"]];
    t.list.forEach(c => {
        const info = commMap[c.number] || {name:""};
        detData.push([c.number, info.name, c.totalVotes, c.validVotes, c.invalidVotes]);
    });
    const ws2 = XLSX.utils.aoa_to_sheet(detData);
    XLSX.utils.book_append_sheet(wb, ws2, "اللجان");
    
    XLSX.writeFile(wb, "Election_Result.xlsx");
}

function resetData() {
    if(confirm("⚠️ تحذير نهائي: حذف كل البيانات؟")) db.ref("committees").remove();
}
