<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>نظام إدارة الانتخابات - نسخة المحترفين</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>
:root { --bg-body: #0f172a; --bg-card: #1e293b; --bg-input: #334155; --text-main: #f1f5f9; --text-muted: #94a3b8; --primary: #3b82f6; --success: #10b981; --danger: #ef4444; --warning: #f59e0b; --radius: 12px; }
* { box-sizing: border-box; outline: none; }
body { font-family: 'Cairo', sans-serif; background-color: var(--bg-body); color: var(--text-main); margin: 0;}
.container { max-width: 1300px; margin: 0 auto; padding: 20px; }
header { text-align: center; margin-bottom: 25px; border-bottom: 1px solid #334155; padding-bottom: 20px; }
.headline { font-size: 2rem; margin: 0; background: linear-gradient(90deg, var(--primary), #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; }
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 25px; }
.card { background: var(--bg-card); padding: 20px; border-radius: var(--radius); text-align: center; border-top: 4px solid transparent; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative; overflow: hidden;}
.card:hover { transform: translateY(-10px) scale(1.02); box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4); }
.card.blue { border-color: var(--primary); } .card.green { border-color: var(--success); }
.card.red { border-color: var(--danger); } .card.purple { border-color: #8b5cf6; }
.card-num { font-size: 1.8rem; font-weight: 900; margin-top: 5px; }
.sort-select { padding: 8px 12px; background: var(--bg-input); border: 1px solid #475569; color: white; border-radius: 8px; cursor: pointer; font-size: 0.9rem; margin-right: 10px;}
.analysis-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 30px; }
.analysis-box { background: var(--bg-card); padding: 20px; border-radius: 16px; border: 1px solid #334155; display: flex; flex-direction: column; position: relative; }
.box-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
.box-title { font-weight: bold; color: var(--warning); margin: 0; font-size: 1.1rem; }
.mini-export-btn { background: var(--success); color: white; border: none; border-radius: 6px; padding: 5px 12px; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; gap: 5px; transition:0.2s; }
.mini-export-btn:hover { background: #059669; }
.mini-print-btn { background: #64748b; margin-right: 5px; }
.mini-print-btn:hover { background: #475569; }
.scroll-list { max-height: 250px; overflow-y: auto; width: 100%; padding-right: 5px; }
.scroll-list::-webkit-scrollbar { width: 6px; } .scroll-list::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
table { width: 100%; border-collapse: collapse; background: var(--bg-card); }
th { background: #111827; padding: 12px; color: var(--text-muted); text-align: right; font-size: 0.9rem; }
td { padding: 10px 12px; border-bottom: 1px solid #334155; font-size: 0.95rem; }
.comm-name { font-weight: bold; color: var(--primary); display: block; }
.btn { padding: 10px 20px; border-radius: 8px; border: none; color: white; cursor: pointer; font-weight: bold; margin-left: 5px; }
.btn-export { background: var(--primary); }
.btn-danger { background: var(--danger); }
.main-footer { margin-top: 40px; padding: 30px 0; border-top: 1px solid #334155; text-align: center; color: var(--text-muted); }
.dev-link { color: var(--primary); text-decoration: none; font-weight: bold; }
.dev-link:hover { color: var(--accent); text-decoration: underline; }
.dedication { color: var(--warning); font-weight: bold; display: block; margin-top: 10px; font-size: 1.1rem; }
</style>
</head>
<body>
<div id="main-app" class="container">
  <header>
    <h1 class="headline">🗳️ نظام تحليل الانتخابات المحدث</h1>
    <div style="margin-top:10px;">
      <select id="day" onchange="renderAll()" style="width:auto; display:inline-block; padding:5px 15px;">
        <option value="all">عرض إجمالي اليومين</option>
        <option value="day1">عرض اليوم الأول فقط</option>
        <option value="day2">عرض اليوم الثاني فقط</option>
      </select>
      <select id="log-sort" class="sort-select" onchange="renderAll()">
        <option value="num">رقم اللجنة (1-60)</option>
        <option value="total-desc">الحضور (الأكثر→الأقل)</option>
        <option value="total-asc">الحضور (الأقل→الأكثر)</option>
        <option value="valid-desc">الصحيحة (الأكثر→الأقل)</option>
        <option value="valid-asc">الصحيحة (الأقل→الأكثر)</option>
        <option value="invalid-desc">الباطلة (الأكثر→الأقل)</option>
        <option value="invalid-asc">الباطلة (الأقل→الأكثر)</option>
      </select>
      <button class="btn btn-export" onclick="exportLog()">📥 تصدير حسب الترتيب</button>
    </div>
  </header>
  <div class="stat-grid" id="stat-cards"></div>
  <div class="analysis-row">
    <div id="log-section" style="background:var(--bg-card); border-radius:16px; overflow:hidden;">
        <table id="comm-table">
          <thead><tr><th>اللجنة</th><th>إجمالي</th><th>صحيح</th><th>باطل</th></tr></thead>
          <tbody></tbody>
        </table>
    </div>
  </div>
  <footer class="main-footer">
    <div>تم برمجة الأداة بكل حب من <a href="https://www.facebook.com/en.mohamed.nasr" target="_blank" class="dev-link">المهندس محمد نصر</a></div>
    <span class="dedication"><span>❤️</span> إهداء للحاج أحمد الحديدي <span>❤️</span></span>
  </footer>
</div>
<script>
const commMap = {1:{name:"الفروسات",address:"مدرسة احمد القصبى الابتدائية"},2:{name:"الفروسات",address:"مدرسة احمد القصبى الابتدائية"},3:{name:"أبو الأخضر",address:"مدرسة أبو الأخضر الابتدائية"},4:{name:"جديدة المنزلة",address:"مدرسة الشهيد محمد فوزى"},5:{name:"العامرة",address:"مدرسة العامرة الابتدائية"},6:{name:"جديدة المنزلة",address:"مدرسة عبده بطي الإعدادية"},7:{name:"عرب زيدان",address:"مدرسة عرب زيدان الابتدائية"},8:{name:"الستايتة",address:"مدرسة الشهيد محمد زغلول الابتدائية"},9:{name:"كفر حجاج",address:"مدرسة كفر حجاج الابتدائية"},10:{name:"ميت خض",address:"مدرسة محمد إسماعيل الإعدادية"},11:{name:"المواجدة",address:"مدرسة حسني الشناوى"},12:{name:"البضاط",address:"مدرسة الشهيد محمد المحلاوى الإعدادية"},13:{name:"البضاط",address:"مدرسة الشهيد محمد المحلاوى الإعدادية"},14:{name:"الطوابرة",address:"مدرسة النصر الإعدادية"},15:{name:"العمارنة",address:"مدرسة العمارنة الابتدائية"},16:{name:"أولاد بانا",address:"مدرسة أولاد بانا الابتدائية"},17:{name:"أولاد حانا",address:"مدرسة أولاد حانا الابتدائية"},18:{name:"القزاقزة",address:"مدرسة القزاقزة الابتدائية"},19:{name:"الحوته",address:"مدرسة الشهيد اسلام محمد"},20:{name:"أولاد نور",address:"مدرسة أولاد نور الابتدائية"},21:{name:"الخلايفة",address:"مدرسة الشهيد محمود فهيم الابتدائية"},22:{name:"القطشة",address:"مدرسة القطشة الإعدادية"},23:{name:"الجماملة",address:"مدرسة الجماملة الابتدائية"},24:{name:"العزيزة",address:"مدرسة مجمع العزيزة الابتدائية"},25:{name:"العزيزة",address:"مدرسة مجمع العزيزة الابتدائية"},26:{name:"الأحمدية",address:"مدرسة الاحمدية الابتدائية"},27:{name:"العربان",address:"مدرسة طاهر فرح"},28:{name:"أولاد علم",address:"مدرسة الشني سليم الابتدائية"},29:{name:"أولاد ناصر",address:"مدرسة الدكتور محمد النحاس"},30:{name:"ببر هلال",address:"مدرسة ببر هلال الابتدائية"},31:{name:"الشبول",address:"معهد بني الشبول الأزهرى"},32:{name:"الشبول",address:"معهد بني الشبول الأزهرى"},33:{name:"الرودة",address:"مدرسة الرودة الإعدادية"},34:{name:"ميت شريف",address:"مدرسة أم المؤمنين الابتدائية"},35:{name:"بحر حادوث",address:"مدرسة السيد قطب الإعدادية"},36:{name:"النسايمة",address:"مدرسة النسايمة الابتدائية"},37:{name:"النسايمة",address:"مدرسة النسايمة الابتدائية"},38:{name:"شارع الثورة",address:"مدرسة الشهيد محمود النجدي الثانوية بنات"},39:{name:"شارع الثورة",address:"مدرسة الشهيد محمود النجدي الثانوية بنات"},40:{name:"شارع محمد فريد",address:"معهد فتيات المطرية ع ث"},41:{name:"شارع المينا القبلي",address:"مدرسة أبو بكر الصديق"},42:{name:"شارع الدقهلية",address:"مدرسة أحمد ماهر الثانوية بنين"},43:{name:"شارع الدقهلية",address:"مدرسة أحمد ماهر الثانوية بنين"},44:{name:"شارع المينا البحري",address:"مدرسة العاشر من رمضان الابتدائية"},45:{name:"شارع المينا البحري",address:"مدرسة طارق ابن زياد الأعدادية"},46:{name:"قرية العصافرة",address:"مدرسة السيدة نفسية الاعدادية بنات"},47:{name:"قرية العصافرة",address:"مدرسة السيدة نفسية الاعدادية بنات"},48:{name:"قرية الضهير",address:"مدرسة الضهير الإبتدائية"},49:{name:"شارع صلاح الدين",address:"معهد عثمان بن عفان الابتدائي"},50:{name:"شارع الدقهلية",address:"مدرسة خالد بن الوليد"},51:{name:"شارع الدقهلية",address:"مدرسة خالد بن الوليد"},52:{name:"شارع المينا البحري",address:"مدرسة المطرية الابتدائية"},53:{name:"شارع الثانوية",address:"مدرسة الثانوية بنين"},54:{name:"شارع مصنع البصل",address:"مدرسة عثمان بن عفان الإعدادية"},55:{name:"شارع مصنع البصل",address:"مدرسة عثمان بن عفان الإعدادية"},56:{name:"شارع بورسعيد",address:"مدرسة الأنصاري الابتدائية"},57:{name:"هاشم شلباية",address:"مدرسة هاشم شلباية خلف المستشفى"},58:{name:"شارع الزهراء",address:"مدرسة الزهراء الابتدائية"},59:{name:"شارع الزهراء",address:"مدرسة الزهراء الابتدائية"},60:{name:"سوق الجمعة",address:"مدرسة الامام علي الابتدائية"}};
let allCommittees = [];
function getFirebaseDummy() {
  // يجب ربط البيانات من الفايربيز هنا أو باستخدام باقي الكود القديم لقراءة الجدول
  // مثال بيانات تجريبية
  return [
    {number:1,totalVotes:100,validVotes:80,invalidVotes:20,day:"day1"},
    {number:2,totalVotes:85,validVotes:70,invalidVotes:15,day:"day2"},
    // باقي اللجان حسب الحاجة...
  ];
}
function getTotals() {
  const d = document.getElementById("day").value;
  const list = (d === "all") ? allCommittees : allCommittees.filter(c => c.day === d);
  return { total:0, valid:0, invalid:0, list: list };
}
function renderAll() {
  allCommittees = getFirebaseDummy();
  const t = getTotals();
  document.getElementById("stat-cards").innerHTML = `
    <div class="card blue"><div>إجمالي الأصوات</div><div class="card-num" id="num-total">${t.list.reduce((a,b)=>a+b.totalVotes,0)}</div></div>
    <div class="card green"><div>الصحيحة</div><div class="card-num" id="num-valid">${t.list.reduce((a,b)=>a+b.validVotes,0)}</div></div>
    <div class="card red"><div>الباطلة</div><div class="card-num" id="num-invalid">${t.list.reduce((a,b)=>a+b.invalidVotes,0)}</div></div>
    <div class="card purple"><div>عدد اللجان</div><div class="card-num">${t.list.length}/60</div></div>
  `;
  // ترتيب بناءً على الفلتر
  let sortedList = [...t.list];
  const sortValue = document.getElementById("log-sort").value;
  if(sortValue === "num") { sortedList.sort((a,b)=>a.number-b.number); }
  else if(sortValue === "total-desc") { sortedList.sort((a,b)=>b.totalVotes-a.totalVotes);}
  else if(sortValue === "total-asc") { sortedList.sort((a,b)=>a.totalVotes-b.totalVotes);}
  else if(sortValue === "valid-desc") { sortedList.sort((a,b)=>b.validVotes-a.validVotes);}
  else if(sortValue === "valid-asc") { sortedList.sort((a,b)=>a.validVotes-b.validVotes);}
  else if(sortValue === "invalid-desc") { sortedList.sort((a,b)=>b.invalidVotes-a.invalidVotes);}
  else if(sortValue === "invalid-asc") { sortedList.sort((a,b)=>a.invalidVotes-b.invalidVotes);}
  document.querySelector("#comm-table tbody").innerHTML = sortedList.map(c=>{
    const info = commMap[c.number]||{name:"",address:""};
    return `<tr>
      <td><span class="comm-name">${c.number}. ${info.name}<br><span style="color:#94a3b8">${info.address}</span></span></td>
      <td>${c.totalVotes}</td>
      <td style="color:var(--success)">${c.validVotes}</td>
      <td style="color:var(--danger)">${c.invalidVotes}</td>
    </tr>`;
  }).join("");
}
renderAll();
function exportLog() {
  allCommittees = getFirebaseDummy();
  const t = getTotals();
  let sortedList = [...t.list];
  const sortValue = document.getElementById("log-sort").value;
  if(sortValue === "num") { sortedList.sort((a,b)=>a.number-b.number); }
  else if(sortValue === "total-desc") { sortedList.sort((a,b)=>b.totalVotes-a.totalVotes);}
  else if(sortValue === "total-asc") { sortedList.sort((a,b)=>a.totalVotes-b.totalVotes);}
  else if(sortValue === "valid-desc") { sortedList.sort((a,b)=>b.validVotes-a.validVotes);}
  else if(sortValue === "valid-asc") { sortedList.sort((a,b)=>a.validVotes-b.validVotes);}
  else if(sortValue === "invalid-desc") { sortedList.sort((a,b)=>b.invalidVotes-a.invalidVotes);}
  else if(sortValue === "invalid-asc") { sortedList.sort((a,b)=>a.invalidVotes-b.invalidVotes);}
  const wb = XLSX.utils.book_new();
  let wsData = [];
  wsData.push(["رقم اللجنة","اسم اللجنة","العنوان","الإجمالي","صحيحة","باطلة"]);
  sortedList.forEach(c=>{
    const info = commMap[c.number]||{name:"",address:""};
    wsData.push([c.number,info.name,info.address,c.totalVotes,c.validVotes,c.invalidVotes]);
  });
  const ws = XLSX.utils.aoa_to_sheet(wsData);
  ws['!cols']=[{wch:10},{wch:35},{wch:30},{wch:12},{wch:12},{wch:12}];
  XLSX.utils.book_append_sheet(wb, ws, "سجل اللجان");
  XLSX.writeFile(wb, "Committees_Log_sorted.xlsx");
}
</script>
</body>
</html>
